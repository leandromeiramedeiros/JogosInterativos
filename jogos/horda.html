(()=>{

// celular em pé: o jogo gira 90 graus para ocupar a tela toda (antes ficava uma faixa de 1/4 da tela)
let ROT=false;
function resize(){
  const dpr=window.devicePixelRatio||1,de=document.documentElement,iw=de.clientWidth||innerWidth,ih=de.clientHeight||innerHeight;
  ROT=ih>iw*1.1&&iw<900;document.body.classList.toggle('rot',ROT);

/* ---------- utils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fmt=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function beep(f,d,type,v,sl){
  if(muted||!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,n);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);
  g.gain.setValueAtTime(v||0.04,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}
}

/* ---------- sprites ---------- */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const g=c.getContext('2d');g.scale(2,2);fn(g,w,h);return c}
function flashOf(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#fff';g.fillRect(0,0,f.width,f.height);return f}
function dBat(g,w,h,f){
  const cx=w/2,cy=h/2+1,up=f?-6:4;
  g.lineJoin='round';
  for(const s of[-1,1]){
    g.fillStyle='#6a3fb5';g.strokeStyle='#2a1450';g.lineWidth=1.2;
    g.beginPath();g.moveTo(cx+s*3,cy-3);g.lineTo(cx+s*15,cy+up-5);g.lineTo(cx+s*16,cy+up+3);g.lineTo(cx+s*11,cy+up+1);g.lineTo(cx+s*8,cy+up+5);g.lineTo(cx+s*5,cy+3);g.closePath();g.fill();g.stroke();
  }
  g.fillStyle='#3d2270';g.strokeStyle='#1c0d3c';
  g.beginPath();g.moveTo(cx-6,cy-4);g.lineTo(cx-4,cy-11);g.lineTo(cx-1,cy-6);g.lineTo(cx+1,cy-6);g.lineTo(cx+4,cy-11);g.lineTo(cx+6,cy-4);g.closePath();g.fill();g.stroke();
  g.beginPath();g.ellipse(cx,cy,6.5,7.5,0,0,7);g.fill();g.stroke();
  g.fillStyle='#ff4060';g.beginPath();g.arc(cx-2.6,cy-1.5,1.9,0,7);g.arc(cx+2.6,cy-1.5,1.9,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(cx-2.9,cy-2,0.6,0,7);g.arc(cx+2.3,cy-2,0.6,0,7);g.fill();
  g.beginPath();g.moveTo(cx-2.5,cy+3);g.lineTo(cx-1.5,cy+6);g.lineTo(cx-0.5,cy+3);g.moveTo(cx+0.5,cy+3);g.lineTo(cx+1.5,cy+6);g.lineTo(cx+2.5,cy+3);g.fill();
}
function dSkel(g,w,h,f){
  const cx=w/2,l=f?3:-3;g.lineCap='round';g.strokeStyle='#e4dcc0';g.lineWidth=3;
  g.beginPath();g.moveTo(cx-3,27);g.lineTo(cx-4+l,38);g.moveTo(cx+3,27);g.lineTo(cx+4-l,38);g.moveTo(cx,17);g.lineTo(cx,28);g.stroke();
  g.lineWidth=2;for(let i=0;i<3;i++){const y=19+i*3.3;g.beginPath();g.moveTo(cx-6,y);g.lineTo(cx+6,y);g.stroke()}
  g.lineWidth=2.5;g.beginPath();g.moveTo(cx-6,19);g.lineTo(cx-10,26+l*0.5);g.moveTo(cx+6,19);g.lineTo(cx+10,26-l*0.5);g.stroke();
  g.fillStyle='#f4efdc';g.strokeStyle='#7d755a';g.lineWidth=1;
  g.beginPath();g.arc(cx,9,8,0,7);g.fill();g.stroke();
  g.beginPath();g.rect(cx-5,13,10,5);g.fill();g.stroke();
  g.fillStyle='#2a2418';g.beginPath();g.ellipse(cx-3,8,2.2,2.8,0,0,7);g.ellipse(cx+3,8,2.2,2.8,0,0,7);g.fill();
  g.fillStyle='#ff5040';g.fillRect(cx-3.5,8,1,1.4);g.fillRect(cx+2.5,8,1,1.4);
  g.fillStyle='#2a2418';g.fillRect(cx-0.6,11,1.2,2);
  g.strokeStyle='#7d755a';g.beginPath();g.moveTo(cx-2,15);g.lineTo(cx-2,18);g.moveTo(cx+2,15);g.lineTo(cx+2,18);g.stroke();
}
function dSlime(g,w,h,f){
  const cx=w/2,by=h-3,bw=f?15:17,th=f?20:17;
  const gr=g.createLinearGradient(0,by-th,0,by);gr.addColorStop(0,'#86ff98');gr.addColorStop(1,'#25a845');
  g.fillStyle=gr;g.strokeStyle='#167a30';g.lineWidth=1.5;
  g.beginPath();g.moveTo(cx-bw,by);g.bezierCurveTo(cx-bw,by-th*0.5,cx-bw*0.6,by-th,cx,by-th);g.bezierCurveTo(cx+bw*0.6,by-th,cx+bw,by-th*0.5,cx+bw,by);g.quadraticCurveTo(cx,by+3,cx-bw,by);g.fill();g.stroke();
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(cx-7,by-th+5,4,2.4,-0.5,0,7);g.fill();
  const ey=by-th*0.45;g.fillStyle='#fff';g.beginPath();g.ellipse(cx-5,ey,3.4,4,0,0,7);g.ellipse(cx+5,ey,3.4,4,0,0,7);g.fill();
  g.fillStyle='#10301a';g.beginPath();g.arc(cx-4.6,ey+0.8,1.7,0,7);g.arc(cx+5.4,ey+0.8,1.7,0,7);g.fill();
}
function dOgre(g,w,h,f){
  const cx=w/2,l=f?3:-3;g.lineJoin='round';g.lineWidth=1.6;g.strokeStyle='#3a4818';
  g.fillStyle='#5a6a2c';g.beginPath();g.ellipse(cx-12,60+l*0.4,8,10,0,0,7);g.ellipse(cx+12,60-l*0.4,8,10,0,0,7);g.fill();g.stroke();
  // club
  g.save();g.translate(cx+30,40-l);g.rotate(0.35);g.fillStyle='#7a4a22';g.strokeStyle='#3c2410';

  g.fillStyle='#7a4a22';g.beginPath();g.moveTo(cx-18,52);g.lineTo(cx+18,52);g.lineTo(cx+14,63);g.lineTo(cx-14,63);g.closePath();g.fill();g.stroke();
  g.fillStyle='#7d9440';g.beginPath();g.ellipse(cx-27,38+l*0.5,8,14,0.2,0,7);g.ellipse(cx+27,38-l*0.5,8,14,-0.2,0,7);g.fill();g.stroke();
  g.beginPath();g.arc(cx,17,14,0,7);g.fillStyle='#8aa04a';g.fill();g.stroke();
  g.fillStyle='#8aa04a';g.beginPath();g.ellipse(cx-14,16,3,5,0,0,7);g.ellipse(cx+14,16,3,5,0,0,7);g.fill();g.stroke();
  g.strokeStyle='#2a3410';g.lineWidth=2.4;g.beginPath();g.moveTo(cx-9,11);g.lineTo(cx-2,14);g.moveTo(cx+9,11);g.lineTo(cx+2,14);g.stroke();
  g.fillStyle='#ffe14a';g.beginPath();g.arc(cx-5,16,2.2,0,7);g.arc(cx+5,16,2.2,0,7);g.fill();
  g.fillStyle='#200';g.beginPath();g.arc(cx-5,16.4,1,0,7);g.arc(cx+5,16.4,1,0,7);g.fill();
  g.fillStyle='#2a3410';g.fillRect(cx-6,23,12,4);
  g.fillStyle='#fff';g.beginPath();g.moveTo(cx-6,23);g.lineTo(cx-4,16.5+8);g.lineTo(cx-2,23);g.moveTo(cx+2,23);g.lineTo(cx+4,24.5);g.lineTo(cx+6,23);g.fill();
  g.beginPath();g.moveTo(cx-7,24);g.lineTo(cx-9,17);g.lineTo(cx-4,23);g.moveTo(cx+7,24);g.lineTo(cx+9,17);g.lineTo(cx+4,23);g.fill();
}
const ET={

const ORB=mk(40,40,(g)=>{const gr=g.createRadialGradient(20,20,1,20,20,19);gr.addColorStop(0,'#fff');gr.addColorStop(0.3,'#ff9cf0');gr.addColorStop(0.65,'rgba(190,80,255,.5)');gr.addColorStop(1,'rgba(150,60,255,0)');g.fillStyle=gr;g.fillRect(0,0,40,40)});
const GLOW=mk(64,64,(g)=>{const gr=g.createRadialGradient(32,32,2,32,32,31);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});
const VIG=mk(W,H,(g)=>{const gr=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,10,5,.5)');g.fillStyle=gr;g.fillRect(0,0,W,H)});

/* ---------- ground tiles ---------- */
const TS=64;
function mkTile(kind,seed){
  const c=document.createElement('canvas');c.width=c.height=TS*2;const g=c.getContext('2d');g.scale(2,2);
  let s=seed;const r=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296};
  if(kind==='g'){
    const bases=['#3f8f45','#3b8841','#44944a','#3d8c43'];g.fillStyle=bases[seed%4];g.fillRect(0,0,TS,TS);
    for(let i=0;i<4;i++){g.fillStyle=`rgba(${r()<0.5?'120,200,90':'20,80,40'},.12)`;g.beginPath();g.ellipse(r()*TS,r()*TS,8+r()*14,6+r()*10,r()*3,0,7);g.fill()}
    g.lineCap='round';
    for(let i=0;i<26;i++){const x=r()*TS,y=r()*TS;g.strokeStyle=r()<0.5?'#2f7338':'#5bb35a';g.lineWidth=1.2;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-0.5)*3,y-2-r()*3);g.stroke()}
  }else{
    g.fillStyle='#6b717d';g.fillRect(0,0,TS,TS);
    const n=2;const cw=TS/n;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      const sh=130+((r()*22)|0);g.fillStyle=`rgb(${sh},${sh+4},${sh+14})`;g.strokeStyle='#4a4f5a';g.lineWidth=1.6;
      g.beginPath();g.roundRect?g.roundRect(i*cw+1.5,j*cw+1.5,cw-3,cw-3,6):g.rect(i*cw+1.5,j*cw+1.5,cw-3,cw-3);g.fill();g.stroke();
      g.fillStyle='rgba(255,255,255,.12)';g.fillRect(i*cw+4,j*cw+4,cw-12,3);
    }
    if(seed%2){g.strokeStyle='#3c404a';g.lineWidth=1;g.beginPath();let x=r()*TS,y=r()*TS;g.moveTo(x,y);for(let k=0;k<4;k++){x+=(r()-0.5)*14;y+=(r()-0.5)*14;g.lineTo(x,y)}g.stroke()}
    g.fillStyle='rgba(60,110,60,.25)';for(let i=0;i<3;i++){g.beginPath();g.arc(r()*TS,r()*TS,2+r()*3,0,7);g.fill()}
  }
  return c;
}
const TILES=[mkTile('g',0),mkTile('g',1),mkTile('g',2),mkTile('g',3),mkTile('s',2),mkTile('s',3)];
const isStone=(tx,ty)=>vnoise(tx*0.15+10.3,ty*0.15+3.7)>0.68;
const FLC=['#ffe14a','#ff7fb0','#fff','#9fd0ff','#ff9a4a'];
function drawDeco(tx,ty,px,py,stone){

    else if(h<0.115){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(ox,oy+10,10,4,0,0,7);ctx.fill();ctx.fillStyle='#8c92a0';ctx.strokeStyle='#4a4f5a';ctx.lineWidth=1.5;ctx.fillRect(ox-6,oy-12,12,22);ctx.strokeRect(ox-6,oy-12,12,22);ctx.fillStyle='#a8aebc';ctx.fillRect(ox-8,oy-14,16,5);ctx.strokeRect(ox-8,oy-14,16,5)}

}

/* ---------- spatial hash ---------- */
const CS=80;const grid=new Map(),gpool=[];let qbuf=[],ql=0;
function buildGrid(){
  for(const a of grid.values()){a.length=0;gpool.push(a)}grid.clear();
  for(let i=0;i<enemies.length;i++){const e=enemies[i];const k=Math.floor(e.x/CS)*100003+Math.floor(e.y/CS);let a=grid.get(k);if(!a){a=gpool.pop()||[];grid.set(k,a)}a.push(e)}
}
function query(x,y,r){
  ql=0;const x0=Math.floor((x-r)/CS),x1=Math.floor((x+r)/CS),y0=Math.floor((y-r)/CS),y1=Math.floor((y+r)/CS);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(cx*100003+cy);if(a)for(let i=0;i<a.length;i++)qbuf[ql++]=a[i]}
}

function nearest(x,y,maxd){let b=null,bd=maxd*maxd;for(let i=0;i<enemies.length;i++){const e=enemies[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=e}}return b}

function strike(x,y,dm,R){
  const pts=[[x+rnd(-20,20),y-420]];let cy=y-420;const segs=8;
  for(let i=1;i<segs;i++){cy=y-420+(420*i/segs);pts.push([x+rnd(-28,28),cy])}

}
function updProjs(){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.life-=DT;
    if(p.k==='orb'){
      if(!p.tg||p.tg.dead||(fr+i)%20===0)p.tg=nearest(p.x,p.y,600);
      if(p.tg){let da=Math.atan2(p.tg.y-p.y,p.tg.x-p.x)-p.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;p.a+=clamp(da,-0.09,0.09)}
      p.vx=Math.cos(p.a)*250;p.vy=Math.sin(p.a)*250;
      if(fr%3===0&&parts.length<580)parts.push({x:p.x,y:p.y,vx:0,vy:0,life:0.3,max:0.3,size:4,col:'#e08cff',k:0});
    }else if(p.k==='axe'){p.vy+=820*DT;p.rot+=14*DT}
    p.x+=p.vx*DT;p.y+=p.vy*DT;
    if(p.life<=0){projs[i]=projs[projs.length-1];projs.pop();continue}
    query(p.x,p.y,p.r+34);let gone=false;
    for(let j=0;j<ql;j++){
      const e=qbuf[j];if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,rr=p.r+e.r*e.sc;
      if(dx*dx+dy*dy<rr*rr){
        const sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy)||1;
        if(p.k==='axe'){if(fr-(p.hitT[e.id]||-99)<20)continue;p.hitT[e.id]=fr;dmgE(e,p.dmg,dx>0?160:-160,-40,'#ffe27a')}
        else{if(p.hits.indexOf(e.id)>=0)continue;p.hits.push(e.id);dmgE(e,p.dmg,p.vx/sp*(p.k==='knife'?190:130),p.vy/sp*(p.k==='knife'?190:130),p.k==='orb'?'#ffb0ff':'#fff');
          if(p.k==='orb')addPuff(p.x,p.y,'#e08cff',6,120);
          p.pierce--;if(p.pierce<=0){projs[i]=projs[projs.length-1];projs.pop();gone=true;break}}
      }
    }
    if(gone)continue;
  }
}

/* ---------- level up ---------- */
function gainXp(v){
  xp+=v;
  while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=need(level);pending++;P.hp=Math.min(maxHp(),P.hp+maxHp()*0.1)}
  if(pending>0&&state==='play')openLevelUp();
}
function makeChoices(){
  const pool=[];
  for(const id of WORDER){const o=weps.find(w=>w.id===id);
    if(o){if(o.lv<5)pool.push({kind:'w',id,lv:o.lv+1})}
    else if(weps.length<6){pool.push({kind:'w',id,lv:1});if(weps.length<3)pool.push({kind:'w',id,lv:1})}}
  for(const id of PORDER)if(pas[id]<5)pool.push({kind:'p',id,lv:pas[id]+1});
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
  const out=[];for(const c of pool){if(out.length>=3)break;if(!out.some(o=>o.id===c.id))out.push(c)}
  if(out.length<3)out.push({kind:'heal'});
  if(out.length<3)out.push({kind:'bonus'});
  while(out.length<3)out.push({kind:'bonus'});
  return out;
}
function openLevelUp(){
  lvKind=pending>0?'level':'chest';choices=makeChoices();sel=1;state='levelup';uiT=0;
  beep(520,0.1,'triangle',0.05,400);setTimeout(()=>beep(780,0.15,'triangle',0.05,300),90);
}
function choose(i){
  const c=choices[i];if(!c)return;
  if(c.kind==='w'){const o=weps.find(w=>w.id===c.id);if(o)o.lv++;else addWeapon(c.id)}
  else if(c.kind==='p'){pas[c.id]++;if(c.id==='hp')P.hp=Math.min(maxHp(),P.hp+20)}
  else if(c.kind==='heal')P.hp=Math.min(maxHp(),P.hp+40);
  else bonus+=250;
  beep(660,0.12,'square',0.04,500);
  if(lvKind==='level')pending--;else chestP--;
  if(pending>0||chestP>0)openLevelUp();else{state='play';P.inv=Math.max(P.inv,0.8);uiT=0}
}

/* ---------- end ---------- */
function endGame(win){
  if(state==='over')return;
  state='over';uiT=0;winFlag=win;bannerT=0;
  const secs=Math.floor(t);score=Math.round(kills+secs*5+level*50+bonus);
  const pts=clamp(score,0,50000);
  newBest=score>best;if(newBest){best=score;try{localStorage.setItem('horda_best',String(best))}catch(e){}}
  if(pts>0){try{if(parent!==window)parent.postMessage({tipo:'jogos:fim',pontos:pts,nivel:fmt(t)},'*')}catch(e){}}
  if(win){beep(523,0.2,'triangle',0.06,0);setTimeout(()=>beep(784,0.3,'triangle',0.06,200),180)}
  else beep(200,0.6,'sawtooth',0.07,-150);
}

/* ---------- update ---------- */
function updatePlay(){
  fr++;t+=DT;
  let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
  if(joy.id!==null){const m=Math.hypot(joy.dx,joy.dy)/45;if(m>0.12){const k=Math.min(1,m)/Math.hypot(joy.dx,joy.dy);mx=joy.dx*k;my=joy.dy*k}}
  if(stick.x||stick.y){mx=stick.x;my=stick.y}/* controle analógico */
  let len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len;len=1}
  const sp=150*(1+0.1*pas.speed);
  P.x+=mx*sp*DT;P.y+=my*sp*DT;
  if(len>0.1){P.fx=mx/len;P.fy=my/len;if(Math.abs(mx)>0.1)P.face=mx>0?1:-1;P.walk+=sp*len*DT*0.11}
  if(P.inv>0)P.inv-=DT;if(P.flash>0)P.flash-=DT;
  cam.x=P.x-W/2;cam.y=P.y-H/2;

  // spawning
  spawnT-=DT;
  if(spawnT<=0){
    spawnT=0.33;const target=Math.min(14+t*0.55,400),def=target-enemies.length;
    if(def>0){const n=Math.min(Math.ceil(def/6),8);for(let i=0;i<n;i++)edgeSpawn(pickType())}
  }
  if(t>=ringT){ringT+=50;setBanner('Revoada de morcegos!');const n=18+Math.floor(t/12);for(let i=0;i<n&&enemies.length<520;i++){const a=i/n*6.283,e=makeEnemy('bat',P.x+Math.cos(a)*580,P.y+Math.sin(a)*400);e.spd*=1.15}}
  if(t>=lineT){lineT+=80;setBanner('A horda se aproxima!');const n=14+Math.floor(t/20),a=Math.random()*6.283,ca=Math.cos(a),sa=Math.sin(a);for(let i=0;i<n&&enemies.length<520;i++){const o=(i-n/2)*30;makeEnemy(t>150&&i%5===0?'ogre':'skel',P.x+ca*620-sa*o,P.y+sa*620*0.7+ca*o)}}

  for(const b of bolts){
    const a=b.t/14;ctx.globalAlpha=a;ctx.lineJoin='round';ctx.lineCap='round';
    for(let pass=0;pass<2;pass++){ctx.strokeStyle=pass?'#ffffff':'#ffe14a';ctx.lineWidth=pass?3:9;ctx.beginPath();ctx.moveTo(b.pts[0][0],b.pts[0][1]);for(let i=1;i<b.pts.length;i++)ctx.lineTo(b.pts[i][0],b.pts[i][1]);ctx.stroke()}
    ctx.fillStyle='rgba(255,240,120,.45)';ctx.beginPath();ctx.ellipse(b.x,b.y,b.R*a,b.R*0.6*a,0,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  // particles
  for(const p of parts){
    const a=p.life/p.max;ctx.globalAlpha=a;
    if(p.k===1){ctx.strokeStyle=p.col;ctx.lineWidth=3*a;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.2-a*0.6)+6*(1-a),0,7);ctx.stroke()}
    else{ctx.fillStyle=p.col;const s=p.size*(0.5+a*0.7);ctx.beginPath();ctx.arc(p.x,p.y,s,0,7);ctx.fill()}
  }
  ctx.globalAlpha=1;
  // damage numbers
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.life*2.5);txt(String(x.s),x.x,x.y,x.size,x.col,'center',FD,'#000',3)}
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawHUD(){
  // xp bar
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,20);
  const gr=ctx.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#2b8cff');gr.addColorStop(1,'#4cf0ff');ctx.fillStyle=gr;ctx.fillRect(0,0,W*clamp(xp/xpNeed,0,1),20);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(0,0,W*clamp(xp/xpNeed,0,1),6);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,20,W,2);
  txt('NV '+level,W-12,17,17,'#fff','right',FD,'#0a2a50',3);
  // timer
  txt(fmt(t),W/2,58,38,t>=540?'#ff9a6a':'#fff','center',FD,'#000',5);
  // kills
  txt('ABATES',W-12,50,13,'#cfe6d4','right',FB,'#000',3);txt(String(kills),W-12,76,28,'#ffe27a','right',FD,'#000',4);
  // weapons
  let x=10;
  for(const w of weps){ctx.fillStyle='rgba(0,0,0,.5)';rr(x,28,34,34,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;ctx.stroke();drawIcon(w.id,x+17,45,26);txt(String(w.lv),x+30,60,13,w.lv>=5?'#ffd84a':'#fff','right',FD,'#000',3);x+=38}
  x=10;
  for(const id of PORDER){if(!pas[id])continue;ctx.fillStyle='rgba(0,0,0,.45)';rr(x,68,26,26,6);ctx.fill();drawIcon(id,x+13,81,19);txt(String(pas[id]),x+24,92,11,'#fff','right',FD,'#000',3);x+=29}
  // boss bar
  if(bossE&&!bossE.dead){
    const bw=360,bx=W/2-bw/2,by=84;ctx.fillStyle='rgba(0,0,0,.7)';rr(bx-3,by-3,bw+6,16,6);ctx.fill();ctx.fillStyle='#4a1420';ctx.fillRect(bx,by,bw,10);ctx.fillStyle='#ff4a5a';ctx.fillRect(bx,by,bw*clamp(bossE.hp/bossE.maxhp,0,1),10);
    txt(bossE.name,W/2,by+30,16,'#ffd0d6','center',FD,'#000',4);
  }
  // banner
  if(bannerT>0){const a=Math.min(1,bannerT*2);ctx.globalAlpha=a;txt(banner,W/2,150+(1-a)*-10,34,'#ffe27a','center',FD,'#4a1a00',6);ctx.globalAlpha=1}
  // joystick
  if(joy.id!==null&&state==='play'){
    ctx.globalAlpha=0.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.ox,joy.oy,45,0,7);ctx.fill();ctx.globalAlpha=0.6;const m=Math.hypot(joy.dx,joy.dy),k=m>45?45/m:1;ctx.beginPath();ctx.arc(joy.ox+joy.dx*k,joy.oy+joy.dy*k,20,0,7);ctx.fill();ctx.globalAlpha=1;
  }
}

const BTN={x:W/2-110,y:430,w:220,h:62};
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function drawButton(label,r){
  const pulse=1+Math.sin(uiT*0.08)*0.025;ctx.save();ctx.translate(r.x+r.w/2,r.y+r.h/2);ctx.scale(pulse,pulse);
  const gr=ctx.createLinearGradient(0,-r.h/2,0,r.h/2);gr.addColorStop(0,'#ffd84a');gr.addColorStop(1,'#ff9a1f');
  ctx.fillStyle='rgba(0,0,0,.4)';rr(-r.w/2+3,-r.h/2+6,r.w,r.h,18);ctx.fill();
  ctx.fillStyle=gr;ctx.strokeStyle='#6a3a00';ctx.lineWidth=4;rr(-r.w/2,-r.h/2,r.w,r.h,18);ctx.fill();ctx.stroke();
  txt(label,0,12,34,'#3a1c00','center',FD,'rgba(255,255,255,.5)',2);ctx.restore();
}
function drawMenu(){
  ctx.fillStyle='rgba(5,15,10,.55)';ctx.fillRect(0,0,W,H);
  const by=Math.sin(uiT*0.05)*4;
  txt('HORDA',W/2,128+by,104,'#ff5a3c','center',FD,'#2a0a00',12);
  txt('HORDA',W/2,122+by,104,'#ffc23c','center',FD,null);
  txt('Sobreviva 10 minutos contra a horda!',W/2,168,24,'#fff','center',FB,'#000',4);
  ctx.fillStyle='rgba(0,0,0,.55)';rr(W/2-300,196,600,200,18);ctx.fill();
  const L=[['Mover','WASD / setas / analógico  ou  arraste o dedo'],['Armas','Atacam sozinhas. Só desvie da horda!'],['Gemas','Colete para subir de nível e escolher melhorias'],['Chefes','A cada 3 minutos. Derrote-os e pegue o baú'],['Pausar','P, Esc ou Start  (M liga/desliga o som)']];
  L.forEach((l,i)=>{txt(l[0],W/2-278,232+i*34,20,'#ffd84a','left',FD,'#000',3);ctx.font='700 17px '+FB;ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(l[1],W/2-178,231+i*34)});
  drawButton('Jogar',BTN);
  txt('Recorde: '+best,W/2,520,20,'#cfe6d4','center',FB,'#000',4);
}
function drawOver(){
  const a=Math.min(1,uiT/25);ctx.fillStyle='rgba(5,10,8,'+(0.7*a)+')';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a;
  txt(winFlag?'VITÓRIA!':'VOCÊ CAIU!',W/2,110,78,winFlag?'#ffd84a':'#ff6a5a','center',FD,'#2a0a00',9);
  ctx.fillStyle='rgba(0,0,0,.55)';rr(W/2-220,140,440,250,18);ctx.fill();
  const rows=[['Tempo',fmt(t)],['Abates',String(kills)],['Nível',String(level)]];
  rows.forEach((r,i)=>{txt(r[0],W/2-180,185+i*34,22,'#cfe6d4','left',FB,'#000',3);txt(r[1],W/2+180,185+i*34,26,'#fff','right',FD,'#000',3)});
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(W/2-190,288,380,2);
  txt('Pontos',W/2-180,330,26,'#ffd84a','left',FD,'#000',3);txt(String(score),W/2+180,334,40,'#ffe27a','right',FD,'#000',4);
  txt(newBest?'Novo recorde!':'Recorde: '+best,W/2,372,20,newBest?'#7dff8a':'#cfe6d4','center',FB,'#000',4);
  txt('tempo×5 + abates + nível×50',W/2,402,14,'#9fb8a6','center',FB,'#000',3);
  drawButton('Jogar de novo',{x:W/2-150,y:430,w:300,h:62});
  ctx.globalAlpha=1;
}
function cardRect(i){return{x:93+i*274,y:150,w:250,h:320}}
function drawLevelUp(){
  ctx.fillStyle='rgba(5,10,20,.72)';ctx.fillRect(0,0,W,H);
  const pop=Math.min(1,uiT/14),e=1-Math.pow(1-pop,3);
  txt(lvKind==='chest'?'BAÚ DO CHEFE!':'SUBIU DE NÍVEL!',W/2,92,56*e+10,lvKind==='chest'?'#ffd84a':'#7ddcff','center',FD,'#02122a',8);
  txt('Escolha uma melhoria (1, 2, 3, toque ou controle)',W/2,126,18,'#dfe9f0','center',FB,'#000',3);
  choices.forEach((c,i)=>{
    const r=cardRect(i),ap=clamp((uiT-i*4)/12,0,1),ee=1-Math.pow(1-ap,3);
    ctx.save();ctx.translate(r.x+r.w/2,r.y+r.h/2+(1-ee)*60);const sc=(sel===i?1.04:1)*(0.6+0.4*ee);ctx.scale(sc,sc);ctx.globalAlpha=ee;
    const nw=c.kind==='w'&&c.lv===1;
    const gr=ctx.createLinearGradient(0,-r.h/2,0,r.h/2);gr.addColorStop(0,sel===i?'#35507a':'#26384f');gr.addColorStop(1,'#16212f');
    ctx.fillStyle=gr;ctx.strokeStyle=sel===i?'#ffd84a':(nw?'#7dff8a':'#6a85a8');ctx.lineWidth=sel===i?5:3;rr(-r.w/2,-r.h/2,r.w,r.h,16);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(0,-r.h/2+88,52,0,7);ctx.fill();
    const id=c.kind==='w'||c.kind==='p'?c.id:c.kind==='heal'?'heal':'bonus';
    drawIcon(id,0,-r.h/2+88,78);
    let name,desc,tag;
    if(c.kind==='w'){name=WN[c.id].name;desc=c.lv===1?WN[c.id].desc:WN[c.id].up[c.lv-1];tag=c.lv===1?'NOVA ARMA':'Nv '+(c.lv-1)+'  →  Nv '+c.lv}
    else if(c.kind==='p'){name=PN[c.id].name;desc=PN[c.id].desc;tag=c.lv===1?'NOVO':'Nv '+(c.lv-1)+'  →  Nv '+c.lv}
    else if(c.kind==='heal'){name='Banquete';desc='Recupera 40 de vida.';tag='CURA'}
    else{name='Tesouro';desc='+250 pontos no placar final.';tag='BÔNUS'}
    txt(name,0,-r.h/2+176,26,'#fff','center',FD,'#000',4);
    txt(tag,0,-r.h/2+204,16,nw||c.kind==='bonus'?'#7dff8a':'#ffd84a','center',FD,'#000',3);
    ctx.font='700 16px '+FB;ctx.fillStyle='#dfe9f0';ctx.textAlign='center';wrapT(desc,0,-r.h/2+238,r.w-40,22);
    ctx.fillStyle='rgba(0,0,0,.5)';rr(-r.w/2+10,-r.h/2+10,28,28,8);ctx.fill();txt(String(i+1),-r.w/2+24,-r.h/2+31,20,'#ffd84a','center',FD,null);
    ctx.restore();
  });
}
function drawPause(){
  ctx.fillStyle='rgba(5,10,8,.65)';ctx.fillRect(0,0,W,H);
  txt('PAUSADO',W/2,260,80,'#fff','center',FD,'#000',8);
  txt('Toque, P ou Start para continuar',W/2,310,22,'#cfe6d4','center',FB,'#000',4);
}

function render(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.fillStyle='#0d1a12';ctx.fillRect(0,0,W,H);
  const sx=shake>0?rnd(-shake,shake):0,sy=shake>0?rnd(-shake,shake):0;
  drawWorld(sx,sy);
  ctx.drawImage(VIG,0,0,W,H);
  if(state==='play'||state==='levelup'||state==='paused'||state==='over'){drawHUD()}
  if(state==='menu')drawMenu();
  else if(state==='levelup')drawLevelUp();
  else if(state==='over')drawOver();
  else if(state==='paused')drawPause();
  if(state==='play'&&t<12&&fr>0){ctx.globalAlpha=Math.max(0,Math.min(1,(12-t)/2));txt('Mova-se para desviar. As armas atacam sozinhas!',W/2,H-34,20,'#fff','center',FB,'#000',4);ctx.globalAlpha=1}
}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;let d=(ts-last)/1000;last=ts;if(d>0.25)d=0.25;acc+=d;
  let n=0;while(acc>=DT&&n<6){update();acc-=DT;n++}
  if(n>=6)acc=0;
  render();
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
function lpos(e){
  const r=cv.getBoundingClientRect();
  if(!ROT)return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
  // girado 90 graus no sentido horário: largura do jogo = altura na tela
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  return{x:(.5+(e.clientY-cy)/r.height)*W,y:(.5-(e.clientX-cx)/r.width)*H};
}
function togglePause(){if(state==='play'){state='paused';joy.id=null;joy.dx=joy.dy=0}else if(state==='paused'){state='play'}}
cv.addEventListener('pointerdown',e=>{
  ac();const p=lpos(e);e.preventDefault();
  if(state==='menu'){if(inR(p,BTN)||true)startGame()}
  else if(state==='over'){if(uiT>45&&inR(p,{x:W/2-150,y:430,w:300,h:62}))startGame()}
  else if(state==='levelup'){if(uiT>22)for(let i=0;i<3;i++)if(inR(p,cardRect(i))){sel=i;choose(i);break}}
  else if(state==='paused')togglePause();
  else if(state==='play'&&joy.id===null){joy.id=e.pointerId;joy.ox=p.x;joy.oy=p.y;joy.dx=joy.dy=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
});
cv.addEventListener('pointermove',e=>{if(joy.id===e.pointerId){const p=lpos(e);let dx=p.x-joy.ox,dy=p.y-joy.oy;const m=Math.hypot(dx,dy);if(m>70){joy.ox+=dx/m*(m-70);joy.oy+=dy/m*(m-70);dx=p.x-joy.ox;dy=p.y-joy.oy}joy.dx=dx;joy.dy=dy}});
const upJoy=e=>{if(joy.id===e.pointerId){joy.id=null;joy.dx=joy.dy=0}};
cv.addEventListener('pointerup',upJoy);cv.addEventListener('pointercancel',upJoy);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  ac();const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(c)>=0)e.preventDefault();
  keys[c]=true;
  if(c==='KeyM'){toggleMute();return}
  if(state==='menu'){if(c==='Enter'||c==='Space')startGame()}
  else if(state==='over'){if((c==='Enter'||c==='Space')&&uiT>45)startGame()}
  else if(state==='levelup'){
    if(uiT<22)return;
    if(c==='Digit1'||c==='Numpad1')choose(0);else if(c==='Digit2'||c==='Numpad2')choose(1);else if(c==='Digit3'||c==='Numpad3')choose(2);
    else if(c==='ArrowLeft'||c==='KeyA')sel=(sel+2)%3;else if(c==='ArrowRight'||c==='KeyD')sel=(sel+1)%3;
    else if(c==='Enter'||c==='Space')choose(sel);
  }
  else if(state==='play'){if(c==='KeyP'||c==='Escape')togglePause()}
  else if(state==='paused'){if(c==='KeyP'||c==='Escape'||c==='Enter'||c==='Space')togglePause()}
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();last=0});
function toggleMute(){muted=!muted;document.getElementById('bm').innerHTML=muted?'&#128263;':'&#128266;'}
document.getElementById('bm').addEventListener('click',e=>{ac();toggleMute();e.target.blur()});
document.getElementById('bp').addEventListener('click',e=>{ac();togglePause();e.target.blur()});
/* controle: analógico/direcional anda, Start ou B pausa, A começa e escolhe melhorias */
if(window.Controle){
  Controle.on('quadro',()=>{const p=[0,1,2,3].map(i=>Controle.pad(i)).find(q=>q.conectado);stick.x=p?p.lx:0;stick.y=p?p.ly:0});
  Controle.teclas({cima:'ArrowUp',baixo:'ArrowDown',esquerda:'ArrowLeft',direita:'ArrowRight'},{ativo:()=>state==='play'});
  /* um mapa só para play/pausa: dois mapas com a mesma tecla disparariam duas vezes na troca de estado */
  Controle.teclas({a:['Enter','Space'],b:'Escape',start:'KeyP'},{ativo:()=>state==='play'||state==='paused'});
  Controle.teclas({a:['Enter','Space'],start:'Enter'},{ativo:()=>state==='menu'||state==='over'});
  Controle.teclas({esquerda:'ArrowLeft',direita:'ArrowRight',lb:'ArrowLeft',rb:'ArrowRight',a:['Enter','Space']},{ativo:()=>state==='levelup'});
}
window.__h={info:()=>({state,t,level,kills,n:enemies.length,gems:gems.length,hp:P.hp,fr,weps:weps.map(w=>w.id+w.lv)}),skip:s=>{t+=s},god:()=>{godMode=true},xp:v=>gainXp(v),pick:i=>choose(i),setState:s=>{state=s}};
})();
</script>
