<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voa Voa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2340;--cream:#fff8e8;--o1:#ffa33a;--o2:#ff6a13;--o3:#c24a00}
html,body{margin:0;height:100%}
body{background:#0c1430;color:var(--ink);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{display:block;width:100%;height:100%}
#ui{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;pointer-events:none}
.hide{display:none!important}
.screen{position:absolute;inset:0;pointer-events:none}
.btn{pointer-events:auto;cursor:pointer;font:400 26px/1 'Lilita One',Impact,sans-serif;color:#fff;background:linear-gradient(var(--o1),var(--o2));border:0;border-bottom:6px solid var(--o3);border-radius:999px;padding:14px 38px 12px;box-shadow:0 10px 20px rgba(0,0,0,.25);letter-spacing:.5px}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
#sMenu .titulo{position:absolute;top:44px;left:0;right:0;margin:0;text-align:center;font:400 62px/1 'Lilita One',Impact,sans-serif;color:#fff;letter-spacing:1px;text-shadow:0 5px 0 var(--o3),0 9px 0 #7a2d00,0 14px 22px rgba(0,0,0,.3)}
#sMenu .sub{position:absolute;top:128px;left:0;right:0;margin:0;text-align:center;font-weight:800;font-size:17px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
#sMenu .ajuda{position:absolute;top:372px;left:20px;right:20px;background:var(--cream);border-radius:20px;padding:14px 18px;font-size:16px;line-height:1.45;box-shadow:0 8px 0 rgba(0,0,0,.18)}
#sMenu .ajuda p{margin:6px 0}
#sMenu .ajuda b{font-weight:800}
#btnJogar{position:absolute;left:50%;top:548px;transform:translateX(-50%)}
#btnJogar:active{transform:translate(-50%,3px)}
#sOver{background:rgba(12,20,48,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.tit2{margin:0;font:400 48px/1 'Lilita One',Impact,sans-serif;color:#fff;text-shadow:0 5px 0 var(--o3),0 9px 0 #7a2d00}
.painel{width:280px;background:var(--cream);border-radius:22px;padding:16px 22px 18px;box-shadow:0 10px 0 rgba(0,0,0,.2);text-align:center}
.linha{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;padding:3px 0}
.linha b{font:400 28px/1 'Lilita One',Impact,sans-serif;color:var(--ink)}
.novo{color:#e8590c;font-weight:800;font-size:16px;margin-top:4px}
.medalha{width:96px;height:96px;border-radius:50%;margin:12px auto 4px;display:flex;align-items:center;justify-content:center;font:400 19px/1.1 'Lilita One',Impact,sans-serif;color:var(--ink);border:4px solid rgba(255,255,255,.75);box-shadow:0 6px 0 rgba(0,0,0,.16),inset 0 -6px 0 rgba(0,0,0,.12)}
.nivel{font:400 21px/1 'Lilita One',Impact,sans-serif;margin-top:6px}
#btnSom{position:absolute;right:14px;top:14px;pointer-events:auto;cursor:pointer;font:800 12px/1 Figtree,sans-serif;letter-spacing:1px;padding:8px 12px;border-radius:999px;border:0;background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="ui">
      <div id="sMenu" class="screen">
        <h1 class="titulo">Voa Voa</h1>
        <p class="sub">Ajude o Tuca a atravessar a mata!</p>
        <div class="ajuda">
          <p><b>Toque</b>, <b>clique</b>, <b>Espaço</b> / <b>↑</b> ou <b>A</b> do controle para bater as asas.</p>
          <p>Desvie dos troncos e pegue as moedas (+1 cada).</p>
          <p>Medalhas: Bronze 10 · Prata 25 · Ouro 50 · Platina 100.</p>
        </div>
        <button id="btnJogar" class="btn">Jogar</button>
      </div>
      <div id="sOver" class="screen hide">
        <h2 class="tit2">Fim de jogo</h2>
        <div class="painel">
          <div class="linha"><span>Pontos</span><b id="oPts">0</b></div>
          <div class="linha"><span>Recorde</span><b id="oRec">0</b></div>
          <div id="oNovo" class="novo hide">Novo recorde!</div>
          <div id="medalha" class="medalha">—</div>
          <div id="oNivel" class="nivel">Sem medalha</div>
        </div>
        <button id="btnDeNovo" class="btn">Jogar de novo</button>
      </div>
      <button id="btnSom" type="button">SOM</button>
    </div>
  </div>
</div>
<script src="controle.js?v=1"></script>
<script>
(function(){
'use strict';
const W=360,H=640,GROUND=560,GRAV=0.42,FLAP=-7.4,STEP=1/60,OW=70,SP=200,BX=95,TW=36;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const game=document.getElementById('game'), ui=document.getElementById('ui');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MEDALHAS=[
  {min:100,n:'Platina',c:'#b8f7ff',d:'#3fa6c4'},
  {min:50,n:'Ouro',c:'#ffe27a',d:'#c98a00'},
  {min:25,n:'Prata',c:'#f1f4f8',d:'#8d97a8'},
  {min:10,n:'Bronze',c:'#e0944f',d:'#8a4a1c'}
];
const medalOf=s=>MEDALHAS.find(m=>s>=m.min)||null;

// palettes: [day, sunset, night]
const PAL={
  skyT:[[96,190,255],[255,118,110],[18,22,64]],
  skyB:[[210,240,255],[255,206,120],[64,38,104]],
  farH:[[150,220,190],[214,130,150],[44,50,98]],
  nearH:[[92,196,128],[150,90,120],[28,60,80]],
  sand:[[236,200,128],[222,160,110],[120,96,90]],
  grass:[[111,209,107],[150,190,90],[60,110,80]],
  cloud:[[255,255,255],[255,226,220],[150,150,200]],
  sun:[[255,240,170],[255,150,90],[230,230,255]]
};

const G={state:'menu',t:0,ph2:0,score:0,best:0,speed:1.4,scroll:0,obs:[],coins:[],parts:[],clouds:[],stars:[],
  shake:0,flash:0,acc:0,last:0,paused:false,dyingT:0,overT:0,flapT:0,nextX:0,center:300,posted:false,medal:null,newBest:false};
const bird={x:180,y:330,vy:0,ang:0,squash:0,r:19};

function col(k){
  const p=G.ph2, pal=PAL[k];
  let A,B,t;
  if(p<=1){A=pal[0];B=pal[1];t=p;} else {A=pal[1];B=pal[2];t=p-1;}
  return 'rgb('+((A[0]+(B[0]-A[0])*t)|0)+','+((A[1]+(B[1]-A[1])*t)|0)+','+((A[2]+(B[2]-A[2])*t)|0)+')';
}

// ---------- storage (try/catch) ----------
function loadBest(){ try{ return +localStorage.getItem('voa-voa-recorde')||0; }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('voa-voa-recorde',String(v)); }catch(e){} }
let muted=false;
try{ muted=localStorage.getItem('voa-voa-mudo')==='1'; }catch(e){}

// ---------- sound (optional) ----------
let AC=null;
function tone(f1,f2,dur,type,vol){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
const SFX={
  flap:()=>tone(520,840,0.12,'triangle',0.18),
  coin:()=>tone(880,1320,0.1,'square',0.06),
  score:()=>tone(660,990,0.1,'sine',0.14),
  hit:()=>tone(340,50,0.45,'sawtooth',0.18)
};

// ---------- layout ----------
function resize(){
  const s=Math.min(innerWidth/W, innerHeight/H);
  const w=Math.max(120,Math.floor(W*s)), h=Math.max(160,Math.floor(H*s));
  game.style.width=w+'px'; game.style.height=h+'px';
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ui.style.transform='scale('+(w/W)+','+(h/H)+')';
}

// ---------- world helpers ----------
function gapFor(s){ return Math.max(122, 178-s*1.1); }
function speedFor(s){ return clamp(2.4+s*0.05,2.4,4.2); }
function spawnObs(){
  const s=G.score, gap=gapFor(s);
  const md = s<8 ? 16 : Math.min(105, 40+s*2.2);
  let c=G.center+(Math.random()*2-1)*md;
  c=clamp(c, gap/2+36, GROUND-gap/2-36);
  G.center=c;
  const o={x:G.nextX,c:c,gap:gap,passed:false};
  G.obs.push(o);
  if(Math.random()<0.4){
    for(let k=0;k<3;k++) G.coins.push({x:o.x+OW+22+k*22,y:c,got:false,ph:k*0.7});
  }
  G.nextX+=SP;
}
function resetWorld(){
  G.score=0; G.obs=[]; G.coins=[]; G.parts=[]; G.shake=0; G.flash=0;
  G.posted=false; G.dyingT=0; G.overT=0; G.medal=null; G.newBest=false;
  G.nextX=W+40; G.center=300;
  while(G.nextX<W*2) spawnObs();
}
function moveWorld(sp){
  for(const o of G.obs) o.x-=sp;
  for(const c of G.coins) c.x-=sp;
  G.nextX-=sp; G.scroll+=sp;
}
function hitRect(cx,cy,r,x,y,w,h){
  const nx=clamp(cx,x,x+w), ny=clamp(cy,y,y+h);
  const dx=cx-nx, dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function burst(x,y,n,cols,sp,life,g){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=sp*(0.4+Math.random()*0.8);
    G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*0.3,life:life,max:life,
      c:cols[(Math.random()*cols.length)|0], r:2+Math.random()*3, g:g});
  }
  if(G.parts.length>260) G.parts.splice(0,G.parts.length-260);
}

// ---------- state machine ----------
function startReady(){
  resetWorld();
  G.state='ready'; G.speed=1.4;
  bird.vy=0; bird.squash=0; bird.ang=0; bird.y=300;
  $('sMenu').classList.add('hide');
  $('sOver').classList.add('hide');
}
function flap(){
  bird.vy=FLAP; G.flapT=0.2; bird.squash=1;
  SFX.flap();
  burst(bird.x-14,bird.y+8,3,['#ffffff','#d6f3ff'],1.2,0.35,0.02);
}
function action(){
  if(G.state==='ready'){ G.state='play'; flap(); }
  else if(G.state==='play'){ flap(); }
}
function die(){
  if(G.state!=='play') return;
  G.state='dying'; G.dyingT=0; G.shake=16; G.flash=1; bird.vy=-5; bird.squash=0;
  SFX.hit();
  burst(bird.x,bird.y,22,['#ff7a18','#1f2b4d','#fff6e6'],4,1.2,0.25);
  G.medal=medalOf(G.score);
  G.newBest=G.score>0 && G.score>G.best;
  if(G.newBest){ G.best=G.score; saveBest(G.best); }
  if(!G.posted){
    G.posted=true;
    const nivel=G.medal?G.medal.n:'Sem medalha';
    const P=Math.min(50000,Math.max(0,Math.round(G.score*10)));
    if(P>0){ try{ if(parent!==window) parent.postMessage({tipo:"jogos:fim",pontos:P,nivel:nivel},"*"); }catch(e){} }
  }
}
function showOver(){
  G.state='over'; G.overT=0;
  $('oPts').textContent=G.score;
  $('oRec').textContent=G.best;
  $('oNovo').classList.toggle('hide',!G.newBest);
  const m=G.medal, med=$('medalha');
  med.textContent=m?m.n:'—';
  med.style.background=m
    ? 'radial-gradient(circle at 35% 30%,#fff 0 10%,'+m.c+' 45%,'+m.d+' 100%)'
    : 'radial-gradient(circle at 35% 30%,#f4f6fb 0 10%,#aab2c4 55%,#6b7489 100%)';
  $('oNivel').textContent='Nível: '+(m?m.n:'Sem medalha');
  $('sOver').classList.remove('hide');
}

function update(){
  G.t+=STEP;
  const st=G.state;

  if(st==='menu'||st==='ready'){
    const tx = st==='menu'?180:BX;
    bird.x += (tx-bird.x)*0.06;
    bird.y = (st==='menu'?330:300) + Math.sin(G.t*3)*10;
    bird.ang = Math.sin(G.t*3)*0.08;
    G.speed=1.4; G.scroll+=G.speed;
  }
  else if(st==='play'){
    G.speed=speedFor(G.score);
    bird.vy=Math.min(bird.vy+GRAV,11);
    bird.y+=bird.vy;
    if(bird.y-bird.r<0){ bird.y=bird.r; if(bird.vy<0) bird.vy=0; }
    bird.ang += (clamp(bird.vy*0.085,-0.5,1.3)-bird.ang)*0.18;
    moveWorld(G.speed);
    for(const o of G.obs){
      if(!o.passed && o.x+OW<bird.x){ o.passed=true; G.score++; SFX.score(); }
    }
    for(const c of G.coins){
      if(!c.got && Math.hypot(c.x-bird.x,c.y-bird.y)<bird.r+10){
        c.got=true; G.score++; SFX.coin();
        burst(c.x,c.y,10,['#ffe27a','#fff6c2','#ffb13b'],2.5,0.5,0.1);
      }
    }
    G.obs=G.obs.filter(o=>o.x>-OW-20);
    G.coins=G.coins.filter(c=>!c.got && c.x>-20);
    while(G.nextX<W+40) spawnObs();
    const hr=bird.r*0.7;
    for(const o of G.obs){
      const top=o.c-o.gap/2, bot=o.c+o.gap/2;
      if(hitRect(bird.x,bird.y,hr,o.x+12,-80,OW-24,top+80) ||
         hitRect(bird.x,bird.y,hr,o.x+12,bot,OW-24,GROUND-bot)){ die(); break; }
    }
    if(G.state==='play' && bird.y+bird.r>=GROUND){ bird.y=GROUND-bird.r; die(); }
  }
  else if(st==='dying'){
    G.speed*=0.97; moveWorld(G.speed);
    G.dyingT+=STEP;
    bird.vy=Math.min(bird.vy+GRAV,12);
    bird.y+=bird.vy;
    bird.ang += (1.57-bird.ang)*0.2;
    if(bird.y+bird.r>=GROUND){
      if(bird.vy>3){ bird.squash=-1; G.shake=Math.max(G.shake,4); burst(bird.x,GROUND,6,['#e8d2a0','#c9a86a'],2,0.5,0.1); }
      bird.y=GROUND-bird.r; bird.vy=0;
    }
    if(G.dyingT>1 && bird.y>=GROUND-bird.r) showOver();
  }
  else if(st==='over'){
    G.overT+=STEP;
    G.speed*=0.96; moveWorld(G.speed);
  }

  for(const p of G.parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.98; p.life-=STEP; }
  G.parts=G.parts.filter(p=>p.life>0);
  G.flash*=0.9; if(G.flash<0.01) G.flash=0;
  G.shake*=0.88; if(G.shake<0.1) G.shake=0;
  bird.squash*=0.85; if(Math.abs(bird.squash)<0.01) bird.squash=0;
  G.flapT=Math.max(0,G.flapT-STEP);
  for(const c of G.clouds){
    c.x-=G.speed*c.f;
    if(c.x<-150){ c.x=W+150; c.y=40+Math.random()*200; }
  }
}

// ---------- drawing ----------
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function pill(text,x,y){
  ctx.font='800 19px Figtree, Arial, sans-serif';
  const w=ctx.measureText(text).width+36;
  ctx.fillStyle='rgba(255,255,255,0.92)';
  rr(x-w/2,y-18,w,36,18); ctx.fill();
  ctx.fillStyle='#1d2340'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,x,y+1);
}
function blob(x,y,r){ ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,Math.PI*2); }
function cloud(c){
  ctx.globalAlpha = c.f<0.2 ? 0.6 : 0.92;
  ctx.fillStyle=col('cloud');
  ctx.save(); ctx.translate(c.x,c.y); ctx.scale(c.s,c.s);
  ctx.beginPath();
  blob(0,0,20); blob(-22,6,15); blob(22,6,17); blob(6,-10,21);
  ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
}
function hill(c,base,amp,freq,shift){
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W+4;x+=4){
    const u=freq*(x+shift);
    ctx.lineTo(x, base-amp*(0.5+0.5*Math.sin(u))-amp*0.4*(0.5+0.5*Math.sin(u*2.3+1.3)));
  }
  ctx.lineTo(W+4,H); ctx.closePath();
  ctx.fillStyle=c; ctx.fill();
}
function trunk(cx,y0,y1){
  const h=y1-y0; if(h<=0) return;
  const x0=cx-TW/2;
  const g=ctx.createLinearGradient(x0,0,x0+TW,0);
  g.addColorStop(0,'#2b7a33'); g.addColorStop(0.35,'#8fdc6e'); g.addColorStop(0.6,'#3f9d46'); g.addColorStop(1,'#1f5e28');
  ctx.fillStyle=g; ctx.fillRect(x0,y0,TW,h);
  for(let y=Math.ceil(y0/46)*46; y<y1; y+=46){
    ctx.fillStyle='rgba(20,70,28,0.55)'; ctx.fillRect(x0,y,TW,3);
    ctx.fillStyle='rgba(200,250,160,0.35)'; ctx.fillRect(x0+4,y+4,TW-12,2);
  }
  ctx.strokeStyle='#17461f'; ctx.lineWidth=2; ctx.strokeRect(x0,y0,TW,h);
}
function leaves(cx,edge,dir){ // dir 1: trunk above the gap, -1: trunk below the gap
  const cols=['#1d7a3a','#2fa84f','#5fd06a'];
  for(let i=-3;i<=3;i++){
    const ax=Math.abs(i);
    const x=cx+i*8.5, y=edge-dir*8+dir*ax*2.2;
    ctx.fillStyle=(i%2)?cols[1]:cols[2];
    ctx.beginPath(); ctx.ellipse(x,y,12.5,6.5,dir*i*0.35,0,Math.PI*2);
    ctx.fill(); ctx.strokeStyle='#17461f'; ctx.lineWidth=1.5; ctx.stroke();
  }
  for(let i=-2;i<=2;i++){
    const ax=Math.abs(i);
    const x=cx+i*9, y=edge-dir*3+dir*ax*1.5;
    ctx.fillStyle=cols[0];
    ctx.beginPath(); ctx.ellipse(x,y,9,5,dir*i*0.5,0,Math.PI*2); ctx.fill();
  }
}
function drawObs(o){
  const top=o.c-o.gap/2, bot=o.c+o.gap/2, cx=o.x+OW/2;
  trunk(cx,-10,top); leaves(cx,top,1);
  trunk(cx,bot,GROUND+6); leaves(cx,bot,-1);
}
function drawCoin(c){
  const sx=Math.abs(Math.cos(G.t*4+c.ph))*0.8+0.2;
  ctx.save(); ctx.translate(c.x,c.y); ctx.scale(sx,1);
  const gr=ctx.createRadialGradient(-3,-3,2,0,0,12);
  gr.addColorStop(0,'#fff6c2'); gr.addColorStop(0.5,'#ffd447'); gr.addColorStop(1,'#d88c00');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#b06e00'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.ellipse(-4,-4,2.5,1.5,-0.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function ground(){
  ctx.fillStyle=col('sand'); ctx.fillRect(-20,GROUND,W+40,H-GROUND+20);
  ctx.strokeStyle='rgba(90,55,20,0.14)'; ctx.lineWidth=5;
  const off=G.scroll%40;
  for(let x=-off-40;x<W+40;x+=40){ ctx.beginPath(); ctx.moveTo(x,GROUND+18); ctx.lineTo(x-16,H); ctx.stroke(); }
  ctx.fillStyle=col('grass'); ctx.fillRect(-20,GROUND,W+40,9);
  const o2=G.scroll%24;
  for(let x=-o2-24;x<W+24;x+=24){ ctx.beginPath(); ctx.arc(x+12,GROUND+2,9,0,Math.PI*2); ctx.fill(); }
}
function drawBird(){
  const b=bird, t=G.t, st=G.state;
  const dead = st==='dying'||st==='over';
  let wing;
  if(dead) wing=1.1;
  else if(G.flapT>0) wing=-0.9;
  else wing=0.35+Math.sin(t*(st==='play'?10:5))*0.12;
  ctx.save();
  ctx.translate(b.x,b.y); ctx.rotate(b.ang);
  ctx.scale(1-b.squash*0.1, 1+b.squash*0.1);
  // feet
  ctx.strokeStyle='#ff9a1f'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-5,16); ctx.lineTo(-7,24); ctx.moveTo(4,16); ctx.lineTo(3,24); ctx.stroke();
  // tail
  ctx.fillStyle='#16203a';
  ctx.beginPath(); ctx.moveTo(-14,-2); ctx.lineTo(-34,-10); ctx.quadraticCurveTo(-36,2,-30,10); ctx.lineTo(-14,8); ctx.closePath(); ctx.fill();
  // body (chubby)
  ctx.fillStyle='#1f2b4d';
  ctx.beginPath(); ctx.ellipse(0,0,21,19,0,0,Math.PI*2); ctx.fill();
  // belly
  ctx.fillStyle='#fff6e6';
  ctx.beginPath(); ctx.ellipse(4,6,13,12,0,0,Math.PI*2); ctx.fill();
  // cheek
  ctx.fillStyle='rgba(255,120,150,0.7)';
  ctx.beginPath(); ctx.ellipse(4,3,4,2.5,0,0,Math.PI*2); ctx.fill();
  // wing
  ctx.save(); ctx.translate(-6,2); ctx.rotate(wing);
  ctx.fillStyle='#2c3b66';
  ctx.beginPath(); ctx.ellipse(0,0,13,8,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // big beak
  ctx.lineWidth=1.5; ctx.strokeStyle='#c24a00';
  ctx.fillStyle='#ff7a18';
  ctx.beginPath(); ctx.moveTo(12,-9); ctx.quadraticCurveTo(30,-15,42,0); ctx.quadraticCurveTo(28,-2,12,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffb13b';
  ctx.beginPath(); ctx.moveTo(12,1); ctx.quadraticCurveTo(28,3,36,9); ctx.quadraticCurveTo(24,12,12,9); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#16203a';
  ctx.beginPath(); ctx.ellipse(17,-4,2.5,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffe066';
  ctx.beginPath(); ctx.ellipse(38,-3,2.5,2.2,0,0,Math.PI*2); ctx.fill();
  // eye
  ctx.strokeStyle='#16203a'; ctx.lineWidth=2;
  const blink = !dead && (t%3.4)<0.12;
  if(dead){
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(3,-11); ctx.lineTo(10,-4); ctx.moveTo(10,-11); ctx.lineTo(3,-4); ctx.stroke();
  } else if(blink){
    ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(12,-7); ctx.stroke();
  } else {
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(6,-8,6.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#10141f';
    ctx.beginPath(); ctx.arc(8,-7.5,3.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(9.2,-8.8,1.1,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function draw(){
  G.ph2=Math.min(1,G.score/60)*2;
  const nf=clamp((G.score-30)/30,0,1);
  const st=G.state;
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()*2-1)*G.shake,(Math.random()*2-1)*G.shake);

  // sky
  const sg=ctx.createLinearGradient(0,0,0,GROUND);
  sg.addColorStop(0,col('skyT')); sg.addColorStop(1,col('skyB'));
  ctx.fillStyle=sg; ctx.fillRect(-20,-20,W+40,H+40);
  // stars
  if(nf>0){
    ctx.fillStyle='#fff';
    for(const s of G.stars){
      ctx.globalAlpha=nf*(0.5+0.5*Math.sin(G.t*2+s.ph));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // sun / moon
  const sx=290, sy=100;
  if(nf<1){
    ctx.globalAlpha=1-nf;
    const gr=ctx.createRadialGradient(sx,sy,10,sx,sy,90);
    gr.addColorStop(0,'rgba(255,240,170,0.7)'); gr.addColorStop(1,'rgba(255,240,170,0)');
    ctx.fillStyle=gr; ctx.fillRect(sx-90,sy-90,180,180);
    ctx.fillStyle=col('sun');
    ctx.beginPath(); ctx.arc(sx,sy,30,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  if(nf>0){
    ctx.globalAlpha=nf;
    ctx.fillStyle='#f3f1dc';
    ctx.beginPath(); ctx.arc(sx,sy,24,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#d9d6bd';
    ctx.beginPath(); ctx.arc(sx-8,sy-5,4,0,Math.PI*2); ctx.arc(sx+6,sy+6,3,0,Math.PI*2); ctx.arc(sx-2,sy+10,2.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  // clouds (far then near)
  for(const c of G.clouds) cloud(c);
  // hills
  hill(col('farH'),GROUND-120,80,0.02,-G.scroll*0.3);
  hill(col('nearH'),GROUND-30,45,0.03,-G.scroll*0.6);

  // obstacles
  if(st==='play'||st==='dying'||st==='over'){
    for(const o of G.obs) drawObs(o);
  }
  ground();
  if(st==='play'||st==='dying'||st==='over'){
    for(const c of G.coins) if(!c.got) drawCoin(c);
  }
  drawBird();
  // particles
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // flash on death
  if(G.flash>0){ ctx.fillStyle='rgba(255,255,255,'+G.flash+')'; ctx.fillRect(0,0,W,H); }

  // HUD / prompts
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(st==='play'||st==='dying'||st==='over'){
    ctx.font='64px "Lilita One", Impact, sans-serif';
    ctx.lineJoin='round'; ctx.lineWidth=10; ctx.strokeStyle='#1d2340';
    ctx.strokeText(String(G.score),W/2,90);
    ctx.fillStyle='#fff'; ctx.fillText(String(G.score),W/2,90);
  }
  if(st==='ready'){
    pill('Prepare-se — toque para voar',W/2,420);
  }
}
function stars(){
  G.stars=[];
  for(let i=0;i<40;i++) G.stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:0.6+Math.random()*1.4,ph:Math.random()*6.28});
}

// ---------- loop ----------
function frame(now){
  requestAnimationFrame(frame);
  if(!G.last) G.last=now;
  let dt=(now-G.last)/1000; G.last=now;
  if(G.paused) return;
  if(dt>0.25) dt=0.25;
  G.acc+=dt;
  while(G.acc>=STEP){ update(); G.acc-=STEP; }
  draw();
}

// ---------- input ----------
game.addEventListener('pointerdown',e=>{
  if(e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  action();
});
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(k==='Space'||k==='ArrowUp'||k==='Enter'){
    e.preventDefault();
    if(e.repeat) return;
    if(G.state==='menu') startReady();
    else if(G.state==='over' && G.overT>0.6) startReady();
    else action();
  }
});
$('btnJogar').addEventListener('click',function(){ this.blur(); startReady(); });
$('btnDeNovo').addEventListener('click',function(){ this.blur(); startReady(); });
$('btnSom').textContent=muted?'MUDO':'SOM';
$('btnSom').addEventListener('click',function(){
  muted=!muted;
  try{ localStorage.setItem('voa-voa-mudo',muted?'1':'0'); }catch(e){}
  this.textContent=muted?'MUDO':'SOM';
  this.blur();
});
document.addEventListener('visibilitychange',()=>{ G.paused=document.hidden; G.last=0; });
window.addEventListener('resize',resize);

// ---------- init ----------
G.best=loadBest();
for(let i=0;i<5;i++) G.clouds.push({x:Math.random()*W,y:40+Math.random()*200,s:0.7+Math.random()*0.5,f:i%2?0.25:0.1});
stars();
resize();
requestAnimationFrame(frame);
  // controle: A/B/X batem as asas; menu e tela de fim usam navegar (A ou Start clica no botão)
  if(window.Controle){
    const telaBotao=()=>G.state==='menu'||(G.state==='over'&&G.overT>0.6);
    Controle.navegar({raiz:()=>$(G.state==='menu'?'sMenu':'sOver'),ativo:telaBotao});
    Controle.teclas({a:'Space',b:'Space',x:'Space',cima:'ArrowUp'});
  }
})();
</script>
