<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrida dos Portões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0e1a2b;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Figtree',system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:360px;height:640px;transform-origin:center center;overflow:hidden;border-radius:12px;background:#8fd8ff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
canvas{position:absolute;left:0;top:0;width:360px;height:640px;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(10,25,55,.62);padding:28px;box-sizing:border-box;gap:12px}
.ov.on{display:flex}
.ov h1,.ov h2{font-family:'Lilita One','Arial Black',sans-serif;font-weight:400;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.ov h1{font-size:50px;line-height:1;color:#ffd84a}
.ov h2{font-size:38px;color:#ffd84a}
.ov p{margin:0;font-size:16px;line-height:1.35;font-weight:500}
.ov .big{font-size:22px;font-weight:700}
.ov .small{font-size:13px;opacity:.8}
.btn{font-family:'Lilita One','Arial Black',sans-serif;font-size:26px;color:#fff;background:linear-gradient(#3fa9ff,#1b6fe0);border:0;border-radius:16px;padding:12px 36px;margin-top:8px;box-shadow:0 5px 0 #124aa0,0 8px 16px rgba(0,0,0,.35);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #124aa0}
.btn:focus-visible{outline:3px solid #ffd84a}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="ov on" id="ovStart">
    <h1>Corrida<br>dos Portões</h1>
    <p>Arraste (ou use as setas / A-D, ou o analógico do controle) para guiar a multidão pelos portões verdes, desviar das serras e vencer o exército inimigo!</p>
    <p class="small" id="bestS"></p>
    <button class="btn" id="bPlay">Jogar</button>
  </div>
  <div class="ov" id="ovWin">
    <h2>Fase <span id="wN"></span> vencida!</h2>
    <p class="big">Sobreviventes: <b id="wS"></b></p>
    <p>Pontos da fase: <b id="wP"></b></p>
    <p>Total da corrida: <b id="wT"></b></p>
    <button class="btn" id="bNext">Próxima fase</button>
  </div>
  <div class="ov" id="ovLose">
    <h2 id="lH">Fim da corrida</h2>
    <p id="lT"></p>
    <p class="big">Pontuação final: <b id="lP"></b></p>
    <p class="small" id="lB"></p>
    <button class="btn" id="bAgain">Jogar de novo</button>
  </div>
</div>
<script src="controle.js?v=1"></script>
<script>
(function(){
"use strict";
const W=360,H=640,HOR=150,BASE=600,F=200,HW=170,CAMBACK=60,START=10;
const stage=document.getElementById('stage'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const FONT="'Lilita One','Arial Black',sans-serif";
let pr=1;
function fit(){
  const k=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform='translate(-50%,-50%) scale('+k+')';
  pr=Math.min(3,Math.max(1,(window.devicePixelRatio||1)*k));
  cv.width=Math.round(W*pr);cv.height=Math.round(H*pr);
}
addEventListener('resize',fit);fit();

// ---------- storage ----------
const KEY='corridaPortoes.melhorFase';
function getBest(){try{return parseInt(localStorage.getItem(KEY))||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(KEY,String(v))}catch(e){}}

// ---------- level generation ----------
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function applyOp(op,n){
  if(op.t==='+')return n+op.v;
  if(op.t==='-')return Math.max(0,n-op.v);
  if(op.t==='x')return n*op.v;
  return Math.max(0,Math.round(n/op.v));
}
function opText(op){return op.t==='+'?'+'+op.v:op.t==='-'?'−'+op.v:op.t==='x'?'×'+op.v:'÷'+op.v}
function isGood(op){return op.t==='+'||op.t==='x'}
function mkLevel(lv){
  const r=rng(lv*7919+13),pick=a=>a[Math.floor(r()*a.length)];
  const rows=Math.min(14,5+Math.floor(lv*0.9));
  const sc=1+0.15*(lv-1);
  const good=()=>r()<0.3?{t:'x',v:r()<0.72?2:3}:{t:'+',v:Math.max(2,Math.round(pick([5,8,10,15,20,25])*sc/ (r()<0.2?2:1)))};
  const bad=()=>r()<0.38?{t:'/',v:2}:{t:'-',v:Math.round(pick([4,6,8,10,15])*(1+0.1*(lv-1)))};
  const items=[];let z=520,best=START;
  for(let i=0;i<rows;i++){
    const obsP=0.28+Math.min(0.17,lv*0.01);
    if(i>0&&r()<obsP){
      const kind=r();
      if(kind<0.55){
        const x1=-0.8+r()*0.5;items.push({k:'saw',z,x:x1,r:0.13});
        if(r()<0.5+Math.min(.3,lv*.03))items.push({k:'saw',z,x:x1+0.9+r()*0.2,r:0.13});
      }else{
        const left=r()<0.5;
        items.push(left?{k:'wall',z,x0:-1.05,x1:0.1}:{k:'wall',z,x0:-0.1,x1:1.05});
      }
    }else{
      let a,b;const p=r();
      if(p<0.5){a=good();b=bad()}
      else if(p<0.8){a=good();b=good();if(a.t==='x'&&b.t==='x')b={t:'+',v:10}}
      else{a={t:'x',v:2};b={t:'+',v:Math.max(5,Math.round(best*0.6+r()*8))}}
      if(r()<0.5){const t=a;a=b;b=t}
      items.push({k:'gate',z,a,b,flash:0,sel:''});
      best=Math.max(applyOp(a,best),applyOp(b,best));
    }
    z+=260;
  }
  const L=z+160;
  const f=0.5+Math.min(0.25,0.012*lv);
  const E=Math.max(4,Math.floor(best*f));
  items.push({k:'finish',z:L-120});
  return{items,L,E,best};
}

// ---------- state ----------
let G={phase:'menu',level:1,total:0,n:START,cx:0,z:0,prevZ:0,items:[],L:1000,E:5,E0:5,t:0,shake:0,clashSub:0,clashT:0,deadT:0,endT:0,score:0};
const floaters=[],parts=[];
function startLevel(lv){
  const L=mkLevel(lv);
  G.level=lv;G.items=L.items;G.L=L.L;G.E=G.E0=L.E;G.n=START;G.cx=0;G.z=0;G.prevZ=0;
  G.clashSub=0;G.clashT=0;G.deadT=0;G.endT=0;G.shake=0;G.phase='run';
  floaters.length=0;parts.length=0;
  hideAll();
}
function hideAll(){['ovStart','ovWin','ovLose'].forEach(i=>$(i).classList.remove('on'))}
function showOv(id){hideAll();$(id).classList.add('on')}
function newRun(){G.total=0;startLevel(1)}

// menu demo
(function(){const L=mkLevel(1);G.items=L.items;G.L=L.L;G.E=L.E;})();

function fin(n){return String(n)}
function clampScore(v){return Math.max(1,Math.min(50000,Math.round(v)))}

function win(){
  const pts=G.n*G.level;G.total+=pts;
  if(G.level>getBest())setBest(G.level);
  G.phase='win';
  $('wN').textContent=G.level;$('wS').textContent=G.n;$('wP').textContent=pts;$('wT').textContent=clampScore(G.total);
  showOv('ovWin');
}
function lose(){
  G.phase='lose';
  const total=Math.round(G.total);
  const score=total>0?clampScore(total):0;
  G.score=score;
  $('lH').textContent=G.n===0&&G.clashSub===0?'A multidão sumiu!':'Derrota!';
  $('lT').textContent='Você chegou até a Fase '+G.level+'.';
  $('lP').textContent=score;
  $('lB').textContent='Melhor fase: '+getBest();
  showOv('ovLose');
  if(score>0){try{if(parent!==window)parent.postMessage({tipo:"jogos:fim",pontos:score,nivel:"Fase "+G.level},"*")}catch(e){}}
}
$('bPlay').onclick=newRun;
$('bAgain').onclick=newRun;
$('bNext').onclick=function(){startLevel(G.level+1)};
function setBestText(){const b=getBest();$('bestS').textContent=b?'Melhor fase: '+b:''}
setBestText();

// ---------- input ----------
const keys=new Set();
addEventListener('keydown',e=>{keys.add(e.key);if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.key));
let dragging=false,lastX=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const rect=cv.getBoundingClientRect();
  const dx=(e.clientX-lastX)*W/rect.width;lastX=e.clientX;
  if(G.phase==='run')G.cx+=dx/(HW*0.77)*1.15;
});
const endDrag=()=>{dragging=false};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

// analógico esquerdo (ou direcional) do controle, proporcional; somado às setas no update
function eixoPad(){
  if(!window.Controle) return 0;
  let v=0;
  for(let i=0;i<4;i++){
    const p=Controle.pad(i); if(!p.conectado) continue;
    const x=p.lx||(p.direita?1:p.esquerda?-1:0);
    if(Math.abs(x)>Math.abs(v)) v=x;
  }
  return v;
}

// ---------- update ----------
function crowdRX(){return 7.4*Math.sqrt(Math.min(G.n,90))/HW}
function addFloater(txt,col){floaters.push({x:180+G.cx*HW*0.77,y:projY(CAMBACK)-70,txt,col,life:1})}
function projY(d){return HOR+(BASE-HOR)*F/(d+F)}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:.5+Math.random()*.4,col})}}

function update(dt){
  G.t+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*2);
  for(const it of G.items)if(it.flash>0)it.flash=Math.max(0,it.flash-dt*2);
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=dt*0.9;f.y-=30*dt;if(f.life<=0)floaters.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;if(p.life<=0)parts.splice(i,1)}

  if(G.phase==='menu'){
    G.z+=90*dt;if(G.z>G.L-300)G.z=0;
    G.cx=Math.sin(G.t*0.8)*0.5;return;
  }
  if(G.phase==='run'){
    const sp=190+Math.min(60,G.level*4);
    const k=Math.max(-1,Math.min(1,((keys.has('ArrowRight')||keys.has('d')||keys.has('D'))?1:0)-((keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))?1:0)+eixoPad()));
    G.cx+=k*1.9*dt;
    G.cx=Math.max(-0.92,Math.min(0.92,G.cx));
    G.prevZ=G.z;G.z+=sp*dt;
    for(const it of G.items){
      if(it.done||it.z<=G.prevZ||it.z>G.z)continue;
      if(it.k==='gate'){
        it.done=true;const side=G.cx<0?'a':'b',op=it[side];
        const before=G.n;G.n=applyOp(op,G.n);const diff=G.n-before;
        it.flash=0.6;it.sel=side;
        addFloater((diff>=0?'+':'−')+Math.abs(diff),diff>=0?'#7dff9c':'#ff7b7b');
        burst(180+G.cx*HW*0.77,projY(CAMBACK)-10,isGood(op)?'#9be15d':'#ff5c5c',14);
        if(diff<0)G.shake=Math.max(G.shake,0.2);
      }else if(it.k==='saw'||it.k==='wall'){
        const rx=crowdRX()*0.75;let hit=false,kill=0;
        if(it.k==='saw'){hit=Math.abs(G.cx-it.x)<it.r+rx;kill=Math.max(3,Math.ceil(G.n*0.12))}
        else{hit=G.cx+rx>it.x0&&G.cx-rx<it.x1;kill=Math.max(4,Math.ceil(G.n*0.25))}
        it.done=true;
        if(hit&&G.n>0){
          kill=Math.min(kill,G.n);G.n-=kill;G.shake=0.5;
          addFloater('−'+kill,'#ff7b7b');
          burst(180+G.cx*HW*0.77,projY(CAMBACK)-10,'#2f7bff',18);
        }
      }
    }
    if(G.n<=0){G.n=0;G.phase='dead';G.deadT=0.9;return}
    if(G.z>=G.L-110){G.phase='clash';G.clashSub=0;G.clashT=0}
    return;
  }
  if(G.phase==='dead'){G.deadT-=dt;if(G.deadT<=0)lose();return}
  if(G.phase==='clash'){
    G.cx+=(0-G.cx)*Math.min(1,dt*6);
    if(G.clashSub===0){
      G.z+=120*dt;
      if(G.z>=G.L-48){G.z=G.L-48;G.clashSub=1;G.clashT=0.5}
    }else if(G.clashSub===1){
      G.clashT-=dt;
      if(G.clashT<=0){
        const step=Math.max(1,Math.ceil(Math.min(G.n,G.E)/50));
        // decrement over fixed ticks
        G.tick=(G.tick||0)+dt;
        while(G.tick>=0.04){
          G.tick-=0.04;
          const m=Math.min(step,G.n,G.E);
          G.n-=m;G.E-=m;G.shake=0.15;
          burst(180,projY(CAMBACK+40)-18,Math.random()<.5?'#2f7bff':'#e8433f',2);
          if(G.n<=0||G.E<=0)break;
        }
        if(G.n<=0||G.E<=0){G.clashSub=2;G.endT=0.9;G.tick=0}
      }
    }else{
      G.endT-=dt;
      if(G.endT<=0){
        if(G.n>0&&G.E<=0)win();else{G.n=0;lose()}
      }
    }
  }
}

// ---------- rendering ----------
function proj(d){const s=F/(d+F);return{s,y:HOR+(BASE-HOR)*s}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(t,x,y,size,fill,stroke,align){
  ctx.font=size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(2,size*0.16);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y)}
  ctx.fillStyle=fill;ctx.fillText(t,x,y);
}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,'#59b9ff');g.addColorStop(1,'#d8f3ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+2);
  ctx.fillStyle='rgba(255,244,170,.9)';ctx.beginPath();ctx.arc(285,62,24,0,6.3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<3;i++){
    const cx=((i*150+G.t*6)%(W+120))-60,cy=40+i*28;
    ctx.beginPath();ctx.ellipse(cx,cy,34,10,0,0,6.3);ctx.ellipse(cx+16,cy-7,20,10,0,0,6.3);ctx.fill();
  }
  const layers=[['#8cc8a0',26,.017,0],['#5fb06f',16,.03,2]];
  for(const [col,amp,fr,ph] of layers){
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,HOR+1);
    for(let x=0;x<=W;x+=10)ctx.lineTo(x,HOR-amp*(0.55+0.45*Math.sin(x*fr*2+ph+G.cx*0.4)));
    ctx.lineTo(W,HOR+1);ctx.closePath();ctx.fill();
  }
}
function drawGround(camZ){
  for(let y=HOR;y<H;y+=2){
    const s=(y-HOR)/(BASE-HOR);if(s<0.015)continue;
    const d=F/s-F,band=Math.floor((camZ+d)/60)&1;
    ctx.fillStyle=band?'#58bf48':'#4fb441';ctx.fillRect(0,y,W,2.6);
    const hw=HW*s;
    ctx.fillStyle=band?'#6f7788':'#666e80';ctx.fillRect(180-hw,y,hw*2,2.6);
    const cw=Math.max(1,11*s);
    ctx.fillStyle=band?'#ffffff':'#e8433f';
    ctx.fillRect(180-hw-cw,y,cw,2.6);ctx.fillRect(180+hw,y,cw,2.6);
    if(band){ctx.fillStyle='rgba(255,255,255,.55)';const lw=Math.max(1,3*s);ctx.fillRect(180-lw/2,y,lw,2.6)}
  }
}
function drawTrees(camZ){
  const first=Math.floor((camZ-40)/140)+1;
  const list=[];
  for(let k=first;k<first+12;k++){
    const z=k*140,h=Math.sin(k*12.9898)*43758.5453,fr=h-Math.floor(h);
    list.push([z,-1.35-fr*0.7,fr],[z+70,1.35+((fr*7)%1)*0.7,(fr*3)%1]);
  }
  list.sort((a,b)=>b[0]-a[0]);
  for(const [z,x,f] of list){
    const d=z-camZ;if(d<-30||d>1500)continue;
    const {s,y}=proj(d);const px=180+x*HW*s;
    ctx.globalAlpha=Math.min(1,(1500-d)/500);
    ctx.fillStyle='#7a4e2b';ctx.fillRect(px-3*s,y-26*s,6*s,26*s);
    ctx.fillStyle=f>.5?'#2f9a4a':'#37a853';ctx.beginPath();ctx.arc(px,y-40*s,(20+f*8)*s,0,6.3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.arc(px-6*s,y-46*s,9*s,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawBlobs(px,gy,s,count,col,dark,t,off){
  const m=Math.min(count,90);if(m<=0)return null;
  const c=7.4*s,rb=6.2*s,arr=[];
  for(let i=0;i<m;i++){
    const a=i*2.39996+off,r=c*Math.sqrt(i+.6);
    arr.push([px+Math.cos(a)*r,Math.sin(a)*r*.5,Math.abs(Math.sin(t*10+i*1.7))*3*s]);
  }
  arr.sort((p,q)=>p[1]-q[1]);
  ctx.fillStyle='rgba(0,0,0,.2)';
  for(const p of arr){ctx.beginPath();ctx.ellipse(p[0],gy+p[1]+rb*.7,rb*.9,rb*.4,0,0,6.3);ctx.fill()}
  ctx.lineWidth=Math.max(1,1.3*s);ctx.strokeStyle=dark;
  for(const p of arr){
    const x=p[0],y=gy+p[1]-p[2]-rb*.4;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,rb,0,6.3);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-rb*.3,y-rb*.35,rb*.32,0,6.3);ctx.fill();
    if(rb>3){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-rb*.35,y+rb*.05,rb*.3,0,6.3);ctx.arc(x+rb*.35,y+rb*.05,rb*.3,0,6.3);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-rb*.3,y+rb*.08,rb*.14,0,6.3);ctx.arc(x+rb*.4,y+rb*.08,rb*.14,0,6.3);ctx.fill();
    }
  }
  return gy-c*Math.sqrt(m)*.5-rb*2.2;
}
function badge(x,y,text,col,dark){
  ctx.font='20px '+FONT;const w=Math.max(38,ctx.measureText(text).width+22);
  ctx.fillStyle='rgba(0,0,0,.25)';rr(x-w/2,y-12+3,w,26,13);ctx.fill();
  ctx.fillStyle=col;rr(x-w/2,y-12,w,26,13);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=dark;ctx.stroke();
  txt(text,x,y+1,20,'#fff');
}
function drawItem(it,camZ){
  const d=it.z-camZ;if(d<-30||d>1600)return;
  const {s,y}=proj(d);
  ctx.globalAlpha=Math.max(0,Math.min(1,(1600-d)/500,(d+10)/50));
  if(it.k==='gate'){
    const h=100*s,hw=HW*s,x0=180-hw,x1=180,x2=180+hw;
    const panels=[[x0,x1,it.a,'a'],[x1,x2,it.b,'b']];
    for(const [xa,xb,op,id] of panels){
      const good=isGood(op);
      ctx.fillStyle=good?'rgba(46,204,113,.6)':'rgba(240,70,70,.6)';ctx.fillRect(xa,y-h,xb-xa,h);
      if(it.flash>0&&it.sel===id){ctx.fillStyle='rgba(255,255,255,'+it.flash+')';ctx.fillRect(xa,y-h,xb-xa,h)}
      ctx.lineWidth=Math.max(1,3*s);ctx.strokeStyle=good?'#17894a':'#a82525';ctx.strokeRect(xa,y-h,xb-xa,h);
      txt(opText(op),(xa+xb)/2,y-h*.5,Math.round(46*s),'#fff',good?'#12703b':'#8a1d1d');
    }
    ctx.fillStyle='#2b3345';
    for(const x of [x0,x1,x2])ctx.fillRect(x-3.5*s,y-h-8*s,7*s,h+8*s);
    ctx.fillRect(x0,y-h-9*s,hw*2,8*s);
  }else if(it.k==='saw'){
    const rad=it.r*HW*s*1.15,px=180+it.x*HW*s,cy=y-rad*.95;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(px,y,rad,rad*.3,0,0,6.3);ctx.fill();
    ctx.save();ctx.translate(px,cy);ctx.rotate(G.t*9);
    ctx.fillStyle='#c9d1dc';ctx.strokeStyle='#59616e';ctx.lineWidth=Math.max(1,2*s);
    ctx.beginPath();
    for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?rad*.8:rad*1.08;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#e8433f';ctx.beginPath();ctx.arc(0,0,rad*.38,0,6.3);ctx.fill();
    ctx.fillStyle='#59616e';ctx.beginPath();ctx.arc(0,0,rad*.12,0,6.3);ctx.fill();
    ctx.restore();
  }else if(it.k==='wall'){
    const xa=180+Math.max(-1.05,it.x0)*HW*s,xb=180+Math.min(1.05,it.x1)*HW*s,h=44*s;
    ctx.fillStyle='#d9822b';ctx.fillRect(xa,y-h,xb-xa,h);
    const n=Math.max(2,Math.round((xb-xa)/(16*s)));
    for(let i=0;i<n;i+=2){ctx.fillStyle='#2b2b33';ctx.fillRect(xa+(xb-xa)*i/n,y-h*.6,(xb-xa)/n,h*.35)}
    ctx.fillStyle='#f0a24b';ctx.fillRect(xa,y-h,xb-xa,6*s);
    ctx.lineWidth=Math.max(1,2*s);ctx.strokeStyle='#7a4510';ctx.strokeRect(xa,y-h,xb-xa,h);
  }else if(it.k==='finish'){
    const hw=HW*s,sq=hw*2/16,hh=8*s;
    for(let r=0;r<2;r++)for(let i=0;i<16;i++){ctx.fillStyle=(i+r)%2?'#fff':'#222';ctx.fillRect(180-hw+i*sq,y-hh*(r+1),sq+.5,hh)}
  }
  ctx.globalAlpha=1;
}
function drawEnemy(camZ){
  if(G.E<=0)return;
  const d=G.L-camZ;if(d>1700)return;
  const {s,y}=proj(d);
  ctx.globalAlpha=Math.min(1,(1700-d)/500);
  const top=drawBlobs(180,y,s*1.2,G.E,'#e8433f','#8e1d1a',G.t+1,1.3);
  if(top!==null)badge(180,top-4,fin(G.E),'#d12b28','#7a1512');
  ctx.globalAlpha=1;
}
function drawPlayer(camZ){
  if(G.n<=0)return;
  const {s,y}=proj(CAMBACK);
  const px=180+G.cx*HW*s;
  const run=(G.phase==='run'||G.phase==='menu'||(G.phase==='clash'&&G.clashSub===0))?G.t:0;
  const top=drawBlobs(px,y,s,G.n,'#2f8bff','#12408f',run,0);
  if(top!==null)badge(px,top-4,fin(G.n),'#1f6fe0','#0f3a85');
}
function drawHUD(){
  const prog=Math.max(0,Math.min(1,G.z/(G.L-48)));
  txt('FASE '+G.level,12,24,24,'#fff','#12408f','left');
  ctx.fillStyle='rgba(0,0,0,.35)';rr(112,14,236,20,10);ctx.fill();
  ctx.fillStyle='#ffd84a';if(prog>0.02){rr(112,14,Math.max(20,236*prog),20,10);ctx.fill()}
  ctx.lineWidth=2;ctx.strokeStyle='#fff';rr(112,14,236,20,10);ctx.stroke();
  txt('⚑',340,24,16,'#e8433f',null,'right');
  txt('Multidão: '+G.n,348,50,16,'#fff','#12408f','right');
}
function draw(){
  ctx.setTransform(pr,0,0,pr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*10,(Math.random()-.5)*G.shake*10);
  const camZ=G.z-CAMBACK;
  drawSky();drawGround(camZ);drawTrees(camZ);
  const far=[],near=[];
  for(const it of G.items)(it.z>G.z?far:near).push(it);
  far.sort((a,b)=>b.z-a.z);near.sort((a,b)=>b.z-a.z);
  drawEnemy(camZ);
  for(const it of far)drawItem(it,camZ);
  drawPlayer(camZ);
  for(const it of near)drawItem(it,camZ);
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;
  for(const f of floaters){ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.5));txt(f.txt,f.x,f.y,30,f.col,'#102040')}
  ctx.globalAlpha=1;
  ctx.restore();
  if(G.phase!=='menu'&&G.phase!=='win'&&G.phase!=='lose')drawHUD();
  if(G.phase==='clash'&&G.clashSub>=1&&G.E>0&&G.n>0){txt('BATALHA!',180,100,34,'#fff','#b02a2a')}
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// expose for tests
window.__jogo={G:()=>G};
  // controle: A escolhe o botão dos menus (navegar); na corrida o analógico/direcional guia (eixoPad)
  if(window.Controle){
    Controle.navegar({raiz:()=>document.querySelector('.ov.on'),ativo:()=>!!document.querySelector('.ov.on')});
  }
})();
</script>
