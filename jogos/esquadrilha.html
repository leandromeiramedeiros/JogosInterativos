<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esquadrilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#06121f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;background:#0b2a4a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="controle.js?v=1"></script>
<script>
(()=>{
'use strict';
const W=360,H=640,TAU=Math.PI*2;
const FT="'Lilita One','Arial Black',Impact,sans-serif",FB="Figtree,'Segoe UI',Arial,sans-serif";
const cv=document.getElementById('c'),ctx0=cv.getContext('2d');
// sombras dos aviões: silhuetas numa tela à parte (meia resolução, borda suave), coladas com transparência
const shc=document.createElement('canvas'),shx=shc.getContext('2d');
let ctx=ctx0,shkX=0,shkY=0;
const vig=ctx0.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.7);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,12,30,.4)');
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);
  shc.width=Math.ceil(cv.width/2);shc.height=Math.ceil(cv.height/2);
}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};

/* ---------- storage ---------- */
let best=0,muted=false;
// a pontuação foi dividida por 10 para caber no placar (teto de 50.000); o recorde antigo vem convertido
try{const v=localStorage.getItem('esquadrilha_best2');best=v!==null?parseInt(v)||0:Math.round((parseInt(localStorage.getItem('esquadrilha_best')||'0')||0)/10)}catch(e){}
try{muted=localStorage.getItem('esquadrilha_mute')==='1'}catch(e){}

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f1,f2,d,type,vol){
  if(muted)return;const a=ac();if(!a)return;
  try{const o=a.createOscillator(),g=a.createGain();o.type=type||'square';
  const t=a.currentTime;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}
}
function noise(d,vol){
  if(muted)return;const a=ac();if(!a)return;
  try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(a.destination);s.start();}catch(e){}
}

/* ---------- state ---------- */
let state='menu',paused=false,frame=0;
let score=0,lives=3,bombs=2,wlvl=1,stage=1,loop=0,stageT=0,chain=0,chainT=0,mult=1;
let shake=0,flash=0,fade=0,fadeDir=0,bannerT=0,bossWarn=0,clearT=0,overT=0,newRec=false,deadT=0,bombT=0,nextLife=3000;
let medalV=10,medLostT=0,shown=0,bossIntro=0,slow=0,gzT=0,ST={k:0,ch:0,md:0,gz:0,miss:0},tally=0,tallyBon=0;
let phase='run',waveT=60,waveN=0,dropI=0,posted=false,god=false;
const STAGE_LEN=2700;
const STAGE_NAMES=['Mar Aberto','Ilhas da Selva','Fortaleza Inimiga'];
const keys={};
const P={x:180,y:540,alive:true,inv:0,shield:0,bank:0,fireT:0,missT:0,beam:false,moving:0,laserT:0,shot:0,mf:0,tr:[]};
let pb=[],eb=[],en=[],bigs=[],items=[],parts=[],fxs=[],texts=[],deco=[],queue=[];
let scr=0,SPD=1.5,bgIsland=0,bgCloud=0;
let bossObj=null;
const ptr={id:null,ox:0,oy:0,tx:180,ty:540,active:false};

const dm=()=>Math.min(1.9,1+0.06*(stage-1)+0.18*loop);      // bullet speed
const fm=()=>Math.min(2.2,1+0.08*(stage-1)+0.25*loop);      // fire rate
const hm=()=>1+0.3*loop+0.05*(stage-1);                     // hp
const NIVEL=()=>'Fase '+(loop*3+stage);

/* ---------- bullet sprites ---------- */
function mkBullet(c1,c2,r){
  const s=Math.ceil((r+4)*2*3),c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d');g.translate(s/2,s/2);g.scale(3,3);
  g.fillStyle='rgba(255,70,140,.28)';g.beginPath();g.arc(0,0,r+3,0,TAU);g.fill();
  g.fillStyle='#3a0024';g.beginPath();g.arc(0,0,r+1.7,0,TAU);g.fill();
  g.fillStyle=c1;g.beginPath();g.arc(0,0,r,0,TAU);g.fill();
  g.fillStyle=c2;g.beginPath();g.arc(-r*0.1,-r*0.1,r*0.55,0,TAU);g.fill();
  return {c,s:s/3};
}
const BS=[mkBullet('#ff2f8e','#ffe3f2',5),mkBullet('#ff8a1f','#fff3b0',4),mkBullet('#ff5ec7','#fff',3)];

/* ---------- helpers: fx ---------- */
// k: 0 bolinha/fumaça, 1 faísca (risco na direção do movimento), 2 destroço girando
function particle(x,y,vx,vy,life,size,col,g,k){if(parts.length<650)parts.push({x,y,vx,vy,life,max:life,size,col,g:g||0,k:k||0,rot:rnd(0,TAU),vr:rnd(-0.3,0.3)})}
// camada do chão (espuma, respingos): fica embaixo dos aviões
let gparts=[];
function gpart(x,y,vx,vy,life,size,col){if(gparts.length<260)gparts.push({x,y,vx,vy,life,max:life,size,col})}
function boom(x,y,sz,big){
  sz=sz||1;fxs.push({x,y,t:0,max:Math.round(20+8*sz),r:16*sz,big:!!big});
  const n=Math.round(10*sz);
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(1,4.5)*Math.sqrt(sz);
    particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rndi(18,40),rnd(1.5,3.5),['#ffd23f','#ff8a1f','#ff4d2e','#fff1a8'][rndi(0,3)],0.02);}
  for(let i=0;i<Math.round(4*sz);i++){const a=rnd(0,TAU),s=rnd(0.3,1.4);
    particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rndi(30,60),rnd(3,6)*Math.sqrt(sz),'rgba(60,60,70,.55)',-0.01);}
  for(let i=0;i<Math.round(6*sz);i++){const a=rnd(0,TAU),s=rnd(3,7)*Math.sqrt(sz);
    particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rndi(8,16),rnd(1,1.8),'#fff3c4',0,1);}
  for(let i=0;i<Math.round(3*sz);i++){const a=rnd(0,TAU),s=rnd(1.5,4)*Math.sqrt(sz);
    particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rndi(30,55),rnd(1.6,3.2),['#2a2f3a','#4a5263','#6b4a2a'][rndi(0,2)],0,2);}
  if(sz>=1.2)fxs.push({x,y,t:0,max:Math.round(14+5*sz),r:18*sz,ring:true});
  if(sz>=2){shake=Math.max(shake,5+sz*1.6)}
  else if(sz>=1.2)shake=Math.max(shake,3);
  noise(0.12+sz*0.08,Math.min(0.2,0.05+sz*0.03));
}
function spark(x,y){for(let i=0;i<3;i++){const a=rnd(-Math.PI,0);particle(x,y,Math.cos(a)*2,Math.sin(a)*2,10,1.4,'#fff6b0',0.1)}}
function popText(x,y,s,col,sz){texts.push({x,y,s,col:col||'#fff',life:46,sz:sz||12})}

/* ---------- scoring ---------- */
function addScore(v,x,y,noMult){
  const t=Math.round(v*(noMult?1:mult));score+=t;
  if(x!==undefined&&v>=10)popText(x,y,t,mult>1&&!noMult?'#ffe14d':'#fff',v>=100?16:12);
  if(score>=nextLife){nextLife+=nextLife<6000?5000:8000;if(lives<5)lives++;popText(P.x,P.y-30,'+1 VIDA','#7dff9a',16);tone(500,1200,0.4,'triangle',0.08)}
}
// raspão: tiro inimigo que passa colado no avião vale pontos e segura a sequência
function graze(b){
  ST.gz++;addScore(2,undefined,undefined,true);if(chain>0)chainT=Math.min(110,chainT+14);gzT=10;
  particle(b.x,b.y,(b.x-P.x)*0.15,(b.y-P.y)*0.15,10,1.2,'#bff4ff',0,1);
  if(frame%4===0)tone(2200,2900,0.03,'sine',0.018);
}
function onKill(){chain++;chainT=110;mult=Math.min(8,1+Math.floor(chain/5));ST.k++;if(chain>ST.ch)ST.ch=chain}

/* ---------- background ---------- */
function mkIsland(x,y,w,h,kind){
  const n=16,pts=[];const sd=Math.random()*1000;
  for(let i=0;i<n;i++){const a=i/n*TAU;pts.push([Math.cos(a)*(0.7+0.3*hash(sd+i)),Math.sin(a)*(0.7+0.3*hash(sd+i+50))])}
  const trees=[];const nt=Math.round(w*h/260);
  for(let i=0;i<nt;i++){const a=rnd(0,TAU),r=Math.sqrt(Math.random())*0.7;trees.push([Math.cos(a)*r,Math.sin(a)*r,rnd(3,6.5),Math.random()])}
  deco.push({k:'island',x,y,w,h,pts,trees,kind,sd});
}
function mkCloud(x,y,layer){
  const bl=[];const n=rndi(4,7);
  for(let i=0;i<n;i++)bl.push([rnd(-40,40),rnd(-9,9),rnd(14,30)]);
  deco.push({k:'cloud',x,y,layer,bl});
}
function mkBldg(x,y){deco.push({k:'bldg',x,y,w:rndi(40,90),h:rndi(40,110),seed:Math.random()*100})}
function initBg(){
  deco.length=0;scr=0;
  for(let y=-100;y<H+100;y+=rnd(60,150)){
    if(stage===1)mkIsland(rnd(30,330),y,rnd(60,130),rnd(40,90),0);
    else if(stage===2)mkIsland(rnd(0,360),y,rnd(130,230),rnd(90,170),1);
    else mkBldg(rnd(10,330),y);
  }
  for(let i=0;i<6;i++)mkCloud(rnd(0,360),rnd(-50,H),i%2);
  bgIsland=rnd(60,200);bgCloud=rnd(60,200);
}
function updateBg(){
  scr+=SPD;
  bgIsland-=SPD;bgCloud-=SPD;
  if(bgIsland<=0){
    if(stage===1){mkIsland(rnd(30,330),-100,rnd(60,130),rnd(40,90),0);bgIsland=rnd(130,300)}
    else if(stage===2){mkIsland(rnd(0,360),-150,rnd(130,230),rnd(90,170),1);bgIsland=rnd(60,160)}
    else{mkBldg(rnd(10,330),-120);bgIsland=rnd(70,170)}
  }
  if(bgCloud<=0){mkCloud(rnd(0,360),-60,Math.random()<0.5?1:0);bgCloud=rnd(120,330)}
  for(const d of deco){d.y+=d.k==='cloud'?(d.layer?SPD*1.7:SPD*1.25):SPD;
    if(d.k==='scorch'&&!d.sea&&frame%10===0&&d.y>0&&d.y<H)particle(d.x+rnd(-4,4),d.y,rnd(-.2,.2),-rnd(.3,.8),40,rnd(3,5),'rgba(50,50,55,.35)',-0.005)}
  deco=deco.filter(d=>d.y<H+260);
}
function drawBlob(d,sc,fill){
  ctx.fillStyle=fill;ctx.beginPath();
  for(let i=0;i<d.pts.length;i++){const p=d.pts[i],x=d.x+p[0]*d.w/2*sc,y=d.y+p[1]*d.h/2*sc;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.closePath();ctx.fill();
}
let oceanGrad=[null,null];
function drawBg(){
  if(stage<3){
    if(!oceanGrad[stage-1]){const g=ctx.createLinearGradient(0,0,0,H);
      if(stage===1){g.addColorStop(0,'#0f5c9c');g.addColorStop(1,'#1c86c9')}else{g.addColorStop(0,'#0c8aa0');g.addColorStop(1,'#25b3b5')}
      oceanGrad[stage-1]=g}
    ctx.fillStyle=oceanGrad[stage-1];ctx.fillRect(0,0,W,H);
    const rh=22,off=scr%rh,base=Math.floor(scr/rh);
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.6;ctx.beginPath();
    for(let i=-1;i<H/rh+1;i++){
      const ri=i-base,y=i*rh+off;
      for(let k=0;k<3;k++){const x=hash(ri*3+k)*(W+40)-20,l=18+hash(ri*7+k)*26;
        ctx.moveTo(x,y);ctx.quadraticCurveTo(x+l/2,y-4,x+l,y)}
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(0,30,70,.18)';ctx.beginPath();
    for(let i=-1;i<H/rh+1;i++){const ri=i-base,y=i*rh+off+9;const x=hash(ri*5+2)*(W+40)-20,l=26+hash(ri*9)*30;
      ctx.moveTo(x,y);ctx.quadraticCurveTo(x+l/2,y+3,x+l,y)}
    ctx.stroke();
    // reflexos do sol
    ctx.fillStyle='#fff';
    for(let i=-1;i<H/46+1;i++){const ri=i-Math.floor(scr/46),y=i*46+scr%46,h1=hash(ri*11+3);if(h1<0.4)continue;
      const x=hash(ri*17+1)*W,a=Math.sin(frame*0.07+h1*40);if(a<0.1)continue;
      ctx.globalAlpha=a*0.75;ctx.fillRect(x-3.5*a,y-0.6,7*a,1.2);ctx.fillRect(x-0.6,y-2.2*a,1.2,4.4*a)}
    ctx.globalAlpha=1;
  }else{
    ctx.fillStyle='#2b303b';ctx.fillRect(0,0,W,H);
    const ts=60,off=scr%ts,base=Math.floor(scr/ts);
    for(let i=-1;i<H/ts+1;i++){const ri=i-base,y=i*ts+off;
      for(let j=0;j<6;j++){const hh=hash(ri*13+j*7),x=j*ts;
        ctx.fillStyle=hh<0.3?'#323846':hh<0.6?'#262b36':'#2e3440';ctx.fillRect(x+1,y+1,ts-2,ts-2);
        if(hh>0.86){ctx.fillStyle='#1b1e27';ctx.fillRect(x+12,y+14,ts-24,ts-28);ctx.fillStyle='#3d4455';for(let s=0;s<4;s++)ctx.fillRect(x+14,y+17+s*7,ts-28,3)}
        else if(hh>0.78){ctx.fillStyle='#d9a21c';ctx.save();ctx.beginPath();ctx.rect(x+1,y+ts-14,ts-2,10);ctx.clip();
          for(let s=-2;s<8;s++){ctx.beginPath();ctx.moveTo(x+s*12,y+ts-4);ctx.lineTo(x+s*12+6,y+ts-14);ctx.lineTo(x+s*12+12,y+ts-14);ctx.lineTo(x+s*12+6,y+ts-4);ctx.fill()}
          ctx.restore()}
        if(hh<0.12){const bl=(Math.floor(frame/30)+ri+j)%3===0;ctx.fillStyle=bl?'#ff4d4d':'#5a2230';ctx.beginPath();ctx.arc(x+ts/2,y+ts/2,4,0,TAU);ctx.fill()}
        ctx.fillStyle='#4b5366';ctx.fillRect(x+4,y+4,2,2);ctx.fillRect(x+ts-6,y+4,2,2);
      }}
  }
  for(const d of deco){
    if(d.k==='island'){
      if(d.kind===0){
        drawBlob(d,1.16+0.04*Math.sin(frame*0.05+d.sd),'rgba(190,235,255,.35)');drawBlob(d,1.1,'rgba(255,255,255,.3)');drawBlob(d,1.06,'#ead9a0');drawBlob(d,0.9,'#d8c27e');drawBlob(d,0.82,'#4fae4a');
        ctx.fillStyle='#2d8238';for(const t of d.trees){ctx.beginPath();ctx.arc(d.x+t[0]*d.w/2,d.y+t[1]*d.h/2,t[2],0,TAU);ctx.fill()}
        ctx.fillStyle='#69c85c';for(const t of d.trees){ctx.beginPath();ctx.arc(d.x+t[0]*d.w/2-1,d.y+t[1]*d.h/2-1.5,t[2]*0.55,0,TAU);ctx.fill()}
      }else{
        drawBlob(d,1.12+0.04*Math.sin(frame*0.05+d.sd),'rgba(200,255,255,.3)');drawBlob(d,1.08,'rgba(255,255,255,.28)');drawBlob(d,1.05,'#e2cf8e');drawBlob(d,0.92,'#3e9a45');
        ctx.fillStyle='#237232';for(const t of d.trees){ctx.beginPath();ctx.arc(d.x+t[0]*d.w/2*1.1,d.y+t[1]*d.h/2*1.1,t[2]+2,0,TAU);ctx.fill()}
        ctx.fillStyle='#58b856';for(const t of d.trees){ctx.beginPath();ctx.arc(d.x+t[0]*d.w/2*1.1-1.5,d.y+t[1]*d.h/2*1.1-2,t[2]*0.6,0,TAU);ctx.fill()}
      }
    }else if(d.k==='bldg'){
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(d.x+6,d.y+6,d.w,d.h);
      ctx.fillStyle='#454d5e';ctx.fillRect(d.x,d.y,d.w,d.h);ctx.fillStyle='#596277';ctx.fillRect(d.x+3,d.y+3,d.w-6,d.h-6);
      ctx.fillStyle='#394052';for(let i=0;i<d.h/14;i++)ctx.fillRect(d.x+6,d.y+8+i*14,d.w-12,5);
      ctx.fillStyle=(Math.floor(frame/20+d.seed)%2)?'#ff5a3d':'#7a2d2d';ctx.beginPath();ctx.arc(d.x+d.w-8,d.y+8,3.5,0,TAU);ctx.fill();
    }else if(d.k==='scorch'){
      if(d.sea){ctx.fillStyle='rgba(10,20,30,.1)';
        for(let i=0;i<4;i++){const a=d.sd+i*1.7;ctx.beginPath();ctx.ellipse(d.x+Math.cos(a)*d.r*0.35,d.y+Math.sin(a)*d.r*0.3,d.r*(0.7+0.15*i),d.r*(0.45+0.1*i),a,0,TAU);ctx.fill()}
        ctx.strokeStyle='rgba(190,150,255,.1)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*0.6,d.r*0.38,d.sd,0,TAU);ctx.stroke()}
      else{ctx.fillStyle='rgba(22,15,10,.42)';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,TAU);ctx.fill();
        for(let i=0;i<5;i++){const a=d.sd+i*1.3;ctx.beginPath();ctx.arc(d.x+Math.cos(a)*d.r*0.9,d.y+Math.sin(a)*d.r*0.9,d.r*0.35,0,TAU);ctx.fill()}
        ctx.fillStyle='rgba(255,120,40,'+(0.22+0.18*Math.sin(frame*0.2+d.sd))+')';ctx.beginPath();ctx.arc(d.x,d.y,d.r*0.25,0,TAU);ctx.fill()}
    }
  }
}
function drawCloud(d){
  const a=stage===3?(d.layer?0.4:0.3):(d.layer?0.6:0.5);
  ctx.fillStyle=stage===3?'rgba(70,70,85,'+a+')':'rgba(255,255,255,'+a+')';
  for(const b of d.bl){ctx.beginPath();ctx.ellipse(d.x+b[0],d.y+b[1],b[2]*1.3,b[2]*0.8,0,0,TAU);ctx.fill()}
}

/* ---------- sprites ---------- */
let FL=false,SH=false;
const C=c=>SH?'#000':FL?'#fff':c;
function drawPlayer(x,y,bank,t,alpha){
  ctx.save();ctx.translate(x,y);if(alpha<1)ctx.globalAlpha=alpha;
  const wx=24*(1-Math.abs(bank)*0.22);
  if(!SH){
    const fl=7+Math.random()*6;
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,140,40,.35)';ctx.beginPath();ctx.arc(0,18,7,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-3.5,14);ctx.lineTo(0,14+fl);ctx.lineTo(3.5,14);ctx.fill();
    ctx.fillStyle='#ff7a1f';ctx.beginPath();ctx.moveTo(-2,14);ctx.lineTo(0,14+fl*0.6);ctx.lineTo(2,14);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-1,14);ctx.lineTo(0,14+fl*0.3);ctx.lineTo(1,14);ctx.fill();
  }
  ctx.fillStyle=C('#2c5fb3');
  ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(-wx,13);ctx.lineTo(-wx+6,16);ctx.lineTo(-3,9);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(4,-4);ctx.lineTo(wx,13);ctx.lineTo(wx-6,16);ctx.lineTo(3,9);ctx.closePath();ctx.fill();
  if(!SH){
    // bordo de ataque iluminado; a asa que abaixa na curva escurece
    ctx.fillStyle='#5b93ec';
    ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(-wx,13);ctx.lineTo(-wx+3,13.6);ctx.lineTo(-3.6,-0.4);ctx.fill();

function spawnWave(){
  waveN++;const lead=waveN%3===1;
  const pool=stage===1?['sine','sine','V','side','dive','boat','loop','heli']:stage===2?['sine','V','side','dive','loop','tank','boat','tank','heli']:['dive','side','loop','V','sine','turret','tank','heli','heli'];
  let p=pool[rndi(0,pool.length-1)];
  if((p==='loop'||p==='heli')&&stageT<700)p='sine';
  const n=clamp(4+Math.floor(stage/2)+loop,4,8);
  if(p==='sine')wSine(n,lead);else if(p==='V')wV(lead);else if(p==='side')wSide(n,lead);else if(p==='dive')wDive(n-1,lead);
  else if(p==='loop')wLoop(n-1,lead);else if(p==='heli')wHeli(lead);else if(p==='boat'){if(stage===3)wTurrets();else wBoats()}else if(p==='tank')wTanks();else wTurrets();
  if(stage===2&&p!=='tank'&&Math.random()<0.2)wTanks();
}

function enemyShoot(e){
  const s=2.4;
  if(e.kind==='f'){
    if(stage>=2&&Math.random()<0.4)fan(e.x,e.y,aimAng(e.x,e.y),2,0.22,s,1);else ebul(e.x,e.y,aimAng(e.x,e.y),s,1);
  }else if(e.kind==='boat'){fan(e.x,e.y+6,aimAng(e.x,e.y),3,0.26,2.1,0)}
  else if(e.kind==='tank'){ebul(e.x,e.y,e.ang,2.3,0);if(stage>=2||loop)ebul(e.x,e.y,e.ang+0.2,2.3,2)}
  else if(e.kind==='heli'){e.fire=Math.round(rndi(60,90)/fm());const n=stage>=3||loop?4:3;
    for(let i=0;i<n;i++)later(i*7,()=>{if(!e.dead&&e.y<H-150)ebul(e.x,e.y+8,aimAng(e.x,e.y+8),2.7,1)})}
}

function updateEnemies(){
  for(const e of en){
    e.t++;if(e.flash>0)e.flash--;
    if(e.g){
      e.y+=SPD;e.x+=e.vx||0;
      if(e.kind==='boat'&&e.t%3===0)gpart(e.x+rnd(-7,7),e.y-22,rnd(-0.35,0.35),SPD-1.1,rndi(30,45),rnd(2,3.5),'rgba(255,255,255,.5)');
      e.ang=aimAng(e.x,e.y);
      if(--e.fire<=0){e.fire=Math.round(rndi(90,150)/fm());if(e.y>10&&e.y<H-150)enemyShoot(e)}
    }else{
      const px=e.x,py=e.y;
      if(e.m==='sine'){e.y+=e.sp;e.x=e.bx+e.A*Math.sin(e.t*0.045+e.ph);e.h=Math.atan2(e.y-py,e.x-px)}
      else if(e.m==='dive'){e.sp=Math.min(4.2,e.sp+0.02);e.x+=Math.cos(e.h)*e.sp;e.y+=Math.sin(e.h)*e.sp}
      else if(e.m==='side'){
        if(e.dir>0&&e.h<Math.PI/2)e.h=Math.min(Math.PI/2,e.h+0.028);else if(e.dir<0&&e.h>Math.PI/2)e.h=Math.max(Math.PI/2,e.h-0.028);
        e.x+=Math.cos(e.h)*e.sp;e.y+=Math.sin(e.h)*e.sp}
      else if(e.m==='loop'){
        if(!e.looping&&!e.loopDone&&e.y>170){e.looping=true;e.h0=e.h}
        if(e.looping){e.h+=e.dir*0.06;if(Math.abs(e.h-e.h0)>=TAU-0.05){e.looping=false;e.loopDone=true;e.h=e.h0}}
        e.x+=Math.cos(e.h)*e.sp*1.15;e.y+=Math.sin(e.h)*e.sp*1.15}
      else if(e.m==='heli'){
        if(e.t<e.stay){e.y+=(e.ty-e.y)*0.035;e.x+=Math.sin(e.t*0.025+e.ty)*0.5}else e.y+=Math.min(3.2,(e.t-e.stay)*0.03);
        e.ang=aimAng(e.x,e.y)}
      if(--e.fire<=0){e.fire=Math.round(rndi(80,150)/fm());if(e.y>20&&e.y<H-180&&e.m!=='dive')enemyShoot(e)}
    }
  }
}

/* ---------- bigs (bomber, bosses) ---------- */
function addPart(b,ox,oy,r,hp,kind){b.parts.push({ox,oy,r,hp:hp*hm(),max:hp*hm(),flash:0,kind:kind||'tur',cd:rndi(30,90),ang:Math.PI/2})}
function addBig(kind){
  const b={kind,x:180,y:-80,t:0,parts:[],flash:0,dying:0,lock:false,exposed:false,air:true,boss:false,hw:30,hh:20,bx:0,by:0,hp:30,score:300,phase:1,sp:0};
  if(kind==='bomber'){b.x=rnd(110,250);b.y=-60;b.hw=40;b.hh=18;b.hp=26;
    addPart(b,-34,4,9,9);addPart(b,34,4,9,9);addPart(b,0,24,8,9)}
  else if(kind==='ship'){b.boss=true;b.air=false;b.x=180;b.y=-150;b.hw=34;b.hh=95;b.hp=180;b.lock=true;b.score=600;
    addPart(b,0,70,13,34);addPart(b,0,25,13,34);addPart(b,0,-20,13,34);addPart(b,-25,-68,9,20,'aa');addPart(b,25,-68,9,20,'aa')}
  else if(kind==='wing'){b.boss=true;b.x=180;b.y=-80;b.hw=62;b.hh=26;b.hp=250;b.lock=true;b.score=900;b.by=4;
    addPart(b,-100,-12,16,46,'eng');addPart(b,100,-12,16,46,'eng');addPart(b,-48,14,11,34);addPart(b,48,14,11,34);addPart(b,0,-18,11,38)}
  else if(kind==='fort'){b.boss=true;b.air=false;b.x=180;b.y=-130;b.hw=44;b.hh=44;b.hp=320;b.lock=true;b.score=1400;
    addPart(b,-98,-56,14,44);addPart(b,98,-56,14,44);addPart(b,-98,56,14,44);addPart(b,98,56,14,44);addPart(b,-42,70,10,34);addPart(b,42,70,10,34)}
  b.hp*=hm();b.max=b.hp;
  for(const p of b.parts){}
  bigs.push(b);if(b.boss)bossObj=b;return b;
}
function partsAlive(b){let n=0;for(const p of b.parts)if(p.hp>0)n++;return n}
function bigRatio(b){let h=Math.max(0,b.hp),m=b.max;for(const p of b.parts){h+=Math.max(0,p.hp);m+=p.max}return h/m}
function damagePart(b,p,d){
  p.hp-=d;p.flash=4;
  if(p.hp<=0){boom(b.x+p.ox,b.y+p.oy,1.4);addScore(50,b.x+p.ox,b.y+p.oy);onKill();shake=Math.max(shake,3);
    if(!partsAlive(b)&&b.lock){b.exposed=true;b.phase=2;b.t2=0;flash=Math.max(flash,0.5);if(b.boss)popText(b.x,b.y,'NÚCLEO EXPOSTO!','#ffe14d',16)}}
}
function damageBody(b,d){
  b.hp-=d;b.flash=3;
  if(b.hp<=0&&!b.dying){b.dying=b.boss?110:30;if(b.boss)slow=70;
    addScore(b.score,b.x,b.y-20);onKill();onKill();
    for(let i=0;i<(b.boss?14:3);i++)items.push({x:b.x+rnd(-50,50),y:b.y+rnd(-30,30),k:'M',vy:rnd(0.4,1.2),t:0});
    if(!b.boss){const k=nextDrop();items.push({x:b.x,y:b.y,k,vy:0.9,t:0})}
    if(b.boss){bossObj=b}
  }
}
function hitBig(b,x,y,rad,dmg){
  if(b.dying)return false;
  for(const p of b.parts){if(p.hp<=0)continue;const dx=x-(b.x+p.ox),dy=y-(b.y+p.oy),rr=p.r+rad;
    if(dx*dx+dy*dy<rr*rr){damagePart(b,p,dmg);return true}}
  if(Math.abs(x-b.x-b.bx)<b.hw+rad&&Math.abs(y-b.y-b.by)<b.hh+rad){
    if(b.lock&&partsAlive(b)>0){
      // tiro na mesma coluna de uma torre passa por cima do casco até ela (antes o casco engolia o tiro e o navio só morria com bomba)
      if(b.parts.some(p=>p.hp>0&&Math.abs(x-(b.x+p.ox))<p.r+rad))return false;
      spark(x,y);return true}
    damageBody(b,dmg);return true}
  return false;
}
function aimPart(b,p){p.ang=aimAng(b.x+p.ox,b.y+p.oy)}
function updateBig(b){
  b.t++;if(b.flash>0)b.flash--;
  for(const p of b.parts){if(p.flash>0)p.flash--;if(p.hp>0)aimPart(b,p)}
  const F=fm();
  if(b.dying){
    b.dying--;
    if(b.dying%4===0){boom(b.x+rnd(-b.hw,b.hw),b.y+rnd(-b.hh,b.hh),rnd(1,2.2),false)}
    if(b.boss)shake=Math.max(shake,4);
    if(b.kind==='wing'){b.y+=0.6}
    if(b.dying<=0){b.dead=true;boom(b.x,b.y,b.boss?5:2.4,true);flash=1;
      if(!b.air){scorch(b.x,b.y,b.kind==='ship'?55:90,b.kind==='ship');if(b.kind==='ship')splash(b.x,b.y,40)}
      if(b.boss){bossObj=null;phase='clear';clearT=330;bannerT=0}}
    return;
  }
  if(b.kind==='bomber'){
    if(b.t<80)b.y+=1.4;else if(b.t<620){b.x+=Math.sin(b.t*0.015)*0.9}else b.y+=1.4;
    b.x=clamp(b.x,60,300);
    for(const p of b.parts){if(p.hp<=0)continue;if(--p.cd<=0){p.cd=Math.round(rndi(80,110)/F);
      if(b.y>0&&b.y<H-200){if(p.ox===0)ring(b.x+p.ox,b.y+p.oy,9,1.7,rnd(0,TAU),1);else fan(b.x+p.ox,b.y+p.oy,p.ang,3,0.24,2.2,0)}}}
    if(b.parts.every(p=>p.hp<=0)&&b.t%90===0)fan(b.x,b.y+10,aimAng(b.x,b.y),5,0.2,2.2,0);
    if(b.y>H+80)b.dead=true;
  }
  else if(b.kind==='ship'){
    if(b.y<185)b.y+=0.8;else{b.x=180+50*Math.sin(b.t*0.012)}
    if(b.t%2===0){const sd=Math.random()<0.5?-1:1;gpart(b.x+sd*rnd(26,36),b.y-96,sd*rnd(0.2,0.8),SPD-1.6,rndi(40,60),rnd(3,5),'rgba(255,255,255,.5)');
      gpart(b.x+sd*rnd(10,30),b.y+rnd(60,100),sd*rnd(0.6,1.2),SPD-0.6,rndi(25,40),rnd(2,3.5),'rgba(255,255,255,.4)')}
    if(b.y<100)return;
    if(!b.exposed){
      for(const p of b.parts){if(p.hp<=0)continue;if(--p.cd<=0){
        const wx=b.x+p.ox,wy=b.y+p.oy;
        if(p.kind==='aa'){p.cd=Math.round(40/F);fan(wx,wy,p.ang,2,0.12,2.9,1)}
        else if(p.oy>50){p.cd=Math.round(80/F);fan(wx,wy,p.ang,4,0.24,2.5,0)}
        else if(p.oy>0){p.cd=Math.round(110/F);ring(wx,wy,14,2.0,rnd(0,TAU),1);}
        else {p.cd=Math.round(95/F);fan(wx,wy,p.ang,6,0.18,2.3,0)}}}
    }else{
      b.t2++;const r=bigRatio(b),fast=r<0.4?1.4:1;
      b.x=180+90*Math.sin(b.t*0.017*fast);
      if(b.t2%Math.round(62/fast)===0)ring(b.x,b.y-40,20+(r<0.4?8:0),2.0,(b.t2%124)?0.16:0,0);
      if(b.t2%Math.round(30/fast)===0)fan(b.x,b.y-40,aimAng(b.x,b.y-40),r<0.5?7:5,0.18,2.7,1);
      if(r<0.5&&b.t2%7===0)ebul(b.x,b.y+80,aimAng(b.x,b.y+80)+Math.sin(b.t2*0.05)*0.5,3,2);
    }
  }
  else if(b.kind==='wing'){
    if(b.y<120)b.y+=1.3;else{b.x=180+(b.exposed?100:70)*Math.sin(b.t*0.014)}
    if(b.y<100)return;
    if(!b.exposed){
      for(const p of b.parts){if(p.hp<=0)continue;if(--p.cd<=0){const wx=b.x+p.ox,wy=b.y+p.oy;
        if(p.kind==='eng'){p.cd=Math.round(85/F);fan(wx,wy,p.ang,6,0.2,2.4,0)}
        else if(p.oy<0){p.cd=Math.round(105/F);ring(wx,wy,16,1.9,rnd(0,TAU),1)}
        else{p.cd=Math.round(45/F);fan(wx,wy,p.ang,3,0.14,2.9,1)}}}
    }else{
      b.t2++;const r=bigRatio(b);
      if(b.t2%4===0){const a=b.t2*0.12;ebul(b.x,b.y+6,a,2.0,2);ebul(b.x,b.y+6,a+Math.PI,2.0,2);if(r<0.7){ebul(b.x,b.y+6,a+Math.PI/2,2.0,2);ebul(b.x,b.y+6,a-Math.PI/2,2.0,2)}}
      if(b.t2%100===0)ring(b.x,b.y+6,26,1.7,rnd(0,TAU),0);
      if(r<0.6&&b.t2%55===0)fan(b.x,b.y+6,aimAng(b.x,b.y),7,0.16,2.8,1);
    }
  }
  else if(b.kind==='fort'){
    if(b.y<175)b.y+=0.8;
    if(b.y<100)return;
    if(!b.exposed){
      for(const p of b.parts){if(p.hp<=0)continue;if(--p.cd<=0){const wx=b.x+p.ox,wy=b.y+p.oy;
        if(p.oy>60){p.cd=Math.round(50/F);fan(wx,wy,p.ang,2,0.1,3.1,1)}
        else if(p.ox<0){p.cd=Math.round(85/F);fan(wx,wy,p.ang,6,0.18,2.4,0)}
        else{p.cd=Math.round(100/F);ring(wx,wy,16,2.0,rnd(0,TAU),1)}}}
    }else{
      b.t2++;const r=bigRatio(b),pat=Math.floor(b.t2/240)%3,fast=r<0.4?1.35:1;
      if(pat===0){if(b.t2%3===0){const a=b.t2*0.11*fast,n=r<0.5?4:3;for(let i=0;i<n;i++)ebul(b.x,b.y,a+i*TAU/n,2.0,2)}if(b.t2%60===0)fan(b.x,b.y,aimAng(b.x,b.y),3,0.14,2.8,1)}
      else if(pat===1){if(b.t2%44===0)ring(b.x,b.y,24+(r<0.4?8:0),1.9,(b.t2%88)?0.13:0,0);if(b.t2%22===0)fan(b.x,b.y,aimAng(b.x,b.y),3,0.16,2.9,1)}
      else{if(b.t2%38===0)fan(b.x,b.y,aimAng(b.x,b.y),11,0.18,2.6,0);if(b.t2%70===0)ring(b.x,b.y,16,1.6,0.1,1)}
    }
  }
}

/* ---------- items ---------- */
const DROPS=['P','P','P','H','P','P','B','P','P','H'];
function nextDrop(){let k=DROPS[dropI++%DROPS.length];if(k==='P'&&wlvl>=5)k='M';return k}
function killEnemy(e){
  e.dead=true;onKill();
  boom(e.x,e.y,e.kind==='f'?1:1.3);
  if(e.g){const sea=e.kind==='boat'||stage===1&&e.kind!=='tank';scorch(e.x,e.y,e.r*1.5,sea);if(e.kind==='boat')splash(e.x,e.y,14)}
  addScore(e.score,e.x,e.y-10);
  if(e.leader){items.push({x:e.x,y:e.y,k:nextDrop(),vy:0.9,t:0})}
  else if(Math.random()<0.28)items.push({x:e.x,y:e.y,k:'M',vy:0.8,t:0});
}
function scorch(x,y,r,sea){deco.push({k:'scorch',x,y,r,sea,sd:Math.random()*100})}
function splash(x,y,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(0.4,2.2);gpart(x,y,Math.cos(a)*s,Math.sin(a)*s+SPD,rndi(25,45),rnd(2.5,5),'rgba(255,255,255,.6)')}}
function damageEnemy(e,d){e.hp-=d;e.flash=3;if(e.hp<=0&&!e.dead)killEnemy(e)}

/* ---------- player ---------- */
function fireBullet(x,y,ang,dmg,k){pb.push({x,y,vx:Math.sin(ang)*11,vy:-Math.cos(ang)*11,dmg,k:k||'b',life:90})}
function playerFire(){
  P.fireT--;P.missT--;
  if(P.fireT<=0){
    P.fireT=wlvl>=3?7:6;P.shot++;P.mf=3;
    const x=P.x,y=P.y-16;
    if(wlvl===1)fireBullet(x,y,0,1.2);
    else if(wlvl===2){fireBullet(x-6,y,0,1.1);fireBullet(x+6,y,0,1.1)}
    else if(wlvl===3||wlvl===4){fireBullet(x,y,0,1.1);fireBullet(x-5,y,-0.14,1);fireBullet(x+5,y,0.14,1);if(wlvl===4){fireBullet(x-9,y+2,-0.3,0.9);fireBullet(x+9,y+2,0.3,0.9)}}
    else{fireBullet(x-12,y,-0.1,0.9);fireBullet(x+12,y,0.1,0.9);fireBullet(x-17,y+2,-0.28,0.8);fireBullet(x+17,y+2,0.28,0.8)}
    if(P.shot%2===0)tone(900,500,0.05,'square',0.012);
  }
  P.beam=wlvl>=5;
  if(wlvl>=4&&P.missT<=0){P.missT=20;
    pb.push({x:P.x-16,y:P.y,vx:-1.5,vy:-6,dmg:2.5,k:'m',life:120});pb.push({x:P.x+16,y:P.y,vx:1.5,vy:-6,dmg:2.5,k:'m',life:120})}
}
function nearestTarget(x,y){
  let best=null,bd=1e9;
  for(const e of en){if(e.dead||e.y<0)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e}}
  for(const b of bigs){if(b.dying||b.y<0)continue;const d=(b.x-x)**2+(b.y-y)**2;if(d<bd){bd=d;best={x:b.x,y:b.y}}}
  return best;
}
function updatePBullets(){
  for(const b of pb){
    if(b.k==='m'){
      const t=nearestTarget(b.x,b.y);
      if(t){const a=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx);let d=a-cur;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;
        const na=cur+clamp(d,-0.1,0.1),sp=Math.min(8,Math.hypot(b.vx,b.vy)+0.3);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp}
      else{b.vy=Math.max(-8,b.vy-0.3)}
      if(frame%2===0)particle(b.x,b.y+4,rnd(-.2,.2),1,10,2,'rgba(255,200,120,.7)',0);
    }
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.y<-20||b.x<-20||b.x>W+20||b.life<=0){b.dead=true;continue}
    for(const e of en){
      if(e.dead)continue;const rr=e.r+3;
      if((e.x-b.x)**2+(e.y-b.y)**2<rr*rr){damageEnemy(e,b.dmg);b.dead=true;spark(b.x,b.y);break}
    }
    if(b.dead)continue;
    for(const g of bigs){if(hitBig(g,b.x,b.y,3,b.dmg)){b.dead=true;break}}
  }
  pb=pb.filter(b=>!b.dead);
  // laser
  if(P.beam&&P.alive){
    P.laserT++;
    if(P.laserT%3===0){
      const d=1.6;
      for(const e of en){if(!e.dead&&e.y<P.y&&Math.abs(e.x-P.x)<e.r+6)damageEnemy(e,d)}
      for(const g of bigs){for(let y=P.y-14;y>-10;y-=12){if(hitBig(g,P.x,y,5,d))break}}
    }
  }
}
function bomb(){
  if(state!=='play'||!P.alive||bombs<=0||bombT>0)return;
  bombs--;bombT=75;P.inv=Math.max(P.inv,110);shake=10;flash=1;
  tone(300,40,0.7,'sawtooth',0.12);noise(0.6,0.2);
}
function updateBomb(){
  if(bombT<=0)return;bombT--;
  const r=(75-bombT)/75*520;
  for(const b of eb){if((b.x-P.x)**2+(b.y-P.y)**2<r*r){b.dead=true;if(Math.random()<0.5)particle(b.x,b.y,rnd(-1,1),rnd(-1,1),14,2.5,'#fff',0)}}
  eb=eb.filter(b=>!b.dead);
  for(const e of en){if(!e.dead&&e.y>0&&(e.x-P.x)**2+(e.y-P.y)**2<r*r)damageEnemy(e,0.8)}
  for(const g of bigs){if(g.dying||g.y<-40)continue;
    for(const p of g.parts)if(p.hp>0)damagePart(g,p,0.35);
    if(!g.lock||!partsAlive(g))damageBody(g,0.35)}
  if(bombT%3===0){const a=rnd(0,TAU),d=rnd(0,r);fxs.push({x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d*0.7,t:0,max:20,r:rnd(10,24),big:false})}
}
function hurt(){
  if(!P.alive||P.inv>0||god)return;
  if(P.shield>0)return;
  P.alive=false;boom(P.x,P.y,2.2,true);flash=0.6;noise(0.5,0.25);
  lives--;wlvl=Math.max(1,wlvl-1);chain=0;mult=1;medalV=10;ST.miss++;deadT=lives>0?70:100;
  for(const b of eb)b.dead=true;eb=eb.filter(b=>!b.dead);
}
function respawn(){P.alive=true;P.x=180;P.y=H+40;P.tr=[];P.inv=190;P.shield=0;ptr.active=false;ptr.id=null;if(bombs<1)bombs=1}

function updatePlayer(){
  if(!P.alive){
    deadT--;if(deadT<=0){if(lives>0)respawn();else endGame()}
    return;
  }
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx--;if(keys.ArrowRight||keys.KeyD)dx++;
  if(keys.ArrowUp||keys.KeyW)dy--;if(keys.ArrowDown||keys.KeyS)dy++;
  const sp=(keys.ShiftLeft||keys.ShiftRight)?2.2:4.4;
  const ox=P.x,oy=P.y;
  if(dx||dy){const l=Math.hypot(dx,dy);P.x+=dx/l*sp;P.y+=dy/l*sp}
  if(ptr.active){P.x+=clamp(ptr.tx-P.x,-18,18)*0.6;P.y+=clamp(ptr.ty-P.y,-18,18)*0.6}
  if(P.y>540&&P.inv>100&&!ptr.active&&!(dx||dy)&&P.y>H-120)P.y-=3;
  P.x=clamp(P.x,14,W-14);P.y=clamp(P.y,60,H-20);
  const mvx=P.x-ox;P.bank+=(clamp(mvx/4,-1,1)-P.bank)*0.2;
  if(Math.abs(mvx)>0.1||Math.abs(P.y-oy)>0.1)P.moving=20;else if(P.moving>0)P.moving--;
  if(P.inv>0)P.inv--;if(P.shield>0)P.shield--;if(P.mf>0)P.mf--;
  for(const t of P.tr)t.y+=4.5;P.tr.push({x:P.x,y:P.y,w:24*(1-Math.abs(P.bank)*0.22)});if(P.tr.length>12)P.tr.shift();
  playerFire();
}

/* ---------- main update ---------- */
function reset(){
  score=0;shown=0;lives=3;bombs=2;wlvl=1;stage=1;loop=0;chain=0;mult=1;chainT=0;nextLife=3000;medalV=10;
  pb=[];eb=[];en=[];bigs=[];items=[];parts=[];gparts=[];fxs=[];texts=[];queue=[];bossObj=null;
  P.x=180;P.y=540;P.alive=true;P.inv=120;P.shield=0;P.bank=0;P.fireT=0;P.missT=0;
  bombT=0;shake=0;flash=0;posted=false;newRec=false;
  startStage();
}
function startStage(){
  stageT=0;phase='run';waveT=70;waveN=0;queue=[];bannerT=150;bossIntro=0;ST={k:0,ch:0,md:0,gz:0,miss:0};tally=0;SPD=stage===3?1.7:1.5;
  initBg();oceanGrad=[null,null];
}
function endGame(){
  if(state!=='play')return;
  state='over';overT=0;
  if(score>best){best=Math.round(score);newRec=true;try{localStorage.setItem('esquadrilha_best2',String(best))}catch(e){}}
  if(!posted){posted=true;const p=clamp(Math.round(score),1,50000);
    if(Math.round(score)>0){try{if(parent!==window)parent.postMessage({tipo:"jogos:fim",pontos:p,nivel:NIVEL()},"*")}catch(e){}}}
}
function nextStage(){
  stage++;if(stage>3){stage=1;loop++}
  wlvl=1;P.beam=false;
  startStage();eb.length=0;en.length=0;
}
function director(){
  stageT++;
  for(const q of queue)q.t--;
  for(const q of queue.filter(q=>q.t<=0))q.fn();
  queue=queue.filter(q=>q.t>0);
  if(phase==='run'){
    if(stageT<STAGE_LEN){
      if(--waveT<=0){spawnWave();waveT=Math.max(60,Math.round((175-stage*10-loop*14)+rndi(0,40)))}
      if(stageT===700||stageT===1500||stageT===2200||(loop>0&&stageT===1100)){addBig('bomber')}
    }else{
      const left=en.filter(e=>!e.g).length+bigs.filter(b=>!b.boss).length;
      if((left===0&&queue.length===0)||stageT>STAGE_LEN+420){phase='warn';bossWarn=150;eb.length=0}
    }
  }else if(phase==='warn'){
    bossWarn--;if(bossWarn===0){addBig(stage===1?'ship':stage===2?'wing':'fort');phase='boss';bossIntro=170}
  }else if(phase==='clear'){
    clearT--;
    if(clearT===320)for(const i of items)if(i.k==='M')i.mag=true;
    if(clearT===300){tally=6;tallyBon=200+bombs*100+(ST.miss?0:300)}
    if(clearT===300-tally*16-10){addScore(tallyBon,undefined,undefined,true);tone(500,1500,0.35,'triangle',0.08)}
    else if(clearT<300&&clearT>300-tally*16&&(300-clearT)%16===0)tone(700,900,0.06,'square',0.03);
    if(clearT===40){fadeDir=1}
    if(clearT<=0){nextStage();fadeDir=-1}
  }
}
function collect(i){
  if(i.k==='P'){if(wlvl<5){wlvl++;popText(P.x,P.y-24,'ARMA '+wlvl,'#ffb02e',14)}else addScore(100,P.x,P.y-20);tone(600,1200,0.2,'triangle',0.07)}
  else if(i.k==='B'){if(bombs<3){bombs++;popText(P.x,P.y-24,'+BOMBA','#6ec8ff',14)}else addScore(100,P.x,P.y-20);tone(500,900,0.2,'triangle',0.07)}
  else if(i.k==='H'){if(lives<5){lives++;popText(P.x,P.y-24,'+1 VIDA','#ff8aa8',14)}else addScore(100,P.x,P.y-20);P.shield=Math.max(P.shield,180);tone(500,1400,0.3,'triangle',0.08)}
  else{addScore(medalV,P.x,P.y-16,true);tone(900+medalV*18,1400+medalV*24,0.07,'sine',0.045);medalV=Math.min(50,medalV+5);ST.md++}
}
function update(){
  frame++;
  updateBg();
  if(state==='menu'||state==='over'){
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--}parts=parts.filter(p=>p.life>0);
    if(state==='over')overT++;
    return;
  }
  if(fadeDir){fade=clamp(fade+fadeDir*0.04,0,1);if(fade>=1&&fadeDir>0)fadeDir=0;if(fade<=0&&fadeDir<0)fadeDir=0}
  if(bannerT>0)bannerT--;
  director();
  updatePlayer();
  updatePBullets();
  updateEnemies();
  for(const b of bigs)updateBig(b);
  updateBomb();
  // enemy bullets
  for(const b of eb){b.x+=b.vx;b.y+=b.vy;if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)b.dead=true;
    else if(P.alive&&P.inv<=0){const rr=b.r*0.75+2.4,d2=(b.x-P.x)**2+(b.y-P.y)**2;if(d2<rr*rr){if(P.shield>0){b.dead=true}else hurt()}
      else if(!b.gz&&d2<(rr+15)**2){b.gz=1;graze(b)}}}
  eb=eb.filter(b=>!b.dead);
  // enemies body contact + cleanup
  for(const e of en){
    if(e.dead)continue;
    if(!e.g&&P.alive&&P.inv<=0&&P.shield<=0&&(e.x-P.x)**2+(e.y-P.y)**2<(e.r+3)**2){hurt();damageEnemy(e,3)}
    if(e.y>H+60||e.x<-70||e.x>W+70||(e.y<-90&&e.t>60))e.dead=true;
  }
  en=en.filter(e=>!e.dead);
  bigs=bigs.filter(b=>!b.dead);
  // items
  for(const i of items){
    i.t++;
    if(i.k==='M'){
      const dx=P.x-i.x,dy=P.y-i.y,d=Math.hypot(dx,dy);
      if(P.alive&&(i.mag||d<70)){i.x+=dx/d*6;i.y+=dy/d*6}else{i.y+=i.vy+0.2;i.x+=Math.sin(i.t*0.08)*0.3}
    }else{i.y+=i.vy*0.8;i.x+=Math.sin(i.t*0.05)*0.8;if(i.x<16)i.x=16;if(i.x>W-16)i.x=W-16}
    if(P.alive&&(i.x-P.x)**2+(i.y-P.y)**2<(i.k==='M'?16:20)**2){i.dead=true;collect(i)}
    if(i.y>H+20){i.dead=true;if(i.k==='M'&&medalV>10&&state==='play'){medalV=10;medLostT=50}}
  }
  items=items.filter(i=>!i.dead);
  // particles / fx / text
  for(const p of parts){if(p.k===2){p.vx*=0.93;p.vy=p.vy*0.93+SPD*0.07;p.rot+=p.vr}p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}
  parts=parts.filter(p=>p.life>0);
  for(const p of gparts){p.x+=p.vx;p.y+=p.vy;p.life--}gparts=gparts.filter(p=>p.life>0);
  if(shown<score)shown=Math.min(score,shown+Math.max(1,Math.ceil((score-shown)*0.12)));else shown=score;
  if(bossIntro>0)bossIntro--;if(medLostT>0)medLostT--;if(gzT>0)gzT--;
  for(const f of fxs)f.t++;fxs=fxs.filter(f=>f.t<f.max);
  for(const t of texts){t.y-=0.5;t.life--}texts=texts.filter(t=>t.life>0);
  for(const g of bigs){if(g.dying&&g.boss==false)continue;if(!g.dying&&frame%5===0)for(const p of g.parts)if(p.hp<=0&&Math.random()<0.4)particle(g.x+p.ox,g.y+p.oy,rnd(-.3,.3),-rnd(.3,1),30,rnd(3,5),'rgba(50,50,55,.5)',-0.01)}
  if(chainT>0){if(--chainT===0){chain=0;mult=1}}
  if(shake>0)shake*=0.9;if(shake<0.2)shake=0;
  if(flash>0)flash=Math.max(0,flash-0.04);
}

}

function shadows(list){

  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=stage===3?0.34:0.24;ctx.drawImage(shc,shkX*cv.width/W,shkY*cv.height/H,cv.width,cv.height);ctx.restore();
}

    if(f.big){ctx.strokeStyle='#fff';ctx.lineWidth=3*(1-p);ctx.beginPath();ctx.arc(f.x,f.y,r*1.8,0,TAU);ctx.stroke()}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  for(const p of parts){
    ctx.globalAlpha=Math.min(1,p.life/p.max*1.3);
    if(p.k===1){ctx.strokeStyle=p.col;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);ctx.stroke();continue}
    ctx.fillStyle=p.col;
    if(p.k===2){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size,-p.size*0.55,p.size*2,p.size*1.1);ctx.restore();continue}
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.col.startsWith('rgba')?(1+(1-p.life/p.max)*0.8):p.life/p.max*0.6+0.4),0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  // bomb shockwave
  if(bombT>0){const r=(75-bombT)/75*520;ctx.strokeStyle='rgba(160,220,255,'+(bombT/75)+')';ctx.lineWidth=10;ctx.beginPath();ctx.arc(P.x,P.y,r,0,TAU);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(bombT/75*0.8)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.x,P.y,r*0.96,0,TAU);ctx.stroke()}
}
function drawBullets(){
  for(const b of eb){const s=BS[b.k];ctx.drawImage(s.c,b.x-s.s/2,b.y-s.s/2,s.s,s.s)}
  // hitbox
  if(P.alive&&state==='play'&&(P.moving>0||ptr.active)){
    ctx.fillStyle='rgba(255,60,120,.35)';ctx.beginPath();ctx.arc(P.x,P.y,7,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y,3.2,0,TAU);ctx.fill();
    ctx.strokeStyle='#ff2f8e';ctx.lineWidth=1.4;ctx.stroke();
  }
  if(gzT>0&&P.alive&&state==='play'){ctx.strokeStyle='rgba(170,240,255,'+(gzT/10)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,9+(10-gzT)*1.6,0,TAU);ctx.stroke()}
}
function drawTexts(){
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life/20);txt(String(t.s),t.x,t.y,t.sz,t.col,'center',FT,['#000',3])}
  ctx.globalAlpha=1;
}
function btn(x,y,w,h,label){
  ctx.fillStyle='#10213a';ctx.beginPath();ctx.roundRect?ctx.roundRect(x-2,y-2+4,w+4,h+4,16):ctx.rect(x,y,w,h);ctx.fill();
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#ffd23f');g.addColorStop(1,'#ff8a1f');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,14):ctx.rect(x,y,w,h);ctx.fill();
  txt(label,x+w/2,y+h/2+1,24,'#3a1a00','center',FT);
}
function render(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.save();
  shkX=shake>0?rnd(-shake,shake):0;shkY=shake>0?rnd(-shake,shake):0;ctx.translate(shkX,shkY);
  drawBg();
  if(state==='play'||state==='over')drawPlayWorld();
  else {
    // menu demo planes
    const pos=[0,1,2].map(i=>[180+(i-1)*56,262+Math.abs(i-1)*34+Math.sin(frame*0.03+i)*5,(i-1)*0.2]);
    shadows(pos.map(([x,y,bk])=>[x,y,0.8,()=>drawPlayer(x,y,bk,frame,1)]));
    for(const [x,y,bk] of pos)drawPlayer(x,y,bk,frame,1)
  }
  for(const d of deco)if(d.k==='cloud'&&d.layer)drawCloud(d);
  drawBullets();
  drawFx();
  drawTexts();
  ctx.restore();
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.85,flash)*0.8+')';ctx.fillRect(0,0,W,H)}
  if(state==='play'){
    drawHUD();drawBars();
    if(bannerT>0&&phase==='run'){
      const a=bannerT>120?(150-bannerT)/30:Math.min(1,bannerT/30);
      ctx.globalAlpha=clamp(a,0,1);
      txt('FASE '+(loop*3+stage),W/2,210,44,'#fff','center',FT,['#0a1a33',7]);
      txt(STAGE_NAMES[stage-1],W/2,248,18,'#ffe14d','center',FT,['#0a1a33',4]);
      ctx.globalAlpha=1;
    }
    if(phase==='warn'){
      const on=Math.floor(frame/12)%2===0;
      ctx.fillStyle='rgba(255,0,0,'+(on?0.22:0.08)+')';ctx.fillRect(0,0,W,H);
      if(on)txt('AVISO!',W/2,250,54,'#ff4d4d','center',FT,['#fff',6]);
      txt('CHEFE SE APROXIMANDO',W/2,296,16,'#fff','center',FT,['#400',4]);
    }
    if(bossIntro>0&&bossObj){const t=170-bossIntro,e=Math.min(1,t/16),o=Math.min(1,bossIntro/16),off=(1-e)*140;
      ctx.globalAlpha=Math.min(e,o);ctx.fillStyle='rgba(50,0,8,.68)';ctx.fillRect(0,300,W,66);
      ctx.fillStyle='#ff4d4d';ctx.fillRect(0,300,W,2);ctx.fillRect(0,364,W,2);
      txt(bossName(bossObj),W/2-off,327,32,'#fff','center',FT,['#400',6]);
      txt('Destrua as torres para expor o núcleo',W/2+off,353,12,'#ffd0d0','center',FB);
      ctx.globalAlpha=1}
    if(phase==='clear'&&clearT<310){
      ctx.globalAlpha=Math.min(1,(310-clearT)/15);
      txt('FASE CONCLUÍDA!',W/2,148,34,'#7dff9a','center',FT,['#063',6]);
      if(tally){const el=300-clearT;
        // linhas lidas ao vivo: as medalhas puxadas pelo ímã ainda entram na conta
        const rows=[['Abates',ST.k],['Maior sequência',ST.ch],['Medalhas',ST.md],['Raspões',ST.gz],['Bombas guardadas',bombs?'+'+bombs*100:'—'],['Sem perder vida',ST.miss?'—':'+300']];
        ctx.fillStyle='rgba(4,14,34,.75)';ctx.beginPath();ctx.roundRect?ctx.roundRect(46,178,268,206,14):ctx.rect(46,178,268,206);ctx.fill();
        rows.forEach((r,i)=>{if(el<i*16)return;const y=202+i*24;txt(r[0],62,y,13,'#cfe3ff','left',FB);txt(String(r[1]),298,y,15,'#fff','right',FT)});
        if(el>=rows.length*16+10){const y=210+rows.length*24;ctx.fillStyle='rgba(125,255,154,.2)';ctx.fillRect(56,y-13,248,26);
          txt('BÔNUS',62,y,14,'#7dff9a','left',FT);txt('+'+tallyBon,298,y,18,'#7dff9a','right',FT,['#063',3])}}
      ctx.globalAlpha=1;
    }
    if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSADO',W/2,300,40,'#fff','center',FT);txt('Toque, P ou Start para continuar',W/2,340,14,'#cfe','center',FB)}
  }
  if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,W,H)}
  if(state==='menu')drawMenu();
  if(state==='over')drawOver();
}
function drawMenu(){
  ctx.fillStyle='rgba(4,14,34,.55)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(0,Math.sin(frame*0.04)*3);
  txt('ESQUADRILHA',W/2,96,50,'#ffe14d','center',FT,['#0a1a33',9]);
  ctx.restore();
  txt('Defenda os céus em 3 fases',W/2,140,15,'#fff','center',FB);
  const tips=['Medalhas em sequência valem mais: até 50','Passe raspando nos tiros: pontos e sequência','Destrua as torres para expor o núcleo do chefe','A arma volta ao nível 1 em cada fase'];
  const ft=frame%220;ctx.globalAlpha=Math.min(1,ft/20,(220-ft)/20);
  txt('DICA',W/2,354,10,'#ffb02e','center',FT);txt(tips[Math.floor(frame/220)%tips.length],W/2,370,12.5,'#fff','center',FB,['#04101f',3]);ctx.globalAlpha=1;
  ctx.fillStyle='rgba(4,14,34,.7)';ctx.beginPath();ctx.roundRect?ctx.roundRect(24,386,312,150,14):ctx.rect(24,386,312,150);ctx.fill();
  const L=[['Arraste','dedo ou mouse para pilotar'],['Tiro','automático, sempre ligado'],['BOMBA / X','clique direito · limpa tiros'],['Setas / WASD','mover (Shift = preciso)'],['P','pausar · M som'],['Controle','analógico · B bomba · Start']];
  L.forEach((l,i)=>{txt(l[0],38,404+i*24,13,'#ffb02e','left',FT);txt(l[1],138,404+i*24,12,'#fff','left',FB)});
  txt('Pegue P (arma), B (bomba), ♥ (vida) e medalhas!',W/2,556,11.5,'#bfe0ff','center',FB);
  btn(90,572,180,52,'JOGAR');
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,24,.72)';ctx.fillRect(0,0,W,H);
  txt('FIM DE JOGO',W/2,170,44,'#ff5a6a','center',FT,['#200',8]);
  txt(NIVEL(),W/2,214,18,'#bfe0ff','center',FT);
  txt('PONTOS',W/2,262,13,'#8fb4e8','center');
  txt(String(Math.round(score)),W/2,296,48,'#fff','center',FT,['#0a1a33',6]);
  txt('Recorde: '+best,W/2,345,18,'#ffe14d','center',FT);
  if(newRec)txt('NOVO RECORDE!',W/2,376,20,'#7dff9a','center',FT,['#052',4]);
  if(overT>30)btn(70,430,220,54,'Jogar de novo');
}

/* ---------- input ---------- */
function startGame(){
  if(state==='play')return;
  ac();reset();state='play';fade=0;fadeDir=0;
}
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.repeat)return;
  if(e.code==='Enter'||e.code==='Space'){if(state==='menu'||(state==='over'&&overT>30))startGame();else if(paused)paused=false}
  if(e.code==='KeyX'||e.code==='KeyB')bomb();
  if(e.code==='KeyP'&&state==='play')paused=!paused;
  if(e.code==='KeyM'){muted=!muted;try{localStorage.setItem('esquadrilha_mute',muted?'1':'0')}catch(e){}}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true});
function lpos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const [x,y]=lpos(e);
  if(e.button===2){if(state==='play'&&!paused)bomb();return}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(Math.hypot(x-22,y-616)<20&&state!=='over'){muted=!muted;try{localStorage.setItem('esquadrilha_mute',muted?'1':'0')}catch(_){}return}
  if(state==='menu'){startGame();return}
  if(state==='over'){if(overT>30&&y>410)startGame();return}
  if(paused){paused=false;return}
  if(Math.hypot(x-322,y-596)<36){bomb();return}
  if(ptr.id===null){
    ptr.id=e.pointerId;ptr.active=true;
    let oy=P.y-y;if(oy>-50)oy=-62;
    ptr.ox=P.x-x;ptr.oy=oy;
    if(e.pointerType==='mouse'){ptr.ox=P.x-x;}
    ptr.tx=x+ptr.ox;ptr.ty=y+ptr.oy;
  }
});
cv.addEventListener('pointermove',e=>{
  // botão direito apertado durante o arrasto chega como pointermove, não pointerdown
  if(e.button===2&&(e.buttons&2)){if(state==='play'&&!paused)bomb();return}
  if(e.pointerId!==ptr.id)return;e.preventDefault();
  const [x,y]=lpos(e);ptr.tx=x+ptr.ox;ptr.ty=y+ptr.oy;
});
function up(e){if(e.pointerId===ptr.id){ptr.id=null;ptr.active=false}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
initBg();
function tick(now){
  requestAnimationFrame(tick);
  let dt=now-last;last=now;if(dt>100)dt=100;
  if(!(paused&&state==='play')){
    acc+=dt;
    while(acc>=1000/60){acc-=1000/60;if(slow>0&&state==='play'&&(--slow)%2)continue;update()}
  }else acc=0;
  render();
}
requestAnimationFrame(tick);

window.__esq={
  get s(){return {state,score,lives,bombs,wlvl,stage,phase,loop,en:en.length,bigs:bigs.length,eb:eb.length,mult,boss:!!bossObj}},
  god(v){god=v},sc(v){score=v},setW(v){wlvl=v},
  jump(st){stage=st;startStage()},
  toBoss(){stageT=STAGE_LEN+1000;en.length=0;queue.length=0},
  killBoss(){if(bossObj){for(const p of bossObj.parts)if(p.hp>0)damagePart(bossObj,p,9999);damageBody(bossObj,99999)}},
  start:startGame
};

/* controle: jogo usa setas/Space/X/P; menus usam A/Start para começar e recomeçar */
if(window.Controle){
  Controle.teclas({cima:'ArrowUp',baixo:'ArrowDown',esquerda:'ArrowLeft',direita:'ArrowRight',lb:'ShiftLeft',a:'Space',b:'KeyX',start:'KeyP'},{ativo:()=>state==='play'});
  Controle.teclas({a:['Space','Enter'],start:'Enter'},{ativo:()=>state!=='play'});
}
})();
</script>
