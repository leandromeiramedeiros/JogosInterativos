/* ===== audio (opcional) ===== */
let actx=null;
function beep(f,d,type,v,slide){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),gn=actx.createGain();
    o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),actx.currentTime+d);
    gn.gain.value=v||.05;gn.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(gn);gn.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}

const ATK={
 jab:{st:3,ac:4,en:8,dmg:3,kb:3.5,ks:.02,ang:35,hb:[14,-44,34,22],sw:{a0:.5,a1:-.05,thrust:1}},

 nair:{st:4,ac:8,en:10,dmg:6,kb:4.5,ks:.06,ang:50,hb:[-26,-62,52,50],air:1,sw:{a0:-.4,a1:5.9,ring:1}},

};
/* palco */
const FLOOR={x1:200,x2:760,y:400,solid:true},BODY_BOT=470;
const PLATS=[FLOOR,{x1:250,x2:390,y:295},{x1:570,x2:710,y:295},{x1:410,x2:550,y:190}];
const RESP_Y=150;
const BLAST={l:-130,r:1090,t:-190,b:680};

/* ===== entrada: teclado ===== */
const keys={},tapped={};
const GAMEKEYS=new Set(['KeyW','KeyA','KeyS','KeyD','KeyF','KeyG','KeyK','KeyL','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Numpad1','Numpad2','Space','Enter','Escape','KeyP','KeyR','KeyM']);
window.addEventListener('keydown',e=>{
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(!keys[e.code]&&!e.repeat){onPress(e.code);tapped[e.code]=true;}
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{if(GAMEKEYS.has(e.code))e.preventDefault();keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const CTRL=[
 {l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],atk:['KeyF'],sp:['KeyG']},
 {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],atk:['KeyK','Numpad1'],sp:['KeyL','Numpad2']}
];
const anyKey=a=>a.some(k=>keys[k]);
const anyTap=a=>a.some(k=>tapped[k]);

/* ===== entrada: controle (Gamepad API, mapeamento padrão Xbox/PlayStation) =====
   1º controle = Jogador 1, 2º controle = Jogador 2. O teclado continua valendo. */
const PADKEYS=['l','r','u','uj','d','atk','sp','jb','sh','cl','cr','cu','cd','start','sel'];
const pads=[{},{}];let padCount=0;
function readPad(gp){
  const b=k=>{const x=gp.buttons[k];return !!x&&(x.pressed||x.value>.5);};
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0,cx=gp.axes[2]||0,cy=gp.axes[3]||0;
  return {gp,l:ax<-.45||b(14),r:ax>.45||b(15),u:ay<-.45||b(12),uj:ay<-.72||b(12),d:ay>.45||b(13),
    atk:b(0),sp:b(1),jb:b(2)||b(3),sh:b(4)||b(5)||b(6)||b(7),start:b(9),sel:b(8),
    cl:cx<-.6,cr:cx>.6,cu:cy<-.6,cd:cy>.6};
}
function pollPads(){
  let list=[];
  try{if(navigator.getGamepads)list=Array.from(navigator.getGamepads()).filter(p=>p&&p.connected);}catch(e){}
  if(window.Controle&&Controle.pausado)list=[];   /* a página principal está com o controle (placar) */
  padCount=list.length;
  for(let i=0;i<2;i++){
    const prev=pads[i],cur=list[i]?readPad(list[i]):{};
    pads[i]=cur;
    const ed=k=>cur[k]&&!prev[k];
    if(ed('u'))padPress(i,'up');if(ed('d'))padPress(i,'down');if(ed('l'))padPress(i,'left');if(ed('r'))padPress(i,'right');
    if(ed('atk'))padPress(i,'a');if(ed('sp'))padPress(i,'b');if(ed('start'))padPress(i,'start');if(ed('sel'))padPress(i,'select');
  }
}
/* nos menus o controle "aperta" as mesmas teclas do jogador dele */
function padPress(i,btn){
  const s=game.scene;let code=null;
  if(s==='menu')code={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',a:'Enter',start:'Enter'}[btn];
  else if(s==='select'){
    if(btn==='select'||btn==='start'&&!game.conf[0])code=btn==='select'?'Escape':null;
    const p2=game.mode===2&&i===1;
    if(!code)code=(p2?{left:'ArrowLeft',right:'ArrowRight',a:'KeyK',b:'KeyL',start:'KeyK'}:{left:'KeyA',right:'KeyD',a:'KeyF',b:'KeyG',start:'KeyF'})[btn];
  }else if(s==='play'){
    if(btn==='start')code='KeyP';
    else if(game.paused)code={a:'KeyP',b:'KeyM',select:'KeyM'}[btn];
  }else if(s==='end')code={a:'Enter',start:'Enter',b:'KeyM',select:'KeyM'}[btn];
  if(code)onPress(code);
}
function padFor(i){
  if(game.mode===1&&i===0){const a=pads[0],b=pads[1],m={gp:a.gp||b.gp};for(const k of PADKEYS)m[k]=!!(a[k]||b[k]);return m;}
  return pads[i];
}
function rumble(i,ms,strong,weak){
  const f=game.fighters[i];if(!f||f.cpu)return;
  const gp=padFor(i).gp;
  try{if(gp&&gp.vibrationActuator)gp.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak});}catch(e){}
}

const pk=[{},{}];
function humanInput(i){
  const c=CTRL[i],p=pk[i],P=padFor(i);
  const hu=anyKey(c.u)||!!P.u,hd=anyKey(c.d)||!!P.d,ha=anyKey(c.atk)||!!P.atk,hs=anyKey(c.sp)||!!P.sp;
  const huj=anyKey(c.u)||!!P.uj,hj=!!P.jb;
  const inp={l:anyKey(c.l)||anyTap(c.l)||!!P.l,r:anyKey(c.r)||anyTap(c.r)||!!P.r,u:hu||anyTap(c.u),d:hd||anyTap(c.d),
    atk:ha||anyTap(c.atk),sp:hs||anyTap(c.sp),sh:anyKey(c.d)||anyTap(c.d)||!!P.sh};
  /* analógico direito = golpe na direção */
  const cs=(P.cl&&!p.cl)||(P.cr&&!p.cr)||(P.cu&&!p.cu)||(P.cd&&!p.cd);
  inp.atkP=(inp.atk&&!p.atk)||cs;inp.spP=inp.sp&&!p.sp;inp.dP=inp.d&&!p.d;
  inp.jumpBtn=hj&&!p.jb;
  inp.jump=inp.jumpBtn||((huj||anyTap(c.u))&&!p.uj);
  if(cs){inp.u=!!P.cu;inp.d=!!P.cd;inp.l=!!P.cl;inp.r=!!P.cr;inp.sh=false;}
  pk[i]={u:hu,uj:huj,atk:ha,sp:hs,d:hd,jb:hj,cl:P.cl,cr:P.cr,cu:P.cu,cd:P.cd};
  for(const k of [...c.l,...c.r,...c.u,...c.d,...c.atk,...c.sp])tapped[k]=false;
  return inp;
}
const NOINP={l:false,r:false,u:false,d:false,atk:false,sp:false,sh:false,jump:false,atkP:false,spP:false,dP:false};

/* ===== estado global ===== */
const game={scene:'menu',mode:2,diff:2,cursor:0,sel:[0,1],conf:[false,false],selT:0,
  fighters:[],projs:[],parts:[],ghosts:[],pops:[],koFx:null,shake:0,hitstop:0,flash:0,flashCol:'#fff',count:0,t:0,frames:0,paused:false,
  over:-1,endT:0,winner:-1,score:0,posted:false,hover:-1,btns:[],rnd:0};
const cam={x:480,y:300,z:1.2};game.cam=cam;
const DIFFN=['Fácil','Médio','Difícil'];
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-(1-t)*(1-t);

function mkFighter(i,ci){
  return {i,ch:CH[ci],ci,cpu:false,x:i?600:360,y:FLOOR.y,vx:0,vy:0,face:i?-1:1,dmg:0,lives:3,state:'idle',ground:true,plat:FLOOR,jumps:2,spUsed:false,sideUsed:false,
   atk:null,hitstun:0,shield:100,invuln:0,spawnT:0,sqx:1,sqy:1,anim:0,dead:0,fast:false,spCd:0,dropT:0,stun:0,run:0,pop:0,hidden:false,
   ai:{l:false,r:false,d:false,think:10,jumpCd:0,once:null,shieldT:0,hold:0}};
}
function startMatch(){
  const f0=mkFighter(0,game.sel[0]);
  const f1=mkFighter(1,game.sel[1]);
  if(game.mode===1)f1.cpu=true;
  if(game.mode===1){try{if(parent!==window)parent.postMessage({tipo:"jogos:modo",modo:DIFFN[game.diff-1]},"*")}catch(e){}}   // contra a CPU, o placar mostra o pódio deste nível
  game.fighters=[f0,f1];game.projs=[];game.parts=[];game.ghosts=[];game.pops=[];game.koFx=null;game.shake=0;game.hitstop=0;game.flash=0;
  game.count=180;game.frames=0;game.paused=false;game.over=-1;game.endT=0;game.winner=-1;game.posted=false;game.score=0;
  pk[0]={};pk[1]={};
  game.scene='play';
  updateCam(true);
}

/* ===== fx ===== */
function spark(x,y,col,n,sp,life){
  for(let k=0;k<n;k++){const a=Math.random()*6.283,s=rand(.4,1)*sp;
    game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life||24,max:life||24,col,size:rand(2,5)});}
}
function starburst(x,y,col,big){game.parts.push({x,y,vx:0,vy:0,life:big?16:10,max:big?16:10,col,size:big?46:26,k:'star'});}
function ring(x,y,col,size,life){game.parts.push({x,y,vx:0,vy:0,life:life||16,max:life||16,col,size,k:'ring'});}
function dust(x,y,n,col,spread){
  for(let k=0;k<n;k++)game.parts.push({x:x+rand(-6,6),y:y-rand(0,4),vx:rand(-1.2,1.2)*(spread||1),vy:rand(-.9,-.2),life:22,max:22,col:col||'rgba(255,255,255,.8)',size:rand(4,7),k:'dust'});
}
function pop(x,y,txt,col){game.pops.push({x,y,txt,col,life:46});}
function pushGhost(f){
  if(game.ghosts.length>8)return;
  game.ghosts.push({x:f.x,y:f.y,face:f.face,sqx:f.sqx,sqy:f.sqy,ci:f.ci,i:f.i,s:spriteState(f),life:12,max:12});
}

/* ===== lutas ===== */
function hurt(v){return !(v.state==='dead'||v.state==='respawn'||v.invuln>0);}
function applyHit(att,vic,d,dir,px,py){
  if(!hurt(vic))return false;
  /* Kage: contra-ataque */
  const va=vic.atk;
  if(vic.state==='attack'&&va&&va.def.counter&&!va.ctr&&va.t>va.def.st&&va.t<=va.def.st+va.def.ac){
    va.ctr=true;va.t=va.def.st+va.def.ac;
    dust(vic.x,vic.y-20,6,'rgba(120,110,170,.8)');
    if(att){
      vic.x=att.x-att.face*42;vic.y=att.y;vic.face=att.face;vic.vx=0;vic.vy=0;
      applyHit(vic,att,{dmg:Math.max(8,d.dmg*1.3),kb:7,ks:.1,ang:40},vic.face,att.x,att.y-30);
    }
    pop(vic.x,vic.y-90,'CONTRA!',PAL[vic.i].main);
    game.flash=Math.max(game.flash,6);game.flashCol='#ffffff';beep(1200,.15,'triangle',.06,.5);
    return true;
  }
  if(vic.state==='shield'){
    vic.shield-=d.dmg*2.4+5;vic.vx+=dir*(1.6+d.dmg*.12);
    spark(px,py,'#9fd8ff',8,4,16);beep(200,.08,'triangle',.05);
    game.hitstop=Math.max(game.hitstop,3);
    if(vic.shield<=0){vic.state='broken';vic.stun=150;vic.vy=-8;vic.ground=false;vic.atk=null;
      spark(vic.x,vic.y-30,'#fff',24,7,30);starburst(vic.x,vic.y-30,'#9fd8ff',true);game.shake=Math.max(game.shake,10);beep(120,.4,'sawtooth',.08,.4);}
    return true;
  }
  vic.dmg+=d.dmg;vic.pop=1;
  let v=(d.kb+vic.dmg*d.ks)*100/vic.ch.weight;
  v=Math.min(v,32);
  let ang=d.ang;
  if(vic.ground&&ang<0)ang=40;
  const r=ang*Math.PI/180;
  vic.vx=Math.cos(r)*dir*v;vic.vy=-Math.sin(r)*v;
  vic.ground=false;vic.plat=null;vic.state='hit';vic.hitstun=Math.min(70,Math.floor(v*2.2)+6);vic.atk=null;vic.fast=false;vic.hidden=false;
  if(d.drag){const a=d.drag;vic.vx=a.vx+(px-vic.x)*.2;vic.vy=a.vy+(py-(vic.y-28))*.2;vic.hitstun=12;}
  vic.spUsed=false;vic.sideUsed=false;vic.jumps=Math.max(vic.jumps,1);
  vic.sqx=.7;vic.sqy=1.3;
  game.hitstop=Math.min(9,2+Math.floor(d.dmg/3));
  game.shake=Math.max(game.shake,Math.min(16,d.dmg*.8+v*.3));
  spark(px,py,'#ffe45c',10+Math.floor(d.dmg),6,22);spark(px,py,'#fff',6,3,14);starburst(px,py,'#fff3a0',d.dmg>=9);
  if(v>9)ring(px,py,'#ffffff',60,14);
  beep(150+v*8,.1,'square',.06,.5);
  rumble(vic.i,90+v*10,Math.min(1,.25+v*.04),.5);
  if(att)rumble(att.i,60,.1,.35);
  return true;
}
function hitboxRect(f,hb){
  const ox=hb[0],w=hb[2];
  const x=f.face>0?f.x+ox:f.x-ox-w;
  return {x,y:f.y+hb[1],w,h:hb[3]};
}
function buildAtk(f,kind){
  const b=Object.assign({},ATK[kind]);
  const c=f.ch;
  b.kind=kind;
  b.st=Math.max(2,Math.round(b.st*c.fm));b.en=Math.max(4,Math.round(b.en*c.fm));b.dmg=b.dmg*c.dm;
  b.hb=[b.hb[0]*c.reach,b.hb[1],b.hb[2]*c.reach,b.hb[3]];

}
function startAttack(f,inp){
  const dir=(inp.r?1:0)-(inp.l?1:0);

    if(inp.u)kind='up';else if(inp.d)kind='down';else if(dir)kind='side';else kind='jab';
    if(dir)f.face=dir;
  }else{
    if(inp.u)kind='uair';else if(inp.d)kind='dair';else if(dir){kind='fair';f.face=dir;}else kind='nair';
  }
  f.state='attack';f.atk={def:buildAtk(f,kind),t:0,hit:false,air:!f.ground,lastHit:-99};
  f.sqx=.9;f.sqy=1.08;
  beep(380+Math.random()*60,.05,'triangle',.03);
}
function startSpecial(f,inp){
  const dir=(inp.r?1:0)-(inp.l?1:0);
  const kind=inp.u?'u':inp.d?'d':dir?'s':'n';
  const d0=f.ch.sp[kind];
  if(kind==='u'){if(f.spUsed)return false;f.spUsed=true;}
  if(kind==='s'&&!f.ground){if(f.sideUsed)return false;f.sideUsed=true;}
  if(d0.proj&&d0.proj.kind==='bomb'&&game.projs.some(p=>p.kind==='bomb'&&p.own===f.i))return false;
  if(dir)f.face=dir;
  f.state='attack';f.atk={def:Object.assign({},d0),t:0,hit:false,air:!f.ground,sp:true,kind,dirx:dir,chg:0,lastHit:-99};
  f.spCd=d0.cd||30;f.fast=false;
  if(kind==='u'&&f.vy>1)f.vy=1;
  beep(kind==='u'?300:260,.15,'sawtooth',.04,kind==='u'?2.2:1.8);
  return true;
}
function spawnProj(f,pd){
  game.projs.push({kind:pd.kind,x:f.x+f.face*(pd.ox||24),y:f.y-(pd.oy||38),vx:pd.vx*f.face,vy:pd.vy||0,grav:pd.grav||0,bounce:pd.bounce||0,bn:pd.bn||0,
    own:f.i,src:f.i,pc:PAL[f.i].main,dmg:pd.dmg*f.ch.dm,kb:pd.kb,ks:pd.ks,ang:pd.ang,r:pd.r,life:pd.life,col:pd.col,wob:pd.wob,t:0,face:f.face,fuse:pd.fuse||0,boom:pd.boom||0});

function explode(p){

  }
}
/* met = a queda já acertou alguém: só o tremor visual, sem dano extra */
function quake(f,met){

  if(!met&&f.plat)for(const s of [-1,1])game.projs.push({kind:'wave',x:f.x+s*20,y:f.plat.y-12,vx:s*6.5,vy:0,grav:0,own:f.i,src:f.i,miss,pc:PAL[f.i].main,dmg:7,kb:6,ks:.07,ang:70,r:14,life:34,col:'#ffd27a',t:0,face:s,plat:f.plat});
  game.shake=Math.max(game.shake,12);dust(f.x-20,f.y,6,null,2);dust(f.x+20,f.y,6,null,2);ring(f.x,f.y-6,'#ffd27a',90,16);
  beep(70,.35,'sawtooth',.09,.5);rumble(f.i,160,.6,.3);

function reflectProjs(f){
  const cx=f.x+f.face*20,cy=f.y-34;
  for(const p of game.projs){
    if(p.own===f.i||p.kind==='wave')continue;
    if(Math.hypot(p.x-cx,p.y-cy)<40+p.r){
      p.own=f.i;p.vx=Math.max(4,Math.abs(p.vx))*f.face*1.15;if(p.vy>0)p.vy=-p.vy*.5;p.dmg*=1.25;p.life=Math.max(p.life,50);p.face=f.face;
      if(p.kind==='bomb')p.fuse=Math.max(p.fuse,30);
      spark(p.x,p.y,'#e9d8ff',12,5,18);beep(900,.08,'triangle',.05,1.5);
    }
  }
}

function respawn(f){
  f.state='respawn';f.spawnT=240;f.x=480;f.y=RESP_Y;f.vx=f.vy=0;f.dmg=0;f.invuln=330;f.shield=100;f.jumps=2;f.spUsed=false;f.sideUsed=false;f.atk=null;f.fast=false;f.face=f.i?-1:1;f.hidden=false;

function ko(f){
  f.lives--;
  const px=clamp(f.x,10,W-10),py=clamp(f.y,10,H-10);
  spark(px,py,PAL[f.i].main,40,12,40);spark(px,py,'#fff',20,9,34);starburst(px,py,'#fff',true);
  game.koFx={x:f.x,y:f.y-30,col:PAL[f.i].main,t:0,life:50};
  game.flash=18;game.flashCol='#ffffff';game.shake=22;game.hitstop=8;
  beep(90,.6,'sawtooth',.1,.3);rumble(f.i,450,1,1);rumble(1-f.i,200,.3,.6);

  if(f.lives<=0&&game.over<0){game.over=f.i;game.endT=110;game.winner=1-f.i;}

function updateAttack(f,o,inp,dir){
  const a=f.atk,d=a.def;a.t++;
  if(f.ground)f.vx*=d.dash?.97:.84;else f.vx*=.985;
  if(f.ground&&a.air&&!a.landed&&!a.sp){a.landed=true;a.t=Math.max(a.t,d.st+d.ac+d.en-7);}
  /* Sir Pedro: segurar o especial carrega o golpe */
  if(d.charge&&!a.rel&&a.t===d.st){
    if(inp.sp&&a.chg<d.charge){
      a.chg++;a.t--;f.vx*=.8;
      if(a.chg%5===0){const an=Math.random()*6.283;game.parts.push({x:f.x+Math.cos(an)*50,y:f.y-60+Math.sin(an)*50,vx:-Math.cos(an)*3,vy:-Math.sin(an)*3,life:14,max:14,col:'#ffe45c',size:3});}
      if(a.chg===d.charge){starburst(f.x-f.face*10,f.y-80,'#ffe45c',false);beep(880,.12,'square',.05);}
    }else{a.rel=true;const k=a.chg/d.charge;d.dmg*=1+k*1.3;d.kb*=1+k*.45;if(k>.5)game.shake=Math.max(game.shake,4);}
  }
  /* Sir Pedro: terremoto */
  if(d.slam){
    if(a.falling){
      if(f.ground){a.falling=false;const met=a.hit;a.hit=true;quake(f,met);a.t=d.st+d.ac+1;}
      else{f.vy=14;f.fast=true;f.vx*=.9;a.fallT++;
        if(a.fallT>55){a.falling=false;a.t=d.st+d.ac+1;}else if(a.t>d.st+d.ac)a.t=d.st+d.ac;
        if(game.frames%2===0)game.parts.push({x:f.x+rand(-14,14),y:f.y-70,vx:0,vy:-6,life:8,max:8,col:'#fff',size:22,k:'line'});}
    }else if(a.t===d.st+1){
      if(f.ground){a.hit=true;quake(f);}else{a.falling=true;a.fallT=0;f.vy=14;}
    }
  }
  if(d.proj&&a.t===d.st){spawnProj(f,d.proj);beep(d.proj.kind==='fist'?220:520,.12,'square',.04,.6);}
  if(d.teleport&&a.t<=d.st){f.vy*=.5;f.vx*=.85;}
  const act=a.t>d.st&&a.t<=d.st+d.ac;
  if(act){
    if(d.dash){f.vx=f.face*d.dash;if(d.nograv)f.vy=0;if(f.ground&&game.frames%3===0)dust(f.x-f.face*10,f.y,1);}
    if(d.dy!=null){f.vy=d.dy;f.vx=clamp(f.vx+dir*(d.steer||0),-(d.maxDx||3),d.maxDx||3);}
    if(d.teleport){
      if(a.t===d.st+1){
        let vx=a.dirx*.7,vy=-1;const m=Math.hypot(vx,vy);
        a.tvx=vx/m*d.teleport/d.ac;a.tvy=vy/m*d.teleport/d.ac;
        f.hidden=true;f.invuln=Math.max(f.invuln,d.ac+3);
        spark(f.x,f.y-30,'#e08bff',16,5,20);spark(f.x,f.y-30,'#fff',8,3,14);beep(1100,.12,'sine',.05,.4);
      }
      f.vx=a.tvx;f.vy=a.tvy;
      if(a.t===d.st+d.ac){
        f.hidden=false;f.vx*=.25;f.vy=Math.min(f.vy*.25,-1);
        spark(f.x,f.y-30,'#e08bff',18,6,22);ring(f.x,f.y-30,'#e9d8ff',70,14);beep(700,.12,'sine',.05,2);
        if(hurt(o)&&Math.hypot(o.x-f.x,o.y-f.y)<56)applyHit(f,o,{dmg:6,kb:6,ks:.06,ang:70},o.x>=f.x?1:-1,o.x,o.y-30);
      }
    }
    if(d.reflect)reflectProjs(f);
    if(d.jet)for(let k=0;k<2;k++)game.parts.push({x:f.x+rand(-7,7),y:f.y+2,vx:rand(-.6,.6),vy:rand(2.5,5),life:14,max:14,col:'#ffb347',size:rand(4,7),k:'flame'});
    if(d.ghost&&game.frames%2===0)pushGhost(f);
    if(d.hb&&hurt(o)&&!f.hidden){
      const can=d.multi?(a.t-a.lastHit>=d.multi):!a.hit;
      if(can){
        const r=hitboxRect(f,d.hb);
        if(r.x<o.x+14&&r.x+r.w>o.x-14&&r.y<o.y&&r.y+r.h>o.y-56){
          a.hit=true;a.lastHit=a.t;
          const fin=!d.multi||a.t>d.st+d.ac-d.multi;
          applyHit(f,o,fin?d:{dmg:d.mdmg,kb:d.mkb,ks:0,ang:d.mang,drag:f},f.face,r.x+r.w/2,r.y+r.h/2);
        }
      }
    }
    if(a.t===d.st+d.ac&&d.endVy!=null&&!f.ground)f.vy=d.endVy;
  }
  if(a.t>d.st+d.ac+d.en){f.state='idle';f.atk=null;f.hidden=false;}
}

function updateFighter(f,o,inp){
  if(f.pop>0)f.pop=Math.max(0,f.pop-.06);
  if(f.state==='dead'){f.dead--;if(f.dead<=0&&f.lives>0)respawn(f);return;}
  if(f.invuln>0)f.invuln--;
  if(f.spCd>0)f.spCd--;
  const c=f.ch;
  if(f.state==='respawn'){
    f.x=480;f.y=RESP_Y;f.vx=f.vy=0;f.spawnT--;
    f.sqx+=(1-f.sqx)*.2;f.sqy+=(1-f.sqy)*.2;f.anim++;
    if((f.spawnT<200&&(inp.l||inp.r||inp.atkP||inp.spP||inp.jump||inp.d))||f.spawnT<=0){
      f.state='idle';f.ground=false;f.plat=null;f.jumps=2;f.dropT=0;
    }
    return;
  }
  const dir=(inp.r?1:0)-(inp.l?1:0);
  const wasGround=f.ground;
  if(f.dropT>0)f.dropT--;
  if(f.state==='hit'){
    f.hitstun--;f.vx*=.975;f.vx+=dir*.12;
    const spd=Math.hypot(f.vx,f.vy);
    if(spd>7&&game.frames%2===0)dust(f.x,f.y-28,1,'rgba(225,225,240,.85)');
    if(spd>12&&game.frames%2===0)game.parts.push({x:f.x,y:f.y-28,vx:f.vx*.25,vy:f.vy*.25,life:10,max:10,col:PAL[f.i].light,size:spd*2.2,k:'line'});
    if(f.hitstun<=0)f.state='idle';
  }else if(f.state==='broken'){
    f.stun--;f.vx*=.85;if(f.stun<=0){f.state='idle';f.shield=50;}
  }else if(f.state==='attack'){
    updateAttack(f,o,inp,dir);
  }else{
    /* parado / escudo */
    /* a recuperação (↑ especial no ar) não espera o tempo de recarga */
    const wantSp=inp.spP&&(f.spCd<=0||inp.u&&!f.ground),wantAct=inp.atkP||wantSp;
    let shielding=false;
    if(f.ground&&!wantAct){
      if(inp.dP&&f.plat&&!f.plat.solid){f.dropT=16;f.ground=false;f.plat=null;f.y+=2;f.state='idle';}
      else if(inp.sh)shielding=true;
    }
    if(shielding&&f.state!=='shield')f.state='shield';
    if(!shielding&&f.state==='shield')f.state='idle';
    if(f.state==='shield'){
      f.vx*=.7;f.shield-=.34;
      if(f.shield<=0){f.state='broken';f.stun=150;f.vy=-7;f.ground=false;
        spark(f.x,f.y-30,'#fff',24,7,30);starburst(f.x,f.y-30,'#9fd8ff',true);game.shake=10;beep(120,.4,'sawtooth',.08,.4);}
    }
    if(f.state==='idle'){
      const acc=f.ground?.85:.38;
      const tgt=dir*c.speed;
      if(dir){
        if(f.ground&&Math.sign(f.vx)===-dir&&Math.abs(f.vx)>2.5&&game.frames%3===0)dust(f.x,f.y,1);
        f.vx+=clamp(tgt-f.vx,-acc,acc);f.face=dir;
      }
      else if(f.ground)f.vx*=.76;
      else f.vx*=.99;
      if(inp.jump&&(!wantAct||inp.jumpBtn)){
        if(f.ground){f.vy=c.jump;f.ground=false;f.plat=null;f.jumps=1;f.sqx=.75;f.sqy=1.3;dust(f.x,f.y,4);beep(420,.08,'triangle',.04,1.5);}
        else if(f.jumps>0){f.vy=c.dj;f.jumps--;f.fast=false;f.sqx=.75;f.sqy=1.3;ring(f.x,f.y-4,'#ffffff',34,12);beep(520,.08,'triangle',.04,1.5);}
      }
      if(!f.ground&&inp.d&&f.vy>0)f.fast=true;
      if(inp.atkP)startAttack(f,inp);
      else if(wantSp)startSpecial(f,inp);
    }
  }
  if(f.state!=='shield'&&f.shield<100&&f.state!=='broken')f.shield=Math.min(100,f.shield+.22);
  physics(f,wasGround);
  f.sqx+=(1-f.sqx)*.2;f.sqy+=(1-f.sqy)*.2;
  f.run=f.ground&&Math.abs(f.vx)>.6?Math.min(1,Math.abs(f.vx)/3):0;
  if(f.ground&&Math.abs(f.vx)>3.2&&f.state==='idle'&&game.frames%10===0)dust(f.x-Math.sign(f.vx)*8,f.y,1);
  f.anim+=1+Math.abs(f.vx)*.15;
  /* zonas de explosão */
  if(f.x<BLAST.l||f.x>BLAST.r||f.y<BLAST.t||f.y>BLAST.b)ko(f);
}
function physics(f,wasGround){
  const c=f.ch;
  const nog=f.state==='attack'&&f.atk.def.nograv&&f.atk.t>f.atk.def.st&&f.atk.t<=f.atk.def.st+f.atk.def.ac;
  if(!nog){
    f.vy+=c.grav;
    const mf=f.fast?16:c.maxFall;
    if(f.state==='hit'){if(f.vy>20)f.vy=20;}else if(f.vy>mf)f.vy=mf;
  }
  const px=f.x;
  f.x+=f.vx;
  if(f.y>FLOOR.y+2&&f.y-56<BODY_BOT&&f.x+14>FLOOR.x1&&f.x-14<FLOOR.x2){
    const L=px<480;
    /* bateu na quina logo abaixo da borda: agarra e sobe no palco */
    if(canGrab(f))ledgeGrab(f,L);
    else{f.x=L?FLOOR.x1-14:FLOOR.x2+14;f.vx=f.state==='hit'?-f.vx*.4:0;}
  }
  const py=f.y;
  f.y+=f.vy;
  f.ground=false;f.plat=null;
  if(f.vy>=0){
    for(const pl of PLATS){
      if(!pl.solid&&f.dropT>0)continue;
      if(py<=pl.y+.01&&f.y>=pl.y&&f.x+10>pl.x1&&f.x-10<pl.x2){
        f.y=pl.y;
        if(f.vy>6){f.sqx=1.3;f.sqy=.7;dust(f.x,f.y,5,null,1.6);}
        if(f.state==='hit'&&f.vy>9){f.vy=-f.vy*.45;if(f.hitstun<6)f.hitstun=6;f.y-=1;break;}
        f.vy=0;f.ground=true;f.plat=pl;f.jumps=2;f.spUsed=false;f.sideUsed=false;f.fast=false;
        break;
      }
    }
  }else if(f.x+14>FLOOR.x1&&f.x-14<FLOOR.x2&&py-56>=BODY_BOT&&f.y-56<BODY_BOT){
    f.y=BODY_BOT+56;f.vy=0;
  }
  /* voltando para o palco (já gastou o pulo duplo ou o ↑ especial) e caindo rente à borda: agarra também */
  if(!f.ground&&f.vy>=0&&!f.fast&&(f.jumps===0||f.spUsed)&&canGrab(f)&&f.y>FLOOR.y){
    if(f.x>FLOOR.x1-26&&f.x<FLOOR.x1)ledgeGrab(f,true);
    else if(f.x<FLOOR.x2+26&&f.x>FLOOR.x2)ledgeGrab(f,false);
  }
  if(wasGround&&!f.ground&&f.vy>=0&&f.jumps>1)f.jumps=1;
}
function canGrab(f){return f.state!=='hit'&&f.state!=='broken'&&!f.hidden&&f.y<=FLOOR.y+34;}
function ledgeGrab(f,L){
  f.x=L?FLOOR.x1+12:FLOOR.x2-12;f.y=FLOOR.y;f.vx=0;f.vy=0;
  f.ground=true;f.plat=FLOOR;f.jumps=2;f.spUsed=false;f.sideUsed=false;f.fast=false;
  if(f.state==='attack'){f.state='idle';f.atk=null;}
  f.sqx=.8;f.sqy=1.2;dust(f.x,f.y,4);beep(480,.06,'triangle',.04,1.4);
}
function updateProjs(){
  for(const p of game.projs){
    p.t++;p.life--;
    if(p.kind==='wave'){
      p.x+=p.vx;p.y=p.plat.y-12;
      if(p.x<p.plat.x1-6||p.x>p.plat.x2+6)p.life=0;
      if(p.t%2===0)dust(p.x,p.plat.y,1,'rgba(255,230,170,.7)');
    }else{
      p.vy+=p.grav;p.x+=p.vx;p.y+=p.vy;if(p.wob)p.y+=Math.sin(p.t*.2)*1.6;
      if(p.grav&&p.vy>0){
        for(const pl of PLATS){
          if(p.y+p.r>=pl.y&&p.y+p.r-p.vy<=pl.y+1&&p.x>pl.x1&&p.x<pl.x2){
            p.y=pl.y-p.r;
            if(p.kind==='bomb'){p.vy=-p.vy*.45;p.vx*=.7;if(Math.abs(p.vy)<1.5)p.vy=0;}
            else{p.vy=-Math.max(5,p.vy*p.bounce);p.bn--;spark(p.x,p.y+p.r,p.col,6,3,12);if(p.bn<0)p.life=0;}
            break;
          }
        }
      }
    }
    if(p.kind==='bomb'){p.fuse--;if(p.t%3===0)game.parts.push({x:p.x+4,y:p.y-12,vx:rand(-1,1),vy:rand(-2,-.5),life:8,max:8,col:'#ffe45c',size:2});if(p.fuse<=0){explode(p);continue;}}
    else if(p.kind!=='wave'&&p.t%3===0)game.parts.push({x:p.x,y:p.y,vx:rand(-.3,.3),vy:rand(-.3,.3),life:12,max:12,col:p.kind==='fist'?'#ffb347':p.col,size:p.r*.6});
    for(const o of game.fighters){
      if(o.i===p.own||o.i===p.miss||p.life<=0)continue;
      if(hurt(o)||o.state==='shield'){
        if(p.x+p.r>o.x-14&&p.x-p.r<o.x+14&&p.y+p.r>o.y-56&&p.y-p.r<o.y){
          if(p.kind==='bomb'){explode(p);break;}
          applyHit(null,o,p,p.vx>=0?1:-1,p.x,p.y);p.life=0;
        }
      }
    }
    if(p.x>FLOOR.x1&&p.x<FLOOR.x2&&p.y>FLOOR.y&&p.y<BODY_BOT){if(p.kind==='bomb'&&p.life>0)explode(p);else p.life=0;}
    if(p.x<-200||p.x>W+200||p.y>H+200)p.life=0;
  }
  game.projs=game.projs.filter(p=>p.life>0);
}

/* ===== IA ===== */
function aiPickSpecial(f,o,adx,dy,D){
  const S=f.ch.sp,r=Math.random();
  if(S.d.counter&&o.state==='attack'&&adx<90&&Math.abs(dy)<60&&r<[.15,.4,.7][D-1])return 'd';
  if(S.d.reflect)for(const p of game.projs)if(p.own!==f.i&&p.kind!=='wave'&&Math.abs(p.x-f.x)<130&&Math.abs(p.y-(f.y-35))<55&&Math.sign(f.x-p.x)===Math.sign(p.vx))return 'd';
  if(Math.abs(dy)>70)return null;
  const opts=[];
  if(S.n.proj&&adx>110)opts.push('n');
  if(S.s.proj&&adx>110&&adx<420)opts.push('s');
  /* investida só se terminar em cima do palco */
  const ex=f.x+Math.sign(o.x-f.x)*(S.s.dash||0)*(S.s.ac||0)*1.2;
  if(S.s.dash&&adx>50&&adx<170&&ex>FLOOR.x1+20&&ex<FLOOR.x2-20)opts.push('s');
  if(S.n.charge&&adx>40&&adx<120&&f.ground)opts.push('n');
  if(S.d.slam&&adx<70&&f.ground)opts.push('d');
  if(S.d.proj&&adx>60&&adx<220)opts.push('d');
  if(S.d.reflect&&adx<55)opts.push('d');
  if(S.u.hb&&adx<55&&dy<-20&&f.ground)opts.push('u');
  return opts.length?opts[Math.floor(Math.random()*opts.length)]:null;
}
function aiInput(f,o){
  const D=game.diff;
  const ai=f.ai;
  const inp={l:ai.l,r:ai.r,u:false,d:false,sh:ai.d&&f.ground,atk:false,sp:false,jump:false,atkP:false,spP:false,dP:false};
  if(ai.jumpCd>0)ai.jumpCd--;
  if(ai.hold>0){ai.hold--;inp.sp=true;}
  if(f.state==='dead'||f.state==='respawn'){
    if(f.state==='respawn'&&f.spawnT<200-(D===1?80:20)){inp.r=true;}
    return inp;
  }
  if(f.state==='hit'){inp.l=f.x>480;inp.r=f.x<=480;return inp;}
  /* recuperar */
  const outside=f.x<FLOOR.x1-8||f.x>FLOOR.x2+8;
  if(!f.ground&&(outside||f.y>FLOOR.y+10)&&f.state!=='broken'){
    ai.hold=0;inp.sp=false;
    const left=f.x<480,edge=left?FLOOR.x1:FLOOR.x2,out=left?-1:1;
    /* abaixo da borda: mira do lado de fora da quina (não entra embaixo do palco); acima: volta para o palco */
    const below=f.y>FLOOR.y+24;
    const under=below&&f.x>FLOOR.x1-16&&f.x<FLOOR.x2+16;
    const tx=below?edge+out*30:edge-out*60;
    const dir=f.state==='attack'&&f.atk.sp?-out:Math.abs(tx-f.x)<8?0:Math.sign(tx-f.x);
    inp.l=dir<0;inp.r=dir>0;inp.sh=false;
    const far=Math.abs(f.x-edge)>170;
    /* longe: pula logo para ganhar distância; perto: espera cair até a altura da borda */
    if((f.y>FLOOR.y-60||far&&f.vy>1.5&&f.jumps>0)&&!under&&(D>1||Math.random()<.6)){
      if(f.jumps>0&&f.vy>-1&&ai.jumpCd<=0){inp.jump=true;ai.jumpCd=14;}
      else if(f.jumps===0&&far&&!f.sideUsed&&f.ch.sp.s.nograv&&f.spCd<=0&&f.y<FLOOR.y+60){inp.sp=true;inp.spP=true;inp.l=out>0;inp.r=out<0;}
      else if(f.jumps===0&&!f.spUsed&&f.vy>-2&&f.y>(far?FLOOR.y+20:FLOOR.y-40)){inp.u=true;inp.sp=true;inp.spP=true;inp.l=out>0;inp.r=out<0;}
    }
    return inp;
  }
  ai.think--;
  if(ai.shieldT>0){ai.shieldT--;inp.sh=f.ground;if(ai.shieldT===0)ai.d=false;}
  if(ai.think<=0){
    ai.think=[24,13,6][D-1]+Math.floor(rand(0,6));
    const dx=o.x-f.x,dy=o.y-f.y,adx=Math.abs(dx);
    const oOut=o.state==='dead'||o.state==='respawn';
    ai.l=false;ai.r=false;
    if(oOut||adx>(f.ch.reach*46)){
      const tx=oOut?480:o.x;
      if(Math.abs(tx-f.x)>20){ai.l=tx<f.x;ai.r=tx>f.x;}
    }
    if(D===1&&Math.random()<.2){ai.l=false;ai.r=false;}
    if(!oOut){
      if(dy<-70&&Math.random()<[.3,.5,.8][D-1]){
        if(f.ground){inp.jump=true;}
        else if(f.jumps>0&&f.vy>-2)inp.jump=true;
      }
      if(f.ground&&f.plat&&!f.plat.solid&&dy>60&&Math.random()<.5){inp.dP=true;inp.d=true;}
      if(f.ground&&o.state==='attack'&&adx<95&&Math.random()<[.1,.45,.85][D-1]&&f.state!=='attack'&&!f.ch.sp.d.counter){ai.shieldT=14+Math.floor(rand(0,10));ai.d=true;}
      if(adx<64+f.ch.reach*8&&Math.abs(dy)<65&&f.state==='idle'&&ai.shieldT<=0&&Math.random()<[.3,.6,.9][D-1]){
        f.face=dx>=0?1:-1;
        inp.atkP=true;
        const r=Math.random();
        if(dy<-40){inp.u=true;}
        else if(f.ground){
          if(r<.35){}else if(r<.8){inp.l=dx<0;inp.r=dx>0;}else if(D>1)inp.d=true;
        }else{ if(r<.3){}else if(r<.8){inp.l=dx<0;inp.r=dx>0;} else if(dy>20)inp.d=true; }
        ai.l=false;ai.r=false;
        if(inp.d){ai.shieldT=0;}
      }else if(f.spCd<=0&&f.state==='idle'&&Math.random()<[.12,.28,.45][D-1]){
        const pick=aiPickSpecial(f,o,adx,dy,D);
        if(pick){
          f.face=dx>=0?1:-1;inp.spP=true;inp.sp=true;inp.l=false;inp.r=false;inp.u=false;inp.d=false;inp.sh=false;inp.atkP=false;
          if(pick==='s'){inp.l=dx<0;inp.r=dx>0;}else if(pick==='u')inp.u=true;else if(pick==='d')inp.d=true;
          if(pick==='n'&&f.ch.sp.n.charge)ai.hold=Math.floor(D===1?rand(0,20):rand(10,50));
          ai.l=false;ai.r=false;
        }
      }
    }
  }else{
    inp.l=ai.l&&!ai.d;inp.r=ai.r&&!ai.d;
  }
  /* nao cair da borda */
  if(f.ground&&f.plat&&f.plat.solid&&D>1&&f.state==='idle'){
    if(f.x<FLOOR.x1+14+Math.abs(f.vx)*4&&inp.l){inp.l=false;ai.l=false;}
    if(f.x>FLOOR.x2-14-Math.abs(f.vx)*4&&inp.r){inp.r=false;ai.r=false;}
  }
  return inp;
}

/* ===== câmera (aproxima e acompanha os lutadores) ===== */
function camTarget(){
  let x0=480,x1=480,y0=330,y1=330;
  for(const f of game.fighters){
    if(f.state==='dead')continue;
    const x=clamp(f.x,BLAST.l+80,BLAST.r-80),y=clamp(f.y-30,BLAST.t+100,BLAST.b-80);
    x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
  }
  x0-=190;x1+=190;y0-=150;y1+=120;
  const z=clamp(Math.min(W/(x1-x0),H/(y1-y0)),.7,1.38);
  return {x:(x0+x1)/2,y:(y0+y1)/2,z};
}
function updateCam(snap){
  const t=camTarget(),k=snap?1:.09,kz=snap?1:.06;
  cam.x+=(t.x-cam.x)*k;cam.y+=(t.y-cam.y)*k;cam.z+=(t.z-cam.z)*kz;
}
const toScreen=(x,y)=>[(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2];

/* ===== atualizacao ===== */
function simulate(){
  const F=game.fighters;
  updateCam(false);
  if(game.count>0){
    game.count--;
    if(game.count===0)beep(660,.3,'square',.06);
    else if(game.count%60===0)beep(330,.12,'square',.05);
    for(const f of F){f.anim++;}
    humanInput(0);humanInput(1);
    return;
  }
  game.frames++;
  const inputs=[];
  for(let i=0;i<2;i++){
    inputs[i]=(F[i].cpu)?aiInput(F[i],F[1-i]):humanInput(i);
    if(game.over>=0)inputs[i]=NOINP;
  }
  if(game.hitstop>0){game.hitstop--;}
  else{
    for(let i=0;i<2;i++)updateFighter(F[i],F[1-i],inputs[i]);
    updateProjs();
  }
  /* particulas */
  for(const p of game.parts){p.t=(p.t||0)+1;p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life--;}
  game.parts=game.parts.filter(p=>p.life>0);
  for(const gh of game.ghosts)gh.life--;
  game.ghosts=game.ghosts.filter(gh=>gh.life>0);
  for(const p of game.pops)p.life--;
  game.pops=game.pops.filter(p=>p.life>0);
  if(game.koFx&&++game.koFx.t>game.koFx.life)game.koFx=null;
  if(game.over>=0){
    game.endT--;
    if(game.endT<=0)finishMatch();
  }
}
function finishMatch(){
  game.scene='end';game.hover=-1;
  const w=game.winner;
  if(game.mode===1&&w===0&&!game.posted){
    const secs=Math.floor(game.frames/60);
    let pts=1000*game.diff+500*game.fighters[0].lives+Math.max(0,300-secs);
    pts=Math.max(1,Math.min(50000,Math.round(pts)));
    game.score=pts;game.posted=true;
    try{if(parent!==window)parent.postMessage({tipo:"jogos:fim",pontos:pts,nivel:DIFFN[game.diff-1],modo:DIFFN[game.diff-1]},"*");}catch(e){}
  }
}

/* ===== menus: acoes ===== */
function goMenu(){game.scene='menu';game.hover=-1;}
function goSelect(mode){game.mode=mode;game.scene='select';game.conf=[false,mode===1];game.sel=[0,mode===1?Math.floor(Math.random()*4):1];game.selT=0;game.hover=-1;}
function onPress(code){
  beepInit();
  const s=game.scene;
  if(s==='menu'){
    if(code==='ArrowUp'||code==='KeyW')game.cursor=(game.cursor+2)%3;
    else if(code==='ArrowDown'||code==='KeyS')game.cursor=(game.cursor+1)%3;
    else if(code==='ArrowLeft'||code==='KeyA')game.diff=Math.max(1,game.diff-1);
    else if(code==='ArrowRight'||code==='KeyD')game.diff=Math.min(3,game.diff+1);
    else if(code==='Enter'||code==='Space'||code==='KeyF'||code==='KeyK'||code==='Numpad1'){
      if(game.cursor===0)goSelect(2);else if(game.cursor===1)goSelect(1);else game.diff=game.diff%3+1;
    }
  }else if(s==='select'){
    if(code==='Escape'){goMenu();return;}
    const mv=(i,d)=>{if(!game.conf[i]){game.sel[i]=(game.sel[i]+d+4)%4;beep(500,.04,'square',.03);}};
    if(code==='KeyA')mv(0,-1);else if(code==='KeyD')mv(0,1);
    else if(code==='KeyF'||(game.mode===1&&(code==='Enter'||code==='Space'))){game.conf[0]=true;beep(700,.08,'square',.04);}
    else if(code==='KeyG')game.conf[0]=false;
    if(game.mode===2){
      if(code==='ArrowLeft')mv(1,-1);else if(code==='ArrowRight')mv(1,1);
      else if(code==='KeyK'||code==='Numpad1'){game.conf[1]=true;beep(700,.08,'square',.04);}
      else if(code==='KeyL'||code==='Numpad2')game.conf[1]=false;
    }else{
      if(code==='ArrowLeft')mv(0,-1);else if(code==='ArrowRight')mv(0,1);
    }
    if(game.conf[0]&&game.conf[1])startMatch();
  }else if(s==='play'){
    if(code==='Escape'||code==='KeyP')game.paused=!game.paused;
    else if(game.paused&&code==='KeyM'){goMenu();}
  }else if(s==='end'){
    if(code==='Enter'||code==='KeyR'||code==='Space'){startMatch();}
    else if(code==='KeyM'||code==='Escape'){goMenu();}
  }
}
function beepInit(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}

/* mouse */
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function btnAt(p){for(let i=0;i<game.btns.length;i++){const b=game.btns[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return i;}return -1;}
cv.addEventListener('mousemove',e=>{const i=btnAt(toLogical(e));game.hover=i;cv.style.cursor=i>=0?'pointer':'default';});
cv.addEventListener('click',e=>{
  beepInit();
  const i=btnAt(toLogical(e));if(i<0)return;
  const b=game.btns[i];
  if(b.act==='mode2')goSelect(2);
  else if(b.act==='mode1')goSelect(1);
  else if(b.act==='diff')game.diff=b.v;
  else if(b.act==='card'){
    const who=game.mode===1?0:(!game.conf[0]?0:1);
    if(!game.conf[who]){game.sel[who]=b.v;}
  }
  else if(b.act==='ok'){const who=game.mode===1?0:(!game.conf[0]?0:1);game.conf[who]=true;if(game.conf[0]&&game.conf[1])startMatch();}
  else if(b.act==='back')goMenu();
  else if(b.act==='rematch')startMatch();
  else if(b.act==='menu')goMenu();
  else if(b.act==='resume')game.paused=false;
});

/* ===== desenho ===== */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function text(s,x,y,size,col,align,font,stroke){
  g.font=size+'px '+(font||FONT_D);g.textAlign=align||'left';g.textBaseline='middle';
  if(stroke){g.lineWidth=stroke.w;g.strokeStyle=stroke.c;g.lineJoin='round';g.strokeText(s,x,y);}
  g.fillStyle=col;g.fillText(s,x,y);
}
function button(x,y,w,h,label,act,v,opts){
  opts=opts||{};
  const idx=game.btns.length;
  game.btns.push({x,y,w,h,act,v});
  const hov=game.hover===idx||opts.focus;
  g.save();
  g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=12;g.shadowOffsetY=4;
  rr(x,y,w,h,14);
  g.fillStyle=opts.sel?'#ffd23f':hov?'#ff8a3d':(opts.col||'#2b3a8c');g.fill();
  g.restore();
  rr(x,y,w,h,14);g.lineWidth=3;g.strokeStyle=hov||opts.sel?'#fff':'rgba(255,255,255,.35)';g.stroke();
  text(label,x+w/2,y+h/2+2,opts.size||26,opts.sel?'#3a2200':'#fff','center');
}

  for(let i=0;i<10;i++){g.rotate(.628);g.beginPath();g.moveTo(0,0);g.lineTo(700,-46);g.lineTo(700,46);g.fill();}

  g.lineTo(X1,Y1);g.fill();

  for(const [x,hh,ww] of [[-150,120,40],[90,150,46],[150,95,34],[820,170,50],[880,110,36],[300,70,26],[640,85,30],[1050,140,44]]){g.fillRect(x,400-hh,ww,hh+200);g.beginPath();g.moveTo(x-6,400-hh);g.lineTo(x+ww/2,400-hh-26);g.lineTo(x+ww+6,400-hh);g.fill();}
  g.fillStyle='rgba(255,220,140,.55)';for(const [x,y] of [[104,280],[118,300],[836,262],[850,300],[656,340],[-136,310]])g.fillRect(x,y,6,9);
  g.fillStyle='#3d2a73';g.beginPath();g.moveTo(X0,Y1);

  g.lineTo(X1,Y1);g.fill();
  /* brasas subindo */

  for(let i=0;i<26;i++){const x=X0+((i*137+t*(.3+i%3*.15))%(X1-X0)),y=Y1-((i*211+t*(.6+i%4*.2))%(Y1-80));g.globalAlpha=.25+.35*Math.sin(t*.05+i);g.fillRect(x,y,3,3);}

function drawStage(){

/* Camada de personagem: desenha numa tela à parte, sombreia e contorna a silhueta (visual de desenho animado).
   sil=true desenha só a silhueta tingida (rastro de velocidade). */
const OC=document.createElement('canvas'),og=OC.getContext('2d'),TC=document.createElement('canvas'),tg=TC.getContext('2d');
function outlined(fn,ink,sil){
  const M=G0.getTransform(),S=Math.hypot(M.a,M.b)||1,LW=260,LH=230,OX=130,OY=170;
  const w=Math.ceil(LW*S),h=Math.ceil(LH*S);
  if(OC.width<w||OC.height<h){OC.width=TC.width=Math.max(OC.width,w);OC.height=TC.height=Math.max(OC.height,h);}
  og.setTransform(1,0,0,1,0,0);og.clearRect(0,0,w,h);
  og.setTransform(M.a,M.b,M.c,M.d,OX*S,OY*S);
  g=og;try{fn();}finally{g=G0;}
  og.setTransform(1,0,0,1,0,0);
  if(!sil){
    /* luz de cima, sombra embaixo */
    og.globalCompositeOperation='source-atop';
    const gr=og.createLinearGradient(0,(OY-95)*S,0,OY*S);
    gr.addColorStop(0,'rgba(255,255,255,.22)');gr.addColorStop(.45,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(20,10,40,.32)');
    og.fillStyle=gr;og.fillRect(0,0,w,h);og.globalCompositeOperation='source-over';
  }
  /* silhueta tingida para o contorno */
  tg.setTransform(1,0,0,1,0,0);tg.clearRect(0,0,w,h);tg.drawImage(OC,0,0,w,h,0,0,w,h);
  tg.globalCompositeOperation='source-in';tg.fillStyle=ink||'#1a1030';tg.fillRect(0,0,w,h);tg.globalCompositeOperation='source-over';
  const x0=M.e-OX*S,y0=M.f-OY*S,r=2.6*S;
  G0.save();G0.setTransform(1,0,0,1,0,0);
  if(sil)G0.drawImage(TC,0,0,w,h,x0,y0,w,h);
  else{
    for(let k=0;k<8;k++){const a=k*Math.PI/4;G0.drawImage(TC,0,0,w,h,x0+Math.cos(a)*r,y0+Math.sin(a)*r,w,h);}
    G0.drawImage(OC,0,0,w,h,x0,y0,w,h);
  }
  G0.restore();
}

/* ----- partes do corpo ----- */
function legs(col,sw,w,h){
  for(let k=0;k<2;k++){
    g.save();g.translate(k?6:-6,-17);g.rotate((k?-1:1)*sw);g.fillStyle=col;rr(-w/2,0,w,h,w/2);g.fill();
    g.fillStyle='rgba(0,0,0,.25)';rr(-w/2-1,h-5,w+3,5,2.5);g.fill();g.restore();
  }
}
function arm(x,y,ang,len,w,col){
  const hx=x+Math.cos(ang)*len,hy=y+Math.sin(ang)*len;
  g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(hx,hy);g.stroke();
  return [hx,hy];
}
function dot(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();}
/* olhos com expressão: hit = X, happy = ^, atk = sobrancelha brava, blink = linha */
function eyes(xs,y,w,h,col,s,kind){
  g.lineCap='round';
  for(let k=0;k<xs.length;k++){
    const x=xs[k];
    g.fillStyle=col;g.strokeStyle=col;
    if(s.mood==='hit'){g.lineWidth=1.9;g.beginPath();g.moveTo(x-w*.6,y-h*.4);g.lineTo(x+w*.6,y+h*.4);g.moveTo(x+w*.6,y-h*.4);g.lineTo(x-w*.6,y+h*.4);g.stroke();}
    else if(s.mood==='happy'){g.lineWidth=1.9;g.beginPath();g.arc(x,y+h*.25,w*.6,Math.PI*1.1,Math.PI*1.9);g.stroke();}
    else if(s.blink){g.lineWidth=1.7;g.beginPath();g.moveTo(x-w*.55,y);g.lineTo(x+w*.55,y);g.stroke();}
    else{
      rr(x-w/2,y-h/2,w,h,Math.min(w,h)/2);g.fill();
      if(kind==='cat'){g.fillStyle='#111';rr(x-.4,y-h/2+1,1.9,h-2,1);g.fill();}
      if(kind!=='led'){g.fillStyle='#fff';g.fillRect(x+w*.05,y-h*.38,Math.max(1.2,w*.32),Math.max(1.2,w*.32));}
      if(s.mood==='atk'){

        g.beginPath();g.moveTo(x-inner*w*.85,y-h*.8);g.lineTo(x+inner*w*.85,y-h*.25);g.stroke();
      }
    }
  }
}

/* pose dos braços a partir do golpe atual: braço da frente (fa), de trás (ba), ângulo extra da arma (wOff) */
const RW=-1.5;
function basePose(t){return {fa:1.2+Math.sin(t*.09)*.06,ba:1.8,wOff:RW,lean:0,crouch:0,spin:0,ext:0,hideW:false,smear:null,glow:0,fx:null};}
function armPose(f){
  const s=basePose(f.anim),restFa=s.fa;
  if(f.ground&&f.run){const k=Math.sin(f.anim*.55)*f.run;s.fa=1.2+k*.9;s.ba=1.9-k*.9;s.lean=.1*f.run;}
  if(!f.ground){s.fa=f.vy<0?-.6:.5;s.ba=f.vy<0?2.5:2.1;}
  if(f.state==='hit'||f.state==='broken'){s.fa=-1.3+Math.sin(game.t*.5)*.3;s.ba=-2.1;}
  if(f.state==='shield'){s.fa=.2;s.ba=.4;s.crouch=4;}
  const a=f.atk;if(!a||f.state!=='attack')return s;
  const d=a.def,t=a.t,st=d.st,ac=d.ac,en=d.en,pose=d.pose;
  const pS=st?Math.min(1,t/st):1,inAct=t>st&&t<=st+ac,q=inAct?(t-st)/ac:0,e=t>st+ac?Math.min(1,(t-st-ac)/en):0;
  if(pose==='charge'&&t<=st){s.fa=lerp(restFa,-2.4,ease(pS));s.wOff=lerp(RW,0,pS);s.ba=-1.9;s.glow=a.chg/d.charge;s.crouch=2;return s;}
  if(d.sw&&(!pose||pose==='charge')){
    const sw=d.sw,sgn=Math.sign(sw.a1-sw.a0)||1,wind=sw.a0-(sw.a1-sw.a0)*.15;
    if(t<=st){s.fa=lerp(s.fa,wind,ease(pS));s.wOff=lerp(RW,0,pS);}
    else if(inAct){s.fa=lerp(sw.a0,sw.a1,ease(q));s.wOff=0;}
    else{s.fa=lerp(sw.a1,restFa,e*e);s.wOff=lerp(0,RW,e);}
    s.ext=t<=st?0:inAct?1:1-e;
    if(sw.sweep)s.crouch=7;
    if(t>st&&(inAct||e<.35)){
      const cur=inAct?s.fa:sw.a1;
      const from=sw.ring?cur-sgn*Math.min(4.5,Math.abs(cur-sw.a0)):sgn>0?Math.max(sw.a0,cur-2.2):Math.min(sw.a0,cur+2.2);
      s.smear={from,to:cur,al:inAct?1:1-e/.35,ring:sw.ring,sweep:sw.sweep,thrust:sw.thrust};
    }
    if(inAct)s.ba=2.5;
    return s;
  }
  switch(pose){
   case 'aim':{
    const back=e>.6?(e-.6)/.4:0;
    s.fa=t<=st?lerp(s.fa,0,ease(pS)):lerp(0,restFa,back);s.wOff=t<=st?lerp(RW,0,pS):lerp(0,RW,back);
    s.ext=t<=st?pS*.5:.5*(1-back);s.ba=2.4;
    if(t>=st&&t<st+5)s.fx='muzzle';
    break;}
   case 'thrust':
    s.fa=t<=st?lerp(s.fa,.9,pS):inAct?.05:lerp(.05,restFa,e);s.wOff=t<=st?lerp(RW,0,pS):inAct?0:lerp(0,RW,e);
    s.lean=t<=st?-.15*pS:inAct?.32:.32*(1-e);s.ext=inAct?1:0;s.ba=2.6;
    if(inAct)s.smear={thrust:1,from:.05,to:.05,al:1};
    break;
   case 'guard':
    s.fa=.6;s.wOff=-2.1;s.ba=1.2;s.crouch=3;
    if(inAct&&!a.ctr)s.fx='glint';
    if(a.ctr&&e<.5){s.fa=lerp(-1.4,1,Math.min(1,e*4));s.wOff=0;s.smear={from:-1.4,to:s.fa,al:1-e*2};}
    break;
   case 'jet':s.fa=2.1;s.ba=2.3;s.wOff=0;if(inAct)s.fx='jet';break;
   case 'tele':s.fa=-1.6;s.ba=-1.9;s.wOff=0;if(t<=st)s.fx='tele';break;
   case 'mirror':s.fa=-.1;s.wOff=0;s.ba=2.2;if(inAct)s.fx='mirror';break;
   case 'spin':s.fa=0;s.wOff=0;s.ba=Math.PI;if(inAct){s.spin=(t-st)*.8;s.smear={ring:1,al:1};}break;
   case 'plunge':s.fa=1.45;s.wOff=0;s.ba=-1.3;break;
  }
  return s;
}
function spriteState(f){
  const s=armPose(f);
  s.t=f.anim;s.run=f.ground?f.run:0;s.air=!f.ground;s.vy=f.vy;
  s.mood=(f.state==='hit'||f.state==='broken')?'hit':(f.state==='attack'||f.state==='shield')?'atk':'idle';
  s.blink=(Math.floor(f.anim)+f.i*60)%170<6;
  if(f.ch.id==='robot'&&game.projs.some(p=>p.kind==='fist'&&p.src===f.i))s.hideW=true;
  return s;
}
function idleState(t,mood){const s=basePose(t);s.t=t;s.run=0;s.air=false;s.vy=0;s.mood=mood||'idle';s.blink=(Math.floor(t)%170)<6;return s;}

/* rastro do golpe (desenhado por cima do personagem, já no espaço virado dele) */
function drawSmear(s,ci,pal){
  const sm=s.smear;if(!sm||sm.al<=0)return;
  const L=CH[ci].wl,robot=CH[ci].id==='robot';
  const sx=SH[0],sy=SH[1]+(s.crouch||0);
  const R1=robot?12+24+10:12+L+3,R0=robot?20:12+L*.35;
  g.save();g.globalAlpha=Math.min(1,sm.al)*.85;g.lineCap='round';
  if(sm.ring){
    g.lineWidth=R1-R0;g.strokeStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(0,-35,(R1+R0)/2,0,6.283);g.stroke();
    g.lineWidth=3;g.strokeStyle=pal.light;g.beginPath();g.arc(0,-35,R1,0,6.283);g.stroke();
  }else if(sm.sweep){
    g.lineWidth=9;g.strokeStyle='rgba(255,255,255,.7)';g.beginPath();g.ellipse(0,-8,R1+8,11,0,0,6.283);g.stroke();
    g.lineWidth=2.5;g.strokeStyle=pal.light;g.stroke();
  }else if(sm.thrust){
    const a=sm.to,c=Math.cos(a),sn=Math.sin(a);
    for(const o of [-6,0,6]){
      g.strokeStyle=o?pal.light:'#fff';g.lineWidth=o?2:4;g.beginPath();
      g.moveTo(sx+c*(R0-14)-sn*o,sy+sn*(R0-14)+c*o);g.lineTo(sx+c*(R1+10)-sn*o*.4,sy+sn*(R1+10)+c*o*.4);g.stroke();
    }
  }else{
    const n=14,f0=sm.from,f1=sm.to;
    g.beginPath();
    for(let i=0;i<=n;i++){const a=f0+(f1-f0)*i/n;g.lineTo(sx+Math.cos(a)*R1,sy+Math.sin(a)*R1);}
    for(let i=n;i>=0;i--){const a=f0+(f1-f0)*i/n,r=R1-(R1-R0)*(i/n);g.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);}
    g.closePath();g.fillStyle='rgba(255,255,255,.75)';g.fill();
    g.beginPath();for(let i=0;i<=n;i++){const a=f0+(f1-f0)*i/n;g.lineTo(sx+Math.cos(a)*R1,sy+Math.sin(a)*R1);}
    g.lineWidth=3;g.strokeStyle=pal.light;g.stroke();
  }
  g.restore();
}
function sparkle(x,y,r,col){
  g.fillStyle=col;g.beginPath();
  for(let i=0;i<8;i++){const rr2=i%2?r*.22:r,a=i*Math.PI/4;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}

}

function drawFx(s,f,pal){
  const ci=f.ci,L=CH[ci].wl||10,sx=SH[0],sy=SH[1]+(s.crouch||0);
  const al=armLen(ci,s),hx=sx+Math.cos(s.fa)*al,hy=sy+Math.sin(s.fa)*al,wa=s.fa+s.wOff;
  const tx=hx+Math.cos(wa)*L,ty=hy+Math.sin(wa)*L;
  g.save();
  if(s.glow>0){
    g.globalCompositeOperation='lighter';
    const r=8+s.glow*26,mx=(hx+tx)/2,my=(hy+ty)/2;
    const gg=g.createRadialGradient(mx,my,2,mx,my,r);gg.addColorStop(0,'rgba(255,240,150,.9)');gg.addColorStop(1,'rgba(255,180,60,0)');
    g.fillStyle=gg;g.beginPath();g.arc(mx,my,r,0,6.283);g.fill();
    if(s.glow>=1&&game.t%6<3)sparkle(tx,ty,14,'#fff');
  }
  switch(s.fx){
   case 'muzzle':g.globalCompositeOperation='lighter';sparkle(tx+Math.cos(s.fa)*6,ty+Math.sin(s.fa)*6,16,pal.light);dot(tx,ty,6,'#fff');break;
   case 'glint':{const k=.6+.4*Math.sin(game.t*.6);sparkle(tx,ty,10*k+4,'#fff');g.globalAlpha=.35;g.strokeStyle='#cfe3ff';g.lineWidth=2;g.beginPath();g.arc(4,-34,34+k*4,0,6.283);g.stroke();break;}
   case 'jet':{
    g.globalCompositeOperation='lighter';
    for(const x of [-6,6]){const h=22+Math.random()*12;
      const jg=g.createLinearGradient(0,0,0,h);jg.addColorStop(0,'rgba(255,250,200,.95)');jg.addColorStop(.4,'rgba(255,160,60,.85)');jg.addColorStop(1,'rgba(255,60,30,0)');
      g.fillStyle=jg;g.beginPath();g.moveTo(x-5,-2);g.quadraticCurveTo(x,h*1.2,x+5,-2);g.fill();}
    break;}
   case 'tele':g.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const a=game.t*.3+i*1.256;sparkle(Math.cos(a)*22,-34+Math.sin(a)*30,6,'#e9d8ff');}break;
   case 'mirror':{
    const k=game.t*.2;g.save();g.translate(24,-34);g.scale(.55,1);
    g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;g.lineTo(Math.cos(a)*40,Math.sin(a)*40);}g.closePath();
    g.fillStyle='rgba(200,170,255,.32)';g.fill();g.lineWidth=4;g.strokeStyle='rgba(255,255,255,.85)';g.stroke();
    g.globalAlpha=.6;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-20,-30+(k*20%60));g.lineTo(20,-10+(k*20%60));g.stroke();
    g.restore();break;}
  }
  g.restore();
}

function drawFighter(f){

      g.fillStyle=p.col;g.save();g.translate(p.x,p.y);g.rotate(k*2);
      const R=p.size*(1.2-k*.4);g.beginPath();
      for(let i=0;i<8;i++){const r=i%2?R*.4:R;const a=i*Math.PI/4;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      g.closePath();g.fill();g.restore();
    }else if(p.k==='dust'){
      g.globalAlpha=k*.6;g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size*(1+(1-k)*1.3),0,6.283);g.fill();
    }else if(p.k==='ring'){
      g.strokeStyle=p.col;g.lineWidth=5*k+1;g.beginPath();g.arc(p.x,p.y,p.size*(1.15-k),0,6.283);g.stroke();
    }else if(p.k==='line'){
      const m=Math.hypot(p.vx,p.vy)||1;g.strokeStyle=p.col;g.lineWidth=3*k+1;g.lineCap='round';
      g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx/m*p.size*k,p.y-p.vy/m*p.size*k);g.stroke();
    }else if(p.k==='flame'){
      g.fillStyle=k>.6?'#fff3c4':k>.3?'#ffb347':'#ff5a2b';g.beginPath();g.arc(p.x,p.y,p.size*k+.5,0,6.283);g.fill();
    }else{
      g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size*k+.5,0,6.283);g.fill();
    }
  }
  g.globalAlpha=1;
}

  text(sub,W/2,82,17,'#fff','center',FONT_B);
  const cw=200,chh=340,gap=20,x0=(W-(4*cw+3*gap))/2,y0=104;
  for(let i=0;i<4;i++){
    const c=CH[i],x=x0+i*(cw+gap);
    game.btns.push({x,y:y0,w:cw,h:chh,act:'card',v:i});
    const hov=game.hover===game.btns.length-1;
    g.fillStyle=hov?'rgba(60,70,160,.95)':'rgba(25,30,80,.9)';rr(x,y0,cw,chh,16);g.fill();
    g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.2)';rr(x,y0,cw,chh,16);g.stroke();
    for(let p=0;p<2;p++){
      if(game.mode===1&&p===1)continue;
      if(game.sel[p]===i){
        g.lineWidth=5;g.strokeStyle=PAL[p].main;
        rr(x-4-p*4,y0-4-p*4,cw+8+p*8,chh+8+p*8,18+p*2);g.stroke();
        const lab=game.mode===1?'J1':'J'+(p+1);
        g.fillStyle=PAL[p].main;rr(x+8+p*54,y0+8,48,22,8);g.fill();
        text(lab+(game.conf[p]?' ✓':''),x+32+p*54,y0+20,15,'#fff','center',FONT_D);
      }
    }
    const pi=(game.sel[0]===i)?0:(game.mode===2&&game.sel[1]===i?1:(i%2));
    drawPreview(i,pi,x+cw/2,y0+140,1.5,game.t+i*17,game.conf[0]&&game.sel[0]===i||game.conf[1]&&game.sel[1]===i?'happy':'idle');
    text(c.nome,x+cw/2,y0+160,25,'#fff','center');
    text(c.desc,x+cw/2,y0+181,13,'#cfd6ff','center',FONT_B);
    const names=['Velocidade','Peso','Força'];
    for(let s=0;s<3;s++){
      const yy=y0+202+s*17;
      text(names[s],x+14,yy,12,'#fff','left',FONT_B);
      for(let k=0;k<5;k++){g.fillStyle=k<c.stats[s]?'#ffd23f':'rgba(255,255,255,.15)';rr(x+88+k*20,yy-5,16,10,3);g.fill();}
    }
    text('ESPECIAIS',x+cw/2,y0+260,12,'#ffd23f','center',FONT_B);
    const ic=['●','→','↑','↓'],kk=['n','s','u','d'];
    for(let s=0;s<4;s++){
      text(ic[s],x+20,y0+279+s*16,12,'#ffd23f','center',FONT_B);
      text(c.sp[kk[s]].nome,x+32,y0+279+s*16,12.5,'#ffe9b0','left',FONT_B);
    }
  }
  button(40,470,150,50,'Voltar','back',0,{size:22,col:'#444a7a'});
  button(W-190,470,150,50,'Confirmar','ok',0,{size:22,col:'#2f9c5a'});
  text(padCount?'🎮 A confirma · B cancela · Select volta':'Esc volta ao menu',W/2,494,14,'#aab','center',FONT_B);
}
function drawPlay(){
  const sh=game.shake;
  g.save();
  if(sh>.3)g.translate(rand(-sh,sh),rand(-sh,sh));
  drawBG(game.t,(cam.x-480)*.3,(cam.y-290)*.3,1+(cam.z-1)*.35);
  g.save();
  g.translate(W/2,H/2);g.scale(cam.z,cam.z);g.translate(-cam.x,-cam.y);
  drawStage();drawShadows();drawRespawnPlat();drawGhosts();drawProjs();
  for(const f of game.fighters)drawFighter(f);
  drawParts();drawPops();
  g.restore();
  g.restore();
  drawKO();
  vignette();
  drawOffscreen();
  drawHUD();
  if(game.flash>0){g.globalAlpha=game.flash/18*.7;g.fillStyle=game.flashCol;g.fillRect(0,0,W,H);g.globalAlpha=1;}
  if(game.count>0){
    const n=Math.ceil(game.count/60);
    const k=(game.count%60)/60;
    text(String(n),W/2,200,150*(.8+k*.4),'#fff','center',FONT_D,{w:12,c:'#7a2b00'});
    text(String(n),W/2,200,150*(.8+k*.4),'#ffd23f','center');
  }else if(game.frames<50){
    text('JÁ!',W/2,200,120,'#ffd23f','center',FONT_D,{w:12,c:'#7a2b00'});
    text('JÁ!',W/2,200,120,'#ffd23f','center');
  }
  if(game.over>=0&&game.endT>0){
    text('FIM!',W/2,220,120,'#fff','center',FONT_D,{w:12,c:'#7a2b00'});
    text('FIM!',W/2,220,120,'#ff5a4d','center');
  }
  if(game.paused){
    g.fillStyle='rgba(0,0,20,.65)';g.fillRect(0,0,W,H);
    text('PAUSADO',W/2,200,80,'#fff','center');
    text('P / Esc / Start continua · M ou B volta ao menu',W/2,270,22,'#cfd6ff','center',FONT_B);
    button(W/2-130,310,260,54,'Continuar','resume',0,{});
    button(W/2-130,376,260,54,'Menu','menu',0,{col:'#444a7a'});
  }
}
function drawEnd(){
  drawBG(game.t);
  g.fillStyle='rgba(8,10,40,.6)';g.fillRect(0,0,W,H);
  const w=game.winner;
  let title;
  if(game.mode===1)title=w===0?'Jogador 1 venceu!':'A CPU venceu!';else title='Jogador '+(w+1)+' venceu!';
  const f=game.fighters[w];
  const bounce=Math.abs(Math.sin(game.t*.1))*14;
  g.save();g.translate(W/2,310-bounce);g.scale(3,3);
  outlined(()=>drawSprite(f.ci,PAL[w],idleState(game.t,'happy')));g.restore();
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(W/2,312,60,10,0,0,6.283);g.fill();
  text(title,W/2,80,70,PAL[w].main,'center',FONT_D,{w:10,c:'#fff'});
  text(title,W/2,80,70,PAL[w].main,'center');
  text(f.ch.nome+' · '+(game.mode===1&&w===1?'CPU ('+DIFFN[game.diff-1]+')':'Jogador '+(w+1)),W/2,128,24,'#fff','center',FONT_B);
  if(game.mode===1&&w===0){
    text('Pontos: '+game.score,W/2,168,34,'#ffd23f','center');
    text('Vidas restantes: '+f.lives+' · Tempo: '+Math.floor(game.frames/60)+'s · '+DIFFN[game.diff-1],W/2,198,16,'#cfd6ff','center',FONT_B);
  }
  button(W/2-250,410,230,64,'Revanche','rematch',0,{size:30,col:'#2f9c5a'});
  button(W/2+20,410,230,64,'Menu','menu',0,{size:30,col:'#444a7a'});
  text('Enter / R / A = revanche · M / B = menu',W/2,498,16,'#cfd6ff','center',FONT_B);
}
function render(){
  g.setTransform(scaleF,0,0,scaleF,0,0);
  g.clearRect(0,0,W,H);
  game.btns=[];
  switch(game.scene){
    case 'menu':drawMenu();break;
    case 'select':drawSelect();break;
    case 'play':drawPlay();break;
    case 'end':drawEnd();break;
  }
}

/* ===== loop ===== */
const STEP=1000/60;
let last=performance.now(),acc=0;
function tick(){
  game.t++;
  if(game.shake>0)game.shake*=.86;
  if(game.flash>0)game.flash--;
  if(game.scene==='play'&&!game.paused)simulate();
  else if(game.scene==='end'){for(const p of game.parts){p.x+=p.vx;p.y+=p.vy;p.life--;}game.parts=game.parts.filter(p=>p.life>0);}
}
function frame(now){
  pollPads();
  acc+=Math.min(250,now-last);last=now;
  while(acc>=STEP){tick();acc-=STEP;}
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('gamepadconnected',()=>beep(660,.08,'triangle',.04,1.5));
requestAnimationFrame(frame);
window.__game=game;
})();
</script>
