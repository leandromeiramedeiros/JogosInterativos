<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Puxe o Pino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b4f9c;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:linear-gradient(180deg,#4aa8f0 0%,#2a6fd1 55%,#1b4f9c 100%);font-family:'Figtree',system-ui,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;overflow:hidden;border-radius:14px;
  background:linear-gradient(180deg,#58b6ff 0%,#2f7be0 60%,#2158b0 100%);box-shadow:0 8px 30px rgba(0,0,0,.35)}
canvas{position:absolute;left:0;top:0;width:360px;height:640px;display:block}
#hud{position:absolute;left:0;top:0;width:100%;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:'Lilita One',sans-serif;pointer-events:none}
#hud>*{pointer-events:auto}
#lv{font-size:24px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#coins{display:flex;align-items:center;gap:6px;font-size:22px;background:rgba(0,0,0,.22);padding:3px 12px 3px 8px;border-radius:20px}
.dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc61a 55%,#d99200);border:2px solid #b87400;display:inline-block}
button{font-family:'Lilita One',sans-serif;cursor:pointer;border:0;color:#fff}
#rst{font-size:15px;padding:7px 12px;border-radius:12px;background:#ff8a1e;box-shadow:0 3px 0 #b85a00}
#rst:active{transform:translateY(2px);box-shadow:0 1px 0 #b85a00}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,30,70,.62);text-align:center;padding:24px;z-index:5}
.ov.on{display:flex}
.ov h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:48px;margin:0 0 8px;color:#ffd53a;text-shadow:0 4px 0 #b86a00;line-height:1}
.ov h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:36px;margin:0 0 8px}
.ov p{margin:4px 0 14px;font-size:16px;font-weight:700;line-height:1.35;max-width:270px}
.big{font-size:26px;padding:12px 40px;border-radius:18px;background:#2fcf5f;box-shadow:0 5px 0 #138a37;margin:4px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #138a37}
.big.alt{background:#ff8a1e;box-shadow:0 5px 0 #b85a00}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:280px;margin-top:16px}
.chip{width:44px;height:36px;border-radius:10px;background:#3b82e0;font-size:18px;box-shadow:0 3px 0 #1a4a96}
.chip[disabled]{opacity:.35;cursor:default}
.hero{width:96px;height:96px;margin-bottom:6px}
.sc{font-family:'Lilita One',sans-serif;font-size:30px;color:#ffd53a;margin:2px 0 12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="720" height="1280"></canvas>
  <div id="hud">
    <div id="lv">FASE 1</div>
    <div id="coins"><span class="dot"></span><span id="cn">0/0</span></div>
    <button id="rst">Reiniciar</button>
  </div>
  <div class="ov on" id="ovStart">
    <svg class="hero" viewBox="0 0 100 100"><circle cx="50" cy="30" r="20" fill="#ffd2a8"/><path d="M30 26 Q50 2 70 26 Q60 16 50 16 Q40 16 30 26Z" fill="#7a4a1e"/><circle cx="43" cy="32" r="3" fill="#222"/><circle cx="57" cy="32" r="3" fill="#222"/><path d="M44 40 Q50 45 56 40" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="27" y="50" width="46" height="38" rx="14" fill="#2f6fe0"/><rect x="34" y="84" width="12" height="12" rx="4" fill="#3a2a1a"/><rect x="54" y="84" width="12" height="12" rx="4" fill="#3a2a1a"/></svg>
    <h1>Puxe o Pino</h1>
    <p>Toque nos pinos para soltar moedas, lava e água. Salve o herói da lava e dos monstros!</p>
    <p style="font-size:13px;opacity:.85;margin:-6px 0 12px">Controle: direcional/LB/RB escolhe o pino, A puxa, Y reinicia.</p>
    <button class="big" id="play">Jogar</button>
    <div id="chips"></div>
  </div>
  <div class="ov" id="ovEnd">
    <h2 id="eT"></h2>
    <p id="eP"></p>
    <div class="sc" id="eS"></div>
    <button class="big" id="eB1"></button>
    <button class="big alt" id="eB2" style="display:none"></button>
  </div>
</div>
<script src="../../jogos/controle.js?v=1"></script>
<script>
(function(){
"use strict";
// ---------- constants ----------
var GOLD=0,LAVA=1,WATER=2,STONE=3,MON=4;
var R=5,GR=900,NSUB=5,LX=24,RX=336,FY=620,TOP=70;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var stage=document.getElementById('stage');

// ---------- level building ----------
function onPin(t,py,xa,xb,rows,b){
  var cols=Math.floor((xb-xa)/10.4),y0=py-8.5-(rows-1)*10.2;
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++)b.push([t,xa+5+i*10.4+(j%2)*2.5,y0+j*10.2]);
}
function mk(o){
  var b=[];o.fill(b);
  return {need:o.need,hx:o.hx,walls:o.walls||[],pins:o.pins,balls:b,mon:o.mon||null,sol:o.sol};
}
var LEVELS=[
 // 1: tutorial
 function(){return mk({need:12,hx:170,pins:[[26,330,348,330],[26,480,348,480]],sol:[0,1],
   fill:function(b){onPin(GOLD,330,130,200,4,b);}});},
 // 2: lava on the side, gold on the other
 function(){return mk({need:24,hx:260,walls:[[180,150,180,400]],
   pins:[[178,320,12,320],[182,320,348,320]],sol:[1],
   fill:function(b){onPin(LAVA,320,30,176,3,b);onPin(GOLD,320,186,334,3,b);}});},
 // 3: water neutralizes lava
 function(){return mk({need:20,hx:180,
   pins:[[26,190,348,190],[334,330,12,330],[26,470,348,470]],sol:[0,1,2],
   fill:function(b){onPin(WATER,190,28,334,3,b);onPin(LAVA,330,34,326,1,b);onPin(GOLD,470,120,250,3,b);}});},
 // 4: lava kills the monster
 function(){return mk({need:24,hx:260,walls:[[180,150,180,560]],
   pins:[[178,450,12,450],[178,300,12,300],[182,300,348,300]],sol:[1,2],mon:[100,433],
   fill:function(b){onPin(LAVA,300,30,176,2,b);onPin(GOLD,300,186,334,3,b);}});},
 // 5: decoy water
 function(){return mk({need:24,hx:260,walls:[[180,150,180,560]],
   pins:[[178,450,12,450],[178,300,12,300],[182,300,348,300],[178,190,12,190]],sol:[1,2],mon:[100,433],
   fill:function(b){onPin(LAVA,300,30,176,2,b);onPin(GOLD,300,186,334,3,b);onPin(WATER,190,30,176,2,b);}});},
 // 6: lava falls into water, then gold
 function(){return mk({need:28,hx:180,
   pins:[[26,190,348,190],[334,320,12,320],[26,450,348,450]],sol:[1,0,2],
   fill:function(b){onPin(GOLD,190,100,260,3,b);onPin(LAVA,320,34,326,1,b);onPin(WATER,450,28,334,3,b);}});},
 // 7: monster in an open cell
 function(){return mk({need:24,hx:260,walls:[[172,150,172,560],[130,520,130,620]],
   pins:[[170,250,12,250],[174,300,348,300]],sol:[0,1],mon:[70,603.5],
   fill:function(b){onPin(LAVA,250,30,120,2,b);onPin(GOLD,300,182,334,3,b);}});},
 // 8: cell + stack
 function(){return mk({need:24,hx:255,walls:[[172,150,172,560],[130,520,130,620]],
   pins:[[170,250,12,250],[174,180,348,180],[174,300,348,300],[174,420,348,420]],sol:[0,2,1,3],mon:[70,603.5],
   fill:function(b){onPin(LAVA,250,30,120,2,b);onPin(GOLD,180,182,334,3,b);onPin(LAVA,300,182,334,1,b);onPin(WATER,420,180,334,3,b);}});},
 // 9: monster on shelf, decoys, stack
 function(){return mk({need:24,hx:255,walls:[[172,150,172,560]],
   pins:[[170,450,12,450],[170,300,12,300],[170,190,12,190],[174,180,348,180],[174,300,348,300],[174,420,348,420]],
   sol:[1,4,3,5],mon:[100,433],
   fill:function(b){onPin(LAVA,300,30,168,2,b);onPin(WATER,190,30,168,2,b);onPin(GOLD,180,182,334,3,b);onPin(LAVA,300,182,334,1,b);onPin(WATER,420,180,334,3,b);}});},
 // 10: finale
 function(){return mk({need:36,hx:220,walls:[[100,150,100,440],[100,520,100,620]],
   pins:[[96,300,12,300],[104,180,348,180],[104,300,348,300],[104,420,348,420]],sol:[0,2,1,3],mon:[60,603.5],
   fill:function(b){onPin(LAVA,300,30,92,3,b);onPin(GOLD,180,110,334,3,b);onPin(LAVA,300,108,334,1,b);onPin(WATER,420,108,334,3,b);}});}
];
var NL=LEVELS.length;

// ---------- state ----------
var S={state:'menu',lvl:0,balls:[],pins:[],walls:[],hx:180,hy:602,got:0,need:0,hasMon:false,score:0,t:0,endT:0,unlocked:1};
var segCache=[],padSel=-1,padOn=false;

function loadProgress(){try{var v=parseInt(localStorage.getItem('puxe-o-pino:max')||'1',10);if(v>=1&&v<=NL)S.unlocked=v;}catch(e){}}
function saveProgress(){try{localStorage.setItem('puxe-o-pino:max',String(S.unlocked));}catch(e){}}

function loadLevel(i){
  var d=LEVELS[i]();
  S.lvl=i;S.need=d.need;S.hx=d.hx;S.got=0;S.t=0;S.endT=0;
  S.walls=[[LX,TOP,LX,FY],[RX,TOP,RX,FY],[LX,FY,RX,FY]].concat(d.walls).map(function(w){return {x1:w[0],y1:w[1],x2:w[2],y2:w[3],th:4};});
  S.pins=d.pins.map(function(p){
    var dx=p[2]-p[0],dy=p[3]-p[1],len=Math.hypot(dx,dy);
    return {x1:p[0],y1:p[1],x2:p[2],y2:p[3],dx:dx/len,dy:dy/len,len:len,disp:0,st:0};
  });
  S.balls=d.balls.map(function(b){return {t:b[0],x:b[1],y:b[2],vx:0,vy:0,r:R,m:1};});
  S.hasMon=false;
  if(d.mon){S.balls.push({t:MON,x:d.mon[0],y:d.mon[1],vx:0,vy:0,r:12.5,m:4});S.hasMon=true;}
  S.state='play';
  document.getElementById('lv').textContent='FASE '+(i+1);
  updHud();
}
function updHud(){document.getElementById('cn').textContent=S.got+'/'+S.need;}

function pinCur(p){
  var o=p.disp;
  return {x1:p.x1+p.dx*o,y1:p.y1+p.dy*o,x2:p.x2+p.dx*o,y2:p.y2+p.dy*o,th:3};
}
function pullPin(k){var p=S.pins[k];if(p&&p.st===0&&S.state==='play'){p.st=1;}}

// ---------- physics ----------
function collideSeg(b,s){
  var ex=s.x2-s.x1,ey=s.y2-s.y1,l2=ex*ex+ey*ey;
  var t=((b.x-s.x1)*ex+(b.y-s.y1)*ey)/l2;t=t<0?0:t>1?1:t;
  var cx=s.x1+ex*t,cy=s.y1+ey*t,dx=b.x-cx,dy=b.y-cy,Rr=b.r+s.th,d2=dx*dx+dy*dy;
  if(d2<Rr*Rr){
    var d=Math.sqrt(d2),nx,ny;
    if(d<1e-6){var l=Math.sqrt(l2);nx=-ey/l;ny=ex/l;d=0;}else{nx=dx/d;ny=dy/d;}
    b.x+=nx*(Rr-d);b.y+=ny*(Rr-d);
    var vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      var e=b.t===MON?0:0.12;
      b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;
      if(b.t!==MON){var fr=(b.t===GOLD||b.t===STONE)?0.955:0.985;b.vx*=fr;b.vy*=0.99;}
    }
  }
}
function sub(h){
  var segs=segCache,balls=S.balls,i,j,b,k;
  for(i=0;i<balls.length;i++){
    b=balls[i];
    b.vy+=GR*h;
    if(b.t===MON){
      var dir=S.hx>b.x?1:-1;b.vx+=dir*700*h;
      if(b.vx>42)b.vx=42;if(b.vx<-42)b.vx=-42;
    }
    var sp=Math.hypot(b.vx,b.vy);if(sp>650){b.vx*=650/sp;b.vy*=650/sp;}
    b.vx*=0.9997;
    b.x+=b.vx*h;b.y+=b.vy*h;
    for(k=0;k<segs.length;k++)collideSeg(b,segs[k]);
  }
  for(i=0;i<balls.length;i++){
    var a=balls[i];
    for(j=i+1;j<balls.length;j++){
      var c=balls[j],dx=c.x-a.x;
      var rr=a.r+c.r;
      if(dx>rr||dx<-rr)continue;
      var dy=c.y-a.y;
      if(dy>rr||dy<-rr)continue;
      var d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>1e-8){
        var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=rr-d;
        var im1=1/a.m,im2=1/c.m,is=im1+im2;
        a.x-=nx*ov*im1/is*0.9;a.y-=ny*ov*im1/is*0.9;
        c.x+=nx*ov*im2/is*0.9;c.y+=ny*ov*im2/is*0.9;
        var vn=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
        if(vn<0){
          var jj=-(1.04)*vn/is;
          var mx=(a.vx+c.vx)*.5,my=(a.vy+c.vy)*.5,k2=(a.t===LAVA||a.t===WATER)?0.02:0.06;a.vx+=(mx-a.vx)*k2;c.vx+=(mx-c.vx)*k2;a.vy+=(my-a.vy)*k2;c.vy+=(my-c.vy)*k2;
          a.vx-=jj*nx*im1;a.vy-=jj*ny*im1;
          c.vx+=jj*nx*im2;c.vy+=jj*ny*im2;
        }
      }
    }
  }
  for(i=0;i<balls.length;i++){b=balls[i];for(k=0;k<segs.length;k++)collideSeg(b,segs[k]);}
}
function react(){
  var balls=S.balls,i,j,dead=null;
  for(i=0;i<balls.length;i++){
    var a=balls[i];
    if(a.t!==LAVA&&a.t!==WATER)continue;
    for(j=0;j<balls.length;j++){
      var c=balls[j];if(c===a)continue;
      var dx=c.x-a.x,dy=c.y-a.y,rr=a.r+c.r+1.5;
      if(dx>rr||dx<-rr||dy>rr||dy<-rr)continue;
      if(dx*dx+dy*dy>rr*rr)continue;
      if(a.t===LAVA&&c.t===WATER){a.t=STONE;c.t=STONE;break;}
      if(a.t===LAVA&&c.t===MON){c.dead=true;}
    }
  }
  var out=[];
  for(i=0;i<balls.length;i++){if(balls[i].dead){S.hasMon=false;continue;}out.push(balls[i]);}
  S.balls=out;
  // hero
  var hx=S.hx,hy=S.hy||602,rem=[];
  for(i=0;i<S.balls.length;i++){
    var b=S.balls[i],dd=Math.hypot(b.x-hx,b.y-hy);
    if(b.t===LAVA&&dd<14+R+2){return lose();}
    if(b.t===MON&&dd<12.5+14+3){return lose();}
    if(b.t===GOLD&&dd<33){S.got++;updHud();continue;}
    if((b.t===WATER||b.t===STONE)&&dd<26)continue;
    rem.push(b);
  }
  S.balls=rem;
  if(S.got>=S.need&&!S.hasMon)win();
}
function step(dt){
  if(S.state!=='play')return;
  S.t+=dt;
  var i;
  for(i=0;i<S.pins.length;i++){var p=S.pins[i];if(p.st===1){p.disp+=720*dt;if(p.disp>p.len+26){p.st=2;}}}
  var h=dt/NSUB;
  for(var s=0;s<NSUB;s++){
    segCache=S.walls.slice();
    for(i=0;i<S.pins.length;i++)if(S.pins[i].st<2)segCache.push(pinCur(S.pins[i]));
    sub(h);
    if(S.state!=='play')return;
  }
  react();
}

// ---------- flow ----------
function show(id,on){document.getElementById(id).classList[on?'add':'remove']('on');}
function postScore(){
  var p=Math.max(0,Math.min(50000,Math.round(S.score)));
  if(p<1)return;
  try{if(parent!==window)parent.postMessage({tipo:'jogos:fim',pontos:p,nivel:'Fase '+(S.lvl+1)},'*');}catch(e){}
}
function btn(id,txt,fn){var b=document.getElementById(id);if(txt===null){b.style.display='none';return;}b.style.display='';b.textContent=txt;b.onclick=fn;}
function win(){
  if(S.state!=='play')return;
  S.state='won';
  var gain=100+10*S.got;S.score+=gain;
  if(S.lvl+2>S.unlocked){S.unlocked=Math.min(NL,S.lvl+2);saveProgress();}
  setTimeout(function(){
    if(S.lvl>=NL-1){
      document.getElementById('eT').textContent='Parabéns!';
      document.getElementById('eP').textContent='Você completou todas as '+NL+' fases e salvou o herói!';
      document.getElementById('eS').textContent='Pontos: '+S.score;
      btn('eB1','Jogar de novo',function(){startRun(0);});btn('eB2',null);
      show('ovEnd',true);postScore();
    }else{
      document.getElementById('eT').textContent='Fase concluída!';
      document.getElementById('eP').textContent='+'+gain+' pontos ('+S.got+' moedas)';
      document.getElementById('eS').textContent='Total: '+S.score;
      btn('eB1','Próxima fase',function(){show('ovEnd',false);loadLevel(S.lvl+1);});btn('eB2',null);
      show('ovEnd',true);
    }
  },700);
}
function lose(){
  if(S.state!=='play')return;
  S.state='lost';
  setTimeout(function(){
    document.getElementById('eT').textContent='Ops! Você perdeu';
    document.getElementById('eP').textContent='O herói não resistiu. Pense na ordem dos pinos!';
    document.getElementById('eS').textContent='Pontos: '+S.score;
    btn('eB1','Tentar de novo',function(){show('ovEnd',false);loadLevel(S.lvl);});
    btn('eB2','Jogar de novo',function(){startRun(0);});
    show('ovEnd',true);postScore();
  },700);
}
function startRun(i){S.score=0;show('ovStart',false);show('ovEnd',false);loadLevel(i);}

// ---------- input ----------
function toLogical(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*360,y:(e.clientY-r.top)/r.height*640};
}
function segDist(px,py,x1,y1,x2,y2){
  var ex=x2-x1,ey=y2-y1,t=((px-x1)*ex+(py-y1)*ey)/(ex*ex+ey*ey);t=t<0?0:t>1?1:t;
  return Math.hypot(px-(x1+ex*t),py-(y1+ey*t));
}
cv.addEventListener('pointerdown',function(e){
  if(S.state!=='play')return;
  e.preventDefault();
  var q=toLogical(e),best=-1,bd=1e9;
  for(var i=0;i<S.pins.length;i++){
    var p=S.pins[i];if(p.st!==0)continue;
    var hd=Math.hypot(q.x-p.x2,q.y-p.y2)-9;
    var sd=segDist(q.x,q.y,p.x1,p.y1,p.x2,p.y2)-4;
    var d=Math.min(hd,sd);
    if(d<24&&d<bd){bd=d;best=i;}
  }
  if(best>=0)pullPin(best);
});
document.getElementById('rst').onclick=function(){if(S.state==='menu')return;show('ovEnd',false);loadLevel(S.lvl);};
document.getElementById('play').onclick=function(){startRun(Math.min(S.unlocked,NL)-1);};
function buildChips(){
  var c=document.getElementById('chips');c.innerHTML='';
  for(var i=0;i<NL;i++){
    var b=document.createElement('button');b.className='chip';b.textContent=i+1;
    if(i>=S.unlocked)b.disabled=true;
    (function(i){b.onclick=function(){startRun(i);};})(i);
    c.appendChild(b);
  }
}

// ---------- rendering ----------
function ball(b){
  var c1,c2,c3;
  if(b.t===GOLD){c1='#fff3a0';c2='#ffc61a';c3='#c98400';}
  else if(b.t===LAVA){c1='#ffe08a';c2='#ff7a1a';c3='#c22a0a';}
  else if(b.t===WATER){c1='#c9f0ff';c2='#3fa9f5';c3='#1c62c4';}
  else{c1='#e3e6ea';c2='#9aa1ab';c3='#6b727c';}
  var g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,.5,b.x,b.y,b.r*1.1);
  g.addColorStop(0,c1);g.addColorStop(.55,c2);g.addColorStop(1,c3);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r+.4,0,6.3);ctx.fill();
}
function drawMon(b){
  var x=b.x,y=b.y,r=b.r+3;
  ctx.fillStyle='#9a55e0';ctx.strokeStyle='#5d2a9c';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-r,y+r*.8);ctx.lineTo(x-r,y-r*.1);ctx.arc(x,y-r*.1,r,Math.PI,0);ctx.lineTo(x+r,y+r*.8);
  ctx.lineTo(x+r*.5,y+r*.55);ctx.lineTo(x,y+r*.8);ctx.lineTo(x-r*.5,y+r*.55);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.38,y-r*.2,r*.28,0,6.3);ctx.arc(x+r*.38,y-r*.2,r*.28,0,6.3);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x-r*.34+(S.hx>x?2:-2),y-r*.18,r*.13,0,6.3);ctx.arc(x+r*.42+(S.hx>x?2:-2),y-r*.18,r*.13,0,6.3);ctx.fill();
  ctx.strokeStyle='#3b1766';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+r*.25,r*.25,.1*Math.PI,.9*Math.PI);ctx.stroke();
}
function drawHero(){
  var x=S.hx,y=602,sad=S.state==='lost';
  ctx.fillStyle='#3a2a1a';ctx.fillRect(x-9,y+10,7,6);ctx.fillRect(x+2,y+10,7,6);
  ctx.fillStyle='#2f6fe0';ctx.strokeStyle='#1d49a3';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x-11,y-2,22,15,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffd2a8';ctx.beginPath();ctx.arc(x,y-8,10,0,6.3);ctx.fill();
  ctx.fillStyle='#7a4a1e';ctx.beginPath();ctx.arc(x,y-11,10,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x-3.5,y-8,1.5,0,6.3);ctx.arc(x+3.5,y-8,1.5,0,6.3);ctx.fill();
  ctx.strokeStyle='#c0392b';ctx.lineWidth=1.5;ctx.beginPath();
  if(sad)ctx.arc(x,y-1,3,1.15*Math.PI,1.85*Math.PI);else ctx.arc(x,y-5,3.5,.15*Math.PI,.85*Math.PI);
  ctx.stroke();
}
function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.clearRect(0,0,360,640);
  if(S.state==='menu'&&!S.walls.length)return;
  // chamber backdrop
  ctx.fillStyle='rgba(255,255,255,.13)';
  ctx.fillRect(LX,TOP,RX-LX,FY-TOP);
  ctx.lineCap='round';
  // walls
  ctx.strokeStyle='#dfe3ea';ctx.lineWidth=8;
  for(var i=0;i<S.walls.length;i++){var w=S.walls[i];ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.stroke();}
  // balls
  for(i=0;i<S.balls.length;i++){var b=S.balls[i];if(b.t!==MON)ball(b);}
  for(i=0;i<S.balls.length;i++){b=S.balls[i];if(b.t===MON)drawMon(b);}
  drawHero();
  // pins
  for(i=0;i<S.pins.length;i++){
    var p=S.pins[i];if(p.st===2)continue;
    var c=pinCur(p);
    ctx.strokeStyle='#8e97a8';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(c.x1,c.y1);ctx.lineTo(c.x2,c.y2);ctx.stroke();
    ctx.strokeStyle='#c4cad6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c.x1,c.y1-1);ctx.lineTo(c.x2,c.y2-1);ctx.stroke();
    var hg=ctx.createRadialGradient(c.x2-3,c.y2-3,1,c.x2,c.y2,10);
    hg.addColorStop(0,'#fff59a');hg.addColorStop(.6,'#ffd21a');hg.addColorStop(1,'#e69a00');
    ctx.fillStyle=hg;ctx.strokeStyle='#b87400';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(c.x2,c.y2,9,0,6.3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(c.x2-3,c.y2-3,2.5,0,6.3);ctx.fill();ctx.globalAlpha=1;
    if(padOn&&i===padSel&&S.state==='play'){var rr=14+Math.sin(Date.now()/130)*1.5;ctx.beginPath();ctx.arc(c.x2,c.y2,rr,0,6.3);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#ff3b30';ctx.lineWidth=2;ctx.stroke();}
  }
}
// ---------- loop ----------
var last=0,acc=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;acc+=dt;
  var n=0;while(acc>=1/60&&n<3){step(1/60);acc-=1/60;n++;}
  if(n===3)acc=0;
  draw();
  requestAnimationFrame(frame);
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/360,h/640);
  stage.style.transform='scale('+s+')';
  stage.style.left=((w-360*s)/2)+'px';stage.style.top=((h-640*s)/2)+'px';
}
window.addEventListener('resize',resize);resize();
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};}
loadProgress();buildChips();
requestAnimationFrame(frame);
window.__t={S:function(){return S;},load:function(i){S.score=0;show('ovStart',false);show('ovEnd',false);loadLevel(i);},pull:pullPin,
  step:function(n){for(var i=0;i<n;i++)step(1/60);},levels:LEVELS,sols:function(){return LEVELS.map(function(f){return f().sol;});}};
// controle: direcional/LB/RB escolhe o pino (anel na tela), A puxa, Y reinicia
if(window.Controle){
  var ovOn=function(){return !!document.querySelector('.ov.on');},ovAnt=true,pinsRef=null,ult={x:180,y:300};
  Controle.navegar({ativo:ovOn,raiz:function(){return document.querySelector('.ov.on');}});
  var perto=function(L,x,y){var r=-1,md=1e9;L.forEach(function(i){var c=pinCur(S.pins[i]),d=Math.hypot(c.x2-x,c.y2-y);if(d<md){md=d;r=i;}});return r;};
  Controle.on('quadro',function(){
    padOn=Controle.usado;
    var v=ovOn();
    if(v||ovAnt){ovAnt=v;return;}
    if(S.state!=='play')return;
    var L=[],i;for(i=0;i<S.pins.length;i++)if(S.pins[i].st===0)L.push(i);
    if(pinsRef!==S.pins){pinsRef=S.pins;padSel=L.length?L[0]:-1;}
    if(Controle.apertou(-1,'y')){document.getElementById('rst').click();return;}
    if(!L.length){padSel=-1;return;}
    if(padSel<0||S.pins[padSel].st!==0)padSel=perto(L,ult.x,ult.y);
    var cur=pinCur(S.pins[padSel]);
    ['cima','baixo','esquerda','direita'].forEach(function(d){
      if(!Controle.apertou(-1,d))return;
      var best=-1,mv=1e9;
      L.forEach(function(j){
        if(j===padSel)return;
        var c=pinCur(S.pins[j]),dx=c.x2-cur.x2,dy=c.y2-cur.y2,pr,or;
        if(d==='cima'){pr=-dy;or=Math.abs(dx);}else if(d==='baixo'){pr=dy;or=Math.abs(dx);}
        else if(d==='esquerda'){pr=-dx;or=Math.abs(dy);}else{pr=dx;or=Math.abs(dy);}
        if(pr<=3)return;
        var sc=pr+or*2.2;if(sc<mv){mv=sc;best=j;}
      });
      if(best>=0){padSel=best;cur=pinCur(S.pins[padSel]);}
    });
    var k=L.indexOf(padSel);
    if(Controle.apertou(-1,'lb')){padSel=L[(k+L.length-1)%L.length];}
    if(Controle.apertou(-1,'rb')){padSel=L[(k+1)%L.length];}
    cur=pinCur(S.pins[padSel]);ult.x=cur.x2;ult.y=cur.y2;
    if(Controle.apertou(-1,'a'))pullPin(padSel);
  });
}
})();
</script>
